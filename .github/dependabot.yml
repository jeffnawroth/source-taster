version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
    groups:
      prisma:
        patterns: ["prisma", "@prisma/*"]
    ignore:
      - dependency-name: prisma
        versions: [">=8.0.0-0"]
      - dependency-name: "@prisma/*"
        versions: [">=8.0.0-0"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
