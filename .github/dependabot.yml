# Keeps the SHA pins in .github/workflows/*.yml current.
#
# Pinning actions to commit SHAs (ADR-0016) removes the mutable-tag attack
# path, but a pin that is never updated becomes its own risk: it freezes the
# action at a version that may later be found vulnerable. Dependabot rewrites
# the SHA and the trailing `# vN` comment together, so the pins stay both
# immutable and current.
#
# Deliberately github-actions only. An npm ecosystem entry across eight pnpm
# workspaces would produce a pull-request volume that needs its own decision
# (audit finding F-8, still open).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # The default of 5 is a silent suppressor, not a queue: on 2026-08-22
    # Dependabot opened exactly 5 pull requests and dropped the rest without
    # any signal. actions/setup-node (v4 -> v7), docker/login-action (v3 -> v4)
    # and docker/setup-buildx-action (v3 -> v4) went unproposed for weeks as a
    # result — the opposite of what this file exists to guarantee. The limit is
    # raised past the number of actions in use so the cap can no longer bind.
    open-pull-requests-limit: 15
    commit-message:
      prefix: 'chore(deps)'
