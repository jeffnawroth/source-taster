name: Debug Chrome Status

on:
  workflow_dispatch:

# Least privilege: no job here needs more than reading the
# repository. See ADR-0016.
permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      # Read-only. debug-status.mjs calls client.get() and nothing else.
      #
      # This step used to also run debug-publish.mjs, which calls
      # client.publish() — a real store submission from a workflow named
      # "Debug Status". Releases publish through release.yml (ADR-0019); there
      # is no reason to publish by hand, and a preflight that ships something
      # is a trap.
      - name: Debug status
        env:
          CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
          PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
          EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
        run: |
          mkdir -p /tmp/statuslib
          cd /tmp/statuslib
          npm init -y >/dev/null
          npm install chrome-webstore-upload >/dev/null 2>&1
          cp "$GITHUB_WORKSPACE/debug-status.mjs" /tmp/statuslib/
          node /tmp/statuslib/debug-status.mjs
