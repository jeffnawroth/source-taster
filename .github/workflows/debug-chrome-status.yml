name: Debug Chrome Status

on:
  workflow_dispatch:

# Least privilege: no job here needs more than reading the
# repository. See ADR-0016.
permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Debug status
        env:
          CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
          PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
          EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
        run: |
          mkdir -p /tmp/statuslib
          cd /tmp/statuslib
          npm init -y >/dev/null
          npm install chrome-webstore-upload >/dev/null 2>&1
          cp "$GITHUB_WORKSPACE/debug-status.mjs" /tmp/statuslib/
          node /tmp/statuslib/debug-status.mjs
          cp "$GITHUB_WORKSPACE/debug-publish.mjs" /tmp/statuslib/
          node /tmp/statuslib/debug-publish.mjs
