name: Debug Chrome Upload

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - name: Build and pack
        run: |
          pnpm build
          pnpm --filter @source-taster/extension run pack
      - name: Debug upload
        env:
          CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
          PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
          EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          ZIP_PATH: ${{ github.workspace }}/apps/extension/extension.zip
        run: |
          mkdir -p /tmp/uploadlib
          cd /tmp/uploadlib
          npm init -y >/dev/null
          npm install chrome-webstore-upload >/dev/null 2>&1
          cp "$GITHUB_WORKSPACE/debug-upload.mjs" /tmp/uploadlib/
          node /tmp/uploadlib/debug-upload.mjs
