name: Release

on:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm run -r typecheck
      - run: pnpm eval:ai

  release:
    if: github.actor != 'github-actions[bot]' && !startsWith(github.event.head_commit.message, 'chore(release):')
    needs: [quality]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Determine version bump
        id: version
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "last_tag=$LAST_TAG" >> "$GITHUB_OUTPUT"
          if git log "$LAST_TAG..HEAD" --format="%B" | grep -q -E "^BREAKING CHANGE:|^feat!:|^feat\(.+\)!:"; then
            echo "bump=major" >> "$GITHUB_OUTPUT"
          # --format="%s" prints the subject alone. `--oneline` prefixes the
          # abbreviated SHA, so `^feat` could never match and every release was
          # silently a patch (14 feat: commits since v2.1.34 detected as 0).
          elif git log "$LAST_TAG..HEAD" --format="%s" | grep -qE "^feat(\(.+\))?:"; then
            echo "bump=minor" >> "$GITHUB_OUTPUT"
          else
            echo "bump=patch" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump versions and commit
        run: |
          pnpm bumpp --yes --no-verify --no-push --no-tag --recursive --release "${{ steps.version.outputs.bump }}"
          echo "VERSION=$(node -p "require('./apps/extension/package.json').version")" >> "$GITHUB_ENV"

      - name: Generate changelog
        run: npx conventional-changelog -p conventionalcommits -i CHANGELOG.md -s

      - name: Amend commit with changelog
        run: |
          git add CHANGELOG.md
          git commit --amend --no-edit --no-verify
          git tag -f "v${{ env.VERSION }}"

      - name: Create release PR
        run: |
          BRANCH="chore/release-v${{ env.VERSION }}"
          git push origin --tags --force
          git checkout -b "$BRANCH"
          git push origin "$BRANCH" --force
          gh pr create --base main --head "$BRANCH" \
            --title "chore(release): v${{ env.VERSION }}" \
            --body "Automated release. Version bumped to v${{ env.VERSION }}."
          # --auto: main requires status checks, which are still queued a second
          # after `gh pr create`. Without it the merge is rejected with
          # "N of N required status checks are expected" (see ADR-0010).
          gh pr merge "$BRANCH" --auto --squash --subject "chore(release): v${{ env.VERSION }}" --body ""
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}

      - name: Build extension packages
        run: |
          pnpm build
          pnpm --filter @source-taster/extension run pack

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          files: |
            apps/extension/extension.zip
            apps/extension/extension.xpi
          generate_release_notes: true

      - name: Upload to Chrome Web Store
        if: env.VERSION != ''
        continue-on-error: true
        env:
          CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
          EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
        run: |
          npx -y -p chrome-webstore-upload-cli chrome-webstore-upload upload --source apps/extension/extension.zip

      - name: Publish to Chrome Web Store
        if: env.VERSION != ''
        continue-on-error: true
        env:
          CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
          PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
        run: |
          npx -y -p chrome-webstore-upload-cli chrome-webstore-upload publish --extension-id ${{ secrets.CHROME_EXTENSION_ID }}

      - name: Publish to Firefox Add-ons
        if: env.VERSION != ''
        continue-on-error: true
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          cd apps/extension
          npx web-ext sign \
            --channel listed \
            --source-dir ./extension \
            --api-key "$AMO_JWT_ISSUER" \
            --api-secret "$AMO_JWT_SECRET"

  deploy:
    if: github.actor != 'github-actions[bot]'
    needs: [release]
    runs-on: ubuntu-24.04
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.KEY }}
          port: ${{ secrets.PORT }}
          passphrase: ${{ secrets.PASSPHRASE }}
          script_stop: 'true'
          command_timeout: 30m
          script: |
            set -euo pipefail
            cd ${{ secrets.DEPLOY_PATH }}
            git fetch origin main
            git reset --hard origin/main

            # Free disk space WITHOUT destroying the BuildKit cache.
            # `docker system prune` also removes "unused build cache", which
            # includes the --mount=type=cache pnpm store every apps/*/Dockerfile
            # depends on. That made all four builds cold-install 761 packages
            # each ("reused 0" in the logs) and pushed the deploy past
            # command_timeout: 30m from 2026-08-21 onward. See ADR-0012.
            docker container prune -f
            docker image prune -f

            # build images sequentially (low-memory VPS, 3.7GB RAM)
            for service in landing docs api web; do
              docker compose build "$service"
            done

            docker compose up -d --remove-orphans
