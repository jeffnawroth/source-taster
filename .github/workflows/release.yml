name: Release

on:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm run -r typecheck

  release:
    if: github.actor != 'github-actions[bot]' && !startsWith(github.event.head_commit.message, 'chore(release):')
    needs: [quality]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Determine version bump
        id: version
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "last_tag=$LAST_TAG" >> "$GITHUB_OUTPUT"
          if git log "$LAST_TAG..HEAD" --format="%B" | grep -q -E "^BREAKING CHANGE:|^feat!:|^feat\(.+\)!:"; then
            echo "bump=major" >> "$GITHUB_OUTPUT"
          elif git log "$LAST_TAG..HEAD" --oneline | grep -q "^feat"; then
            echo "bump=minor" >> "$GITHUB_OUTPUT"
          else
            echo "bump=patch" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump versions and commit
        run: |
          pnpm bumpp --yes --no-verify --no-push --no-tag --recursive --release "${{ steps.version.outputs.bump }}"
          echo "VERSION=$(node -p "require('./apps/extension/package.json').version")" >> "$GITHUB_ENV"

      - name: Generate changelog
        run: npx conventional-changelog -p conventionalcommits -i CHANGELOG.md -s

      - name: Amend commit with changelog
        run: |
          git add CHANGELOG.md
          git commit --amend --no-edit --no-verify
          git tag -f "v${{ env.VERSION }}"

      - name: Create release PR
        run: |
          BRANCH="chore/release-v${{ env.VERSION }}"
          git push origin --tags --force
          git checkout -b "$BRANCH"
          git push origin "$BRANCH" --force
          gh pr create --base main --head "$BRANCH" \
            --title "chore(release): v${{ env.VERSION }}" \
            --body "Automated release. Version bumped to v${{ env.VERSION }}."
          gh pr merge "$BRANCH" --squash --subject "chore(release): v${{ env.VERSION }}" --body ""
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}

      - name: Build extension packages
        run: |
          pnpm build
          pnpm --filter @source-taster/extension pack

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          files: |
            apps/extension/extension.zip
            apps/extension/extension.xpi
          generate_release_notes: true

      - name: Publish to Chrome Web Store
        if: env.VERSION != ''
        continue-on-error: true
        env:
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
        run: |
          npx chrome-webstore-upload-cli \
            --client-id "$CHROME_CLIENT_ID" \
            --client-secret "$CHROME_CLIENT_SECRET" \
            --refresh-token "$CHROME_REFRESH_TOKEN" \
            --extension-id "$CHROME_EXTENSION_ID" \
            --zip apps/extension/extension.zip

      - name: Publish to Firefox Add-ons
        if: env.VERSION != ''
        continue-on-error: true
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          cd apps/extension
          npx web-ext sign \
            --channel listed \
            --source-dir ./extension \
            --api-key "$AMO_JWT_ISSUER" \
            --api-secret "$AMO_JWT_SECRET" \
            --use-submission-api

  deploy:
    if: github.actor != 'github-actions[bot]'
    needs: [release]
    runs-on: ubuntu-24.04
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.KEY }}
          port: ${{ secrets.PORT }}
          passphrase: ${{ secrets.PASSPHRASE }}
          script_stop: 'true'
          command_timeout: 30m
          script: |
            set -euo pipefail
            cd ${{ secrets.DEPLOY_PATH }}
            git fetch origin main
            git reset --hard origin/main

            # free disk space before build
            docker system prune -f

            # build images sequentially (low-memory VPS, 3.7GB RAM)
            for service in landing docs api; do
              docker compose build "$service"
            done

            docker compose up -d --remove-orphans
