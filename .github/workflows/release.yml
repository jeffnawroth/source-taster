name: Release

on:
  push:
    branches: [main]

# Two pushes in quick succession must not overtake each other: the second would
# open a release PR against a tree the first has not finished shipping.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Least privilege floor. Jobs that need more declare it themselves and override
# this. See ADR-0016.
permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm run -r typecheck
      - run: pnpm eval:ai

  # release-please runs on EVERY push to main and does one of two things:
  #
  #   1. the push is ordinary work  -> it opens or updates the release PR
  #   2. the push IS the merged release PR -> it creates the tag and the GitHub
  #      release and sets release_created=true
  #
  # Every shipping job below gates on that output and runs in the SAME workflow
  # run, so `actions/checkout` without a `ref:` lands on the release commit —
  # the tree that actually carries the bumped version.
  #
  # The previous hand-rolled pipeline inverted this: it shipped from the commit
  # BEFORE the bump and excluded the release commit with
  # `!startsWith(head_commit.message, 'chore(release):')`, so every deployment
  # surface was permanently one release behind and every tag pointed at an
  # abandoned branch (the "known limitation" recorded in ADR-0013).
  release-please:
    needs: [quality]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    outputs:
      released: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      # The release PR is deliberately NOT auto-merged. Merging it is the human
      # release gate required by AGENTS.md.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ secrets.GH_PAT }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Runs in parallel with publish-images and is NOT a dependency of deploy, so a
  # store rejection fails the run visibly without holding back the deployment.
  # That is why no step here needs `continue-on-error` — which previously hid a
  # total Chrome Web Store outage for ten days.
  publish-extension:
    needs: [release-please]
    if: needs.release-please.outputs.released == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install

      - name: Build extension packages
        run: |
          pnpm build
          pnpm --filter @source-taster/extension run pack

      # No `generate_release_notes`: release-please already wrote the release
      # body from CHANGELOG.md, and GitHub's autogenerated notes would replace it.
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ needs.release-please.outputs.tag }}
          files: |
            apps/extension/extension.zip
            apps/extension/extension.xpi

      # Requires the Google Cloud OAuth consent screen to be "In production"
      # (or the audience to be Internal). Under "Testing" the refresh token
      # expires after 7 days and this fails with "Invalid grant" — which is
      # exactly what froze the store listing at 2.1.34.
      - name: Upload to Chrome Web Store
        env:
          CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
          EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
        run: |
          npx -y -p chrome-webstore-upload-cli chrome-webstore-upload upload --source apps/extension/extension.zip

      - name: Publish to Chrome Web Store
        env:
          CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
          PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
        run: |
          npx -y -p chrome-webstore-upload-cli chrome-webstore-upload publish --extension-id ${{ secrets.CHROME_EXTENSION_ID }}

      - name: Publish to Firefox Add-ons
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          cd apps/extension
          npx web-ext sign \
            --channel listed \
            --source-dir ./extension \
            --api-key "$AMO_JWT_ISSUER" \
            --api-secret "$AMO_JWT_SECRET"

  publish-images:
    needs: [release-please]
    if: needs.release-please.outputs.released == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            dockerfile: apps/api/Dockerfile
            context: .
          - service: web
            dockerfile: apps/web/Dockerfile
            context: .
          - service: docs
            dockerfile: apps/docs/Dockerfile
            context: .
          - service: landing
            dockerfile: apps/landing/Dockerfile
            context: .
          - service: anystyle
            dockerfile: apps/api/Dockerfile.anystyle
            context: apps/api
    steps:
      # No `ref:` — github.sha is the release commit, so the source tree carries
      # the released version. apps/docs/.vitepress/config.mts bakes that version
      # into the rendered navigation at build time.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Built here, not on the production host: that host has 2 vCPU and 3.7GB
      # RAM shared with 16 running containers, and building there starved
      # production (load average 85-117, 48MiB available). See ADR-0015.
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/jeffnawroth/source-taster-${{ matrix.service }}:v${{ needs.release-please.outputs.version }}
            ghcr.io/jeffnawroth/source-taster-${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    needs: [release-please, publish-images]
    if: needs.release-please.outputs.released == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.KEY }}
          port: ${{ secrets.PORT }}
          passphrase: ${{ secrets.PASSPHRASE }}
          script_stop: 'true'
          command_timeout: 30m
          script: |
            set -euo pipefail
            cd ${{ secrets.DEPLOY_PATH }}
            git fetch origin main
            git reset --hard origin/main

            # The host no longer builds anything: images are built in CI and
            # pulled here. Pinning IMAGE_TAG to the released version keeps the
            # deploy reproducible and makes rollback a single command
            # (`IMAGE_TAG=v<older> docker compose up -d`). See ADR-0015.
            export IMAGE_TAG="v${{ needs.release-please.outputs.version }}"
            docker compose pull api web docs landing anystyle
            docker compose up -d --remove-orphans

            docker image prune -f

  # Regression test for the defect this pipeline was rebuilt to fix. ADR-0015
  # assumed no application reads its own version, having searched only
  # `apps/*/src`; apps/docs/.vitepress/config.mts sits outside `src/`, imports
  # apps/extension/package.json and renders it in the navigation. The result was
  # a green release that served the previous version to users.
  verify-release:
    needs: [release-please, deploy]
    if: needs.release-please.outputs.released == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Assert the deployed docs report the released version
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 10); do
            if curl -fsS --max-time 30 -o /tmp/docs.html https://docs.sourcetaster.com/ \
              && grep -qF "v${VERSION}" /tmp/docs.html; then
              echo "docs.sourcetaster.com reports v${VERSION}"
              exit 0
            fi
            echo "attempt ${attempt}/10: v${VERSION} not served yet, retrying in 15s"
            sleep 15
          done
          echo "::error::docs.sourcetaster.com never reported v${VERSION}. The deployed image was most likely built from the wrong commit."
          exit 1
