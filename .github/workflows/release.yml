name: Release

on:
  push:
    branches: [main]

# Two pushes in quick succession must not overtake each other: the second would
# open a release PR against a tree the first has not finished shipping.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Least privilege floor. Jobs that need more declare it themselves and override
# this. See ADR-0016.
permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm run -r typecheck
      - run: pnpm eval:ai

  # release-please runs on EVERY push to main and does one of two things:
  #
  #   1. the push is ordinary work  -> it opens or updates the release PR
  #   2. the push IS the merged release PR -> it creates the tag and the GitHub
  #      release and sets release_created=true
  #
  # Every shipping job below gates on that output and runs in the SAME workflow
  # run, so `actions/checkout` without a `ref:` lands on the release commit —
  # the tree that actually carries the bumped version.
  #
  # The previous hand-rolled pipeline inverted this: it shipped from the commit
  # BEFORE the bump and excluded the release commit with
  # `!startsWith(head_commit.message, 'chore(release):')`, so every deployment
  # surface was permanently one release behind and every tag pointed at an
  # abandoned branch (the "known limitation" recorded in ADR-0013).
  release-please:
    needs: [quality]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    outputs:
      released: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      # The release PR is deliberately NOT auto-merged. Merging it is the human
      # release gate required by AGENTS.md.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ secrets.GH_PAT }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Runs in parallel with publish-images and is NOT a dependency of deploy, so a
  # store rejection fails the run visibly without holding back the deployment.
  # That is why no step here needs `continue-on-error` — which previously hid a
  # total Chrome Web Store outage for ten days.
  publish-extension:
    needs: [release-please]
    if: needs.release-please.outputs.released == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install

      - name: Build extension packages
        run: |
          pnpm build
          pnpm --filter @source-taster/extension run pack

      # No `generate_release_notes`: release-please already wrote the release
      # body from CHANGELOG.md, and GitHub's autogenerated notes would replace it.
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ needs.release-please.outputs.tag }}
          files: |
            apps/extension/extension.zip
            apps/extension/extension.xpi

      # Requires the Google Cloud OAuth consent screen to be "In production"
      # (or the audience to be Internal). Under "Testing" the refresh token
      # expires after 7 days and this fails with "Invalid grant" — which is
      # exactly what froze the store listing at 2.1.34.
      - name: Upload to Chrome Web Store
        env:
          CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
          EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
        run: |
          npx -y -p chrome-webstore-upload-cli chrome-webstore-upload upload --source apps/extension/extension.zip

      - name: Publish to Chrome Web Store
        env:
          CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
          PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
        run: |
          npx -y -p chrome-webstore-upload-cli chrome-webstore-upload publish --extension-id ${{ secrets.CHROME_EXTENSION_ID }}

      - name: Publish to Firefox Add-ons
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          cd apps/extension
          npx web-ext sign \
            --channel listed \
            --source-dir ./extension \
            --api-key "$AMO_JWT_ISSUER" \
            --api-secret "$AMO_JWT_SECRET"

  # web/docs/landing dropped from this matrix: they moved to Cloudflare Pages
  # (deploy-pages.yml, triggered independently on push to main) and nothing
  # consumes a Docker image of them anymore. Only api/anystyle still run as
  # containers (Cloud Run).
  publish-images:
    needs: [release-please]
    if: needs.release-please.outputs.released == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            dockerfile: apps/api/Dockerfile
            context: .
          - service: anystyle
            dockerfile: apps/api/Dockerfile.anystyle
            context: apps/api
    steps:
      # No `ref:` — github.sha is the release commit, so the source tree carries
      # the released version.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - run: gcloud auth configure-docker europe-west3-docker.pkg.dev --quiet

      # Built here, not on the production host: that host has 2 vCPU and 3.7GB
      # RAM shared with 16 running containers, and building there starved
      # production (load average 85-117, 48MiB available). See ADR-0015.
      # Pushed to both registries directly from the one build — GHCR stays the
      # public/human-facing image history, Artifact Registry is what Cloud Run
      # actually deploys from.
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/jeffnawroth/source-taster-${{ matrix.service }}:v${{ needs.release-please.outputs.version }}
            ghcr.io/jeffnawroth/source-taster-${{ matrix.service }}:latest
            europe-west3-docker.pkg.dev/source-taster-cws/source-taster/${{ matrix.service }}:v${{ needs.release-please.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # Cloud Run, not the old Hetzner VPS over SSH (see docs/decisions for the
  # migration). `gcloud run deploy` only changes the image on the existing
  # service - env vars, secrets, scaling and the anystyle IAM invoker binding
  # all carry over from the current revision untouched. It also doesn't return
  # until the new revision is serving traffic, which structurally rules out
  # the stale-deploy defect ADR-0015/verify-release was written to catch.
  deploy:
    needs: [release-please, publish-images]
    if: needs.release-please.outputs.released == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Deploy anystyle
        run: |
          gcloud run deploy source-taster-anystyle \
            --image=europe-west3-docker.pkg.dev/source-taster-cws/source-taster/anystyle:v${{ needs.release-please.outputs.version }} \
            --project=source-taster-cws \
            --region=europe-west3 \
            --quiet

      - name: Deploy api
        run: |
          gcloud run deploy source-taster-api \
            --image=europe-west3-docker.pkg.dev/source-taster-cws/source-taster/api:v${{ needs.release-please.outputs.version }} \
            --project=source-taster-cws \
            --region=europe-west3 \
            --quiet

  # Was a regression test for a stale-deploy defect (ADR-0015) that checked
  # docs.sourcetaster.com's rendered version string. docs now deploys via
  # Cloudflare Pages on its own trigger (deploy-pages.yml) - decoupled from
  # this release, so its content no longer proves anything about *this* run.
  # `gcloud run deploy` itself already blocks until the new revision is
  # healthy and serving (see the `deploy` job), which is the same guarantee
  # ADR-0015 was after; this is just a smoke test that the result is actually
  # reachable from the internet, not merely reported healthy internally.
  verify-release:
    needs: [release-please, deploy]
    if: needs.release-please.outputs.released == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Smoke-test the deployed API
        run: |
          set -euo pipefail
          for attempt in $(seq 1 10); do
            if curl -fsS --max-time 30 https://api.sourcetaster.com/health | grep -qF '"status":"ok"'; then
              echo "api.sourcetaster.com/health is reachable and healthy"
              exit 0
            fi
            echo "attempt ${attempt}/10: not healthy yet, retrying in 15s"
            sleep 15
          done
          echo "::error::api.sourcetaster.com/health never reported healthy after deploy."
          exit 1
