name: Release

on:
  push:
    branches: [main]

# Least privilege floor. Jobs that need more (release: contents+PRs,
# publish-images: packages) declare it themselves and override this.
permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm run -r typecheck
      - run: pnpm eval:ai

  release:
    if: github.actor != 'github-actions[bot]' && !startsWith(github.event.head_commit.message, 'chore(release):')
    needs: [quality]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    outputs:
      version: ${{ steps.released_version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Determine version bump
        id: version
        run: |
          # Do NOT use `git describe --tags`: release tags are created before the
          # release PR is squash-merged, so they point at the pre-squash commit on
          # the abandoned release branch and are never reachable from main. On
          # 2026-08-22 `git describe --tags --abbrev=0 main` returned v2.1.2 while
          # the released version was v2.1.39 — a ~150-commit range spanning months.
          # The `chore(release):` commits ARE on main (they are the squash results),
          # so the previous release commit is the reliable boundary. See ADR-0013.
          LAST_RELEASE=$(git log --format="%H" --grep="^chore(release):" --max-count=1 || true)
          RANGE="${LAST_RELEASE:+$LAST_RELEASE..}HEAD"
          echo "last_release=${LAST_RELEASE:-<none>}" >> "$GITHUB_OUTPUT"
          if git log "$RANGE" --format="%B" | grep -q -E "^BREAKING CHANGE:|^feat!:|^feat\(.+\)!:"; then
            echo "bump=major" >> "$GITHUB_OUTPUT"
          # --format="%s" prints the subject alone. `--oneline` prefixes the
          # abbreviated SHA, so `^feat` could never match and every release was
          # silently a patch (14 feat: commits since v2.1.34 detected as 0).
          elif git log "$RANGE" --format="%s" | grep -qE "^feat(\(.+\))?:"; then
            echo "bump=minor" >> "$GITHUB_OUTPUT"
          else
            echo "bump=patch" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump versions and commit
        run: |
          pnpm bumpp --yes --no-verify --no-push --no-tag --recursive --release "${{ steps.version.outputs.bump }}"
          echo "VERSION=$(node -p "require('./apps/extension/package.json').version")" >> "$GITHUB_ENV"

      - name: Expose released version
        id: released_version
        run: echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Generate changelog
        run: npx conventional-changelog -p conventionalcommits -i CHANGELOG.md -s

      - name: Amend commit with changelog
        run: |
          git add CHANGELOG.md
          git commit --amend --no-edit --no-verify
          git tag -f "v${{ env.VERSION }}"

      - name: Create release PR
        run: |
          BRANCH="chore/release-v${{ env.VERSION }}"
          git push origin --tags --force
          git checkout -b "$BRANCH"
          git push origin "$BRANCH" --force
          gh pr create --base main --head "$BRANCH" \
            --title "chore(release): v${{ env.VERSION }}" \
            --body "Automated release. Version bumped to v${{ env.VERSION }}."
          # --auto: main requires status checks, which are still queued a second
          # after `gh pr create`. Without it the merge is rejected with
          # "N of N required status checks are expected" (see ADR-0010).
          gh pr merge "$BRANCH" --auto --squash --subject "chore(release): v${{ env.VERSION }}" --body ""
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}

      - name: Build extension packages
        run: |
          pnpm build
          pnpm --filter @source-taster/extension run pack

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: v${{ env.VERSION }}
          files: |
            apps/extension/extension.zip
            apps/extension/extension.xpi
          generate_release_notes: true

      - name: Upload to Chrome Web Store
        if: env.VERSION != ''
        continue-on-error: true
        env:
          CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
          EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
        run: |
          npx -y -p chrome-webstore-upload-cli chrome-webstore-upload upload --source apps/extension/extension.zip

      - name: Publish to Chrome Web Store
        if: env.VERSION != ''
        continue-on-error: true
        env:
          CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
          PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
        run: |
          npx -y -p chrome-webstore-upload-cli chrome-webstore-upload publish --extension-id ${{ secrets.CHROME_EXTENSION_ID }}

      - name: Publish to Firefox Add-ons
        if: env.VERSION != ''
        continue-on-error: true
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          cd apps/extension
          npx web-ext sign \
            --channel listed \
            --source-dir ./extension \
            --api-key "$AMO_JWT_ISSUER" \
            --api-secret "$AMO_JWT_SECRET"

  publish-images:
    needs: [release]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            dockerfile: apps/api/Dockerfile
            context: .
          - service: web
            dockerfile: apps/web/Dockerfile
            context: .
          - service: docs
            dockerfile: apps/docs/Dockerfile
            context: .
          - service: landing
            dockerfile: apps/landing/Dockerfile
            context: .
          - service: anystyle
            dockerfile: apps/api/Dockerfile.anystyle
            context: apps/api
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Built here, not on the production host: that host has 2 vCPU and 3.7GB
      # RAM shared with 16 running containers, and building there starved
      # production (load average 85-117, 48MiB available). See ADR-0015.
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/jeffnawroth/source-taster-${{ matrix.service }}:v${{ needs.release.outputs.version }}
            ghcr.io/jeffnawroth/source-taster-${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    if: github.actor != 'github-actions[bot]'
    needs: [release, publish-images]
    runs-on: ubuntu-24.04
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.KEY }}
          port: ${{ secrets.PORT }}
          passphrase: ${{ secrets.PASSPHRASE }}
          script_stop: 'true'
          command_timeout: 30m
          script: |
            set -euo pipefail
            cd ${{ secrets.DEPLOY_PATH }}
            git fetch origin main
            git reset --hard origin/main

            # The host no longer builds anything: images are built in CI and
            # pulled here. Pinning IMAGE_TAG to the released version keeps the
            # deploy reproducible and makes rollback a single command
            # (`IMAGE_TAG=v<older> docker compose up -d`). See ADR-0015.
            export IMAGE_TAG="v${{ needs.release.outputs.version }}"
            docker compose pull api web docs landing anystyle
            docker compose up -d --remove-orphans

            docker image prune -f
