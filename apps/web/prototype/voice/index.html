<!doctype html>
<!--
  PROTOTYPE (#192), throwaway. Question: how does Source Taster speak in DE and EN?
  Four voices of the same strings on one page, in the "Glass" identity (#191):
    H = today's catalog (packages/i18n, unchanged), A = Explanatory, B = Brief, C = Next step first.
  Orthogonal toggles: DE address (Sie/du), EN capitalisation of glossary terms, width (web/360), theme.
  Held constant in every voice: Verdict and Status labels, terminology (Prüfung, Kontingent, Plan, Urteil),
  and every factual claim (only register and order change).
  Open: double-click this file. URL params: ?v=H|A|B|C &lang=de|en &addr=sie|du &case=cap|low &w=web|360 &theme=light|dark &keys=1
  ←/→ cycle the voices. Fonts load from Google Fonts (prototype only; the product self-hosts).
-->
<html lang="de" data-theme="light" data-w="web">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Source Taster · Voice and tone</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --sans: 'Atkinson Hyperlegible Next', ui-sans-serif, system-ui, sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, Menlo, monospace;
  --r-xl: 24px; --r-lg: 20px; --r-md: 14px; --r-sm: 10px;
  --spring-soft: linear(0, 0.06 2%, 0.23 5.5%, 0.5 10.5%, 0.75 16%, 0.9 21.5%, 0.985 27%, 1.02 32.5%, 1.03 38%, 1.022 45%, 1.008 55%, 0.999 68%, 1);
}
html[data-theme=light] {
  color-scheme: light;
  --outer: oklch(0.925 0.012 265); --bg: oklch(0.978 0.007 262); --bg-glow: oklch(0.925 0.055 252 / 0.85);
  --surface: oklch(1 0 0); --surface-2: oklch(0.966 0.01 262);
  --line: oklch(0.28 0.05 265 / 0.11); --line-2: oklch(0.28 0.05 265 / 0.19); --line-strong: oklch(0.38 0.05 265 / 0.62);
  --ink: oklch(0.2 0.035 265); --ink-2: oklch(0.37 0.035 265); --ink-3: oklch(0.47 0.03 265);
  --accent: oklch(0.5 0.2 264); --accent-ink: oklch(1 0 0); --accent-text: oklch(0.47 0.2 265); --accent-soft: oklch(0.5 0.2 264 / 0.08);
  --focus: oklch(0.5 0.2 264);
  --ok: oklch(0.56 0.15 152); --diff: oklch(0.6 0.13 68); --mixed: oklch(0.54 0.2 5); --doi: oklch(0.54 0.21 28); --miss: oklch(0.47 0.19 18); --unk: oklch(0.52 0.025 265);
  --on: oklch(1 0 0); --warn: oklch(0.6 0.13 68); --danger: oklch(0.5 0.19 25);
  --shadow: 0 1px 2px oklch(0.3 0.06 265 / 0.05), 0 12px 30px -18px oklch(0.3 0.08 265 / 0.2);
  --glass: oklch(1 0 0 / 0.62); --glass-line: oklch(0.32 0.06 265 / 0.14);
  --glass-shadow: 0 1px 1px oklch(0.3 0.08 265 / 0.08), 0 10px 24px -12px oklch(0.32 0.12 265 / 0.22), 0 40px 70px -30px oklch(0.32 0.12 265 / 0.36);
  --hero-1: oklch(0.8 0.13 238 / 0.55); --hero-2: oklch(0.82 0.12 292 / 0.5);
  --keybg: oklch(0.97 0.03 90); --keyink: oklch(0.38 0.06 70);
}
html[data-theme=dark] {
  color-scheme: dark;
  --outer: oklch(0.1 0.01 265); --bg: oklch(0.15 0.017 266); --bg-glow: oklch(0.36 0.15 266 / 0.5);
  --surface: oklch(0.195 0.019 266); --surface-2: oklch(0.172 0.017 266);
  --line: oklch(1 0 0 / 0.085); --line-2: oklch(1 0 0 / 0.14); --line-strong: oklch(1 0 0 / 0.42);
  --ink: oklch(0.97 0.004 265); --ink-2: oklch(0.83 0.012 265); --ink-3: oklch(0.71 0.016 265);
  --accent: oklch(0.77 0.13 262); --accent-ink: oklch(0.17 0.04 265); --accent-text: oklch(0.8 0.12 262); --accent-soft: oklch(0.77 0.13 262 / 0.11);
  --focus: oklch(0.8 0.12 262);
  --ok: oklch(0.8 0.17 152); --diff: oklch(0.83 0.15 85); --mixed: oklch(0.74 0.18 5); --doi: oklch(0.72 0.19 28); --miss: oklch(0.68 0.2 20); --unk: oklch(0.72 0.02 265);
  --on: oklch(0.16 0.02 265); --warn: oklch(0.83 0.15 85); --danger: oklch(0.72 0.19 28);
  --shadow: 0 0 0 1px oklch(0 0 0 / 0.45), 0 20px 44px -28px oklch(0 0 0 / 0.9);
  --glass: oklch(0.22 0.025 266 / 0.66); --glass-line: oklch(0 0 0 / 0.6);
  --glass-shadow: 0 10px 24px -12px oklch(0 0 0 / 0.7), 0 40px 80px -24px oklch(0 0 0 / 0.85);
  --hero-1: oklch(0.46 0.2 266 / 0.55); --hero-2: oklch(0.42 0.17 300 / 0.45);
  --keybg: oklch(0.28 0.04 80); --keyink: oklch(0.88 0.08 85);
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { font: 400 15px/1.5 var(--sans); color: var(--ink); background: var(--outer); -webkit-font-smoothing: antialiased; }
h1, h2, h3, p { margin: 0; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
svg { display: block; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 8px; }

.app { min-height: 100vh; background: var(--bg); position: relative; isolation: isolate; padding-bottom: 120px; }
.app::before { content: ''; position: absolute; inset: 0; z-index: -1; pointer-events: none; background: radial-gradient(70% 30% at 50% -8%, var(--bg-glow), transparent 72%); }
.top { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 12px; padding: 12px 24px; background: var(--glass); backdrop-filter: blur(18px) saturate(1.4); -webkit-backdrop-filter: blur(18px) saturate(1.4); border-bottom: 1px solid var(--glass-line); }
.top .mark { width: 26px; height: 26px; border-radius: 7px; background: var(--accent); display: grid; place-items: center; }
.top b { font-weight: 700; letter-spacing: -0.01em; }
.top .tag { font: 500 11.5px/1 var(--mono); padding: 5px 8px; border-radius: 99px; background: var(--accent-soft); color: var(--accent-text); }
.wrap { max-width: 1120px; margin: 0 auto; padding: 28px 24px 0; }
html[data-w="360"] .wrap { max-width: 360px; padding: 20px 16px 0; background: var(--bg); box-shadow: 0 0 0 1px var(--line-2); min-height: 100vh; }

.rule { border-radius: var(--r-lg); padding: 18px 20px; background: var(--surface); box-shadow: var(--shadow); border: 1px solid var(--line); }
.rule h1 { font: 700 26px/1.15 var(--sans); letter-spacing: -0.025em; }
.rule .axes { font: 500 12px/1 var(--mono); color: var(--ink-3); margin-top: 8px; }
.rule ul { margin: 12px 0 0; padding-left: 18px; color: var(--ink-2); }
.rule li + li { margin-top: 4px; }
.rule .const { margin-top: 12px; font-size: 13px; color: var(--ink-3); }

.sec { margin-top: 36px; }
.sec > h2 { font: 700 13px/1 var(--sans); letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 12px; }
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; align-items: start; }
html[data-w="360"] .grid { grid-template-columns: 1fr; }
@media (max-width: 760px) { .grid { grid-template-columns: 1fr; } }
.card { border-radius: var(--r-lg); background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); padding: 18px; min-width: 0; }
.card .cap { font: 500 11.5px/1 var(--mono); color: var(--ink-3); margin-bottom: 12px; }
.card p + p, .card .t + .t { margin-top: 8px; }
.t { color: var(--ink-2); text-wrap: pretty; }
.t.lead { color: var(--ink); font-size: 16px; }
.t.h { font: 700 18px/1.3 var(--sans); color: var(--ink); letter-spacing: -0.012em; text-wrap: balance; }
.t.big { font: 700 26px/1.2 var(--sans); color: var(--ink); letter-spacing: -0.025em; text-wrap: balance; }
.t.next { color: var(--ink); font-weight: 600; }
.t.small { font-size: 13.5px; color: var(--ink-3); }
.t.missing { font-style: italic; color: var(--ink-3); }

.btns { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.btn { display: inline-flex; align-items: center; min-height: 36px; padding: 7px 14px; border-radius: 11px; font-weight: 600; font-size: 14px; background: var(--surface-2); border: 1px solid var(--line-2); color: var(--ink); text-align: left; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.btn.danger { background: var(--danger); color: oklch(1 0 0); border-color: transparent; }
html[data-theme=dark] .btn.danger { color: oklch(0.16 0.02 265); }
.btn.link { background: none; border: 0; padding: 7px 4px; color: var(--accent-text); }
.btn .t { color: inherit; font: inherit; }

.paste { border-radius: var(--r-md); border: 1.5px solid var(--line-strong); background: var(--surface); margin-top: 14px; overflow: hidden; }
.paste .ph { font: 400 13.5px/1.6 var(--mono); color: var(--ink-3); padding: 14px 16px; min-height: 92px; }
.paste .bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 8px 10px 10px 16px; border-top: 1px solid var(--line); }
.paste .bar .t { flex: 1 1 180px; font-size: 13.5px; color: var(--ink-3); }

.vchip { display: inline-flex; align-items: center; gap: 8px; min-height: 28px; padding: 3px 12px 3px 6px; border-radius: 99px; font-size: 13.5px; font-weight: 700; color: var(--ink); background: color-mix(in oklch, var(--c) 10%, var(--surface)); box-shadow: inset 0 0 0 1px color-mix(in oklch, var(--c) 36%, transparent); white-space: nowrap; }
.vchip svg { width: 20px; height: 20px; color: var(--c); }
.vchip .n { font-variant-numeric: tabular-nums; color: var(--ink-2); font-weight: 600; }
.vchip.st { --c: var(--ink-3); background: transparent; box-shadow: inset 0 0 0 1.5px var(--line-strong); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
.vhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
.vhead .ref { font-size: 13px; color: var(--ink-3); }
.more { margin-top: 12px; font-size: 13.5px; font-weight: 600; color: var(--accent-text); }

.hero { position: relative; overflow: hidden; border-radius: var(--r-xl); padding: 22px; border: 1px solid var(--glass-line); box-shadow: var(--glass-shadow); background: radial-gradient(60% 80% at 0% 0%, var(--hero-1), transparent 70%), radial-gradient(60% 80% at 100% 100%, var(--hero-2), transparent 70%), var(--surface); }
.hero .human { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line-2); }

.banner { display: flex; gap: 12px; align-items: flex-start; border-radius: var(--r-md); padding: 14px; background: color-mix(in oklch, var(--k) 9%, var(--surface)); box-shadow: inset 0 0 0 1px color-mix(in oklch, var(--k) 34%, transparent); }
.banner + .banner { margin-top: 10px; }
.banner > svg { width: 20px; height: 20px; flex: none; margin-top: 1px; color: var(--k); fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; }
.banner .body { min-width: 0; flex: 1; }
.banner .t { color: var(--ink); }
.banner .btns { margin-top: 10px; }
.k-info { --k: var(--accent); } .k-warn { --k: var(--warn); } .k-err { --k: var(--danger); } .k-neutral { --k: var(--ink-3); }

.lim { display: flex; gap: 10px; align-items: flex-start; padding: 10px 0; border-top: 1px solid var(--line); }
.lim:first-of-type { border-top: 0; padding-top: 0; }
.lim .src { font: 500 12px/1.4 var(--mono); color: var(--ink-3); flex: none; width: 74px; padding-top: 2px; }
.lim .t { font-size: 14px; }

.toast { display: inline-flex; align-items: center; gap: 10px; padding: 10px 16px; border-radius: 99px; background: var(--glass); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid var(--glass-line); box-shadow: var(--glass-shadow); font-weight: 600; max-width: 100%; }
.toast + .toast { margin-top: 10px; }
.toast .t { color: var(--ink); }
.toast svg { width: 18px; height: 18px; flex: none; fill: none; stroke: var(--accent); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }

.dialog { border-radius: var(--r-xl); padding: 22px; background: var(--surface); border: 1px solid var(--line-2); box-shadow: var(--glass-shadow); }
.dialog .note { margin-top: 12px; padding: 12px; border-radius: var(--r-sm); background: var(--surface-2); }
.dialog .ack { display: flex; gap: 10px; align-items: flex-start; margin-top: 14px; }
.dialog .ack .box { width: 18px; height: 18px; border-radius: 5px; border: 1.5px solid var(--line-strong); flex: none; margin-top: 2px; }
.dialog .ack .t { color: var(--ink); font-size: 14px; }

.btnrow { display: grid; grid-template-columns: max-content 1fr; gap: 10px 14px; align-items: center; }
.btnrow .lab { font: 500 11.5px/1.3 var(--mono); color: var(--ink-3); }
html[data-w="360"] .btnrow { grid-template-columns: 1fr; gap: 4px; }
html[data-w="360"] .btnrow .lab { margin-top: 8px; }

.qs { margin: 0; padding-left: 20px; color: var(--ink-2); }
.qs li + li { margin-top: 10px; }
.qs b { color: var(--ink); }
.qs code { font: 400 12.5px var(--mono); }

/* key overlay: maps every string back to packages/i18n */
.key { display: none; }
html[data-keys] .key { display: block; margin-top: 4px; padding: 6px 8px; border-radius: 8px; background: var(--keybg); color: var(--keyink); font: 400 11.5px/1.45 var(--mono); white-space: normal; text-align: left; font-weight: 400; }
html[data-keys] .key b { font-weight: 500; }
html[data-keys] .btn { flex-direction: column; align-items: flex-start; }

/* dev bar: deliberately not part of the design */
.dev { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); z-index: 10; display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 6px; padding: 6px; max-width: calc(100vw - 16px); border-radius: 16px; background: oklch(0.18 0.01 265); color: oklch(0.96 0 0); box-shadow: 0 12px 40px -8px oklch(0 0 0 / 0.5); font: 500 13px/1 var(--sans); }
.dev button { padding: 8px 10px; border-radius: 10px; }
.dev button:hover { background: oklch(1 0 0 / 0.1); }
.dev .cur { min-width: 200px; text-align: center; font-weight: 700; }
.dev .seg { display: inline-flex; border-radius: 10px; background: oklch(1 0 0 / 0.08); }
.dev .seg button[aria-pressed=true] { background: oklch(1 0 0 / 0.92); color: oklch(0.18 0.01 265); }
.dev .seg button:disabled { opacity: 0.35; cursor: default; }
.dev .sep { width: 1px; height: 20px; background: oklch(1 0 0 / 0.15); }
</style>
</head>

<script>
/* ======================================================================
   Copy data. Each field: F(key, H, A, B, C); each voice is [en, de],
   where de is one string or [Sie form, du form]. H = today's catalog
   (null = new string, not in the catalog). ⟦Term⟧ marks a glossary term
   whose EN capitalisation the "Check / check" toggle switches.
   ====================================================================== */
const F = (key, H, A, B, C) => ({ key, H, A, B, C });

const VOICES = {
  H: { de: 'Heute', en: 'Today',
       rules: { de: ['Unveränderter Katalog aus packages/i18n.', 'Anrede gemischt: meist Sie, Anmeldung, Import, Teile des Kontingents und DPA in du.', 'Glossarbegriffe im Englischen großgeschrieben.'],
                en: ['Unchanged catalog from packages/i18n.', 'Mixed German address: mostly Sie, with du in sign-in, import, parts of Quota and the DPA.', 'Glossary terms capitalised in English.'] } },
  A: { de: 'Erklärend', en: 'Explanatory',
       rules: { de: ['Ganze Sätze in der Reihenfolge Fakt, Grund, nächster Schritt.', 'Vorbehalte werden ausgeschrieben: „Das ist kein Beleg dafür, dass …“', 'Buttons nennen Verb und Objekt („Referenzen prüfen“).'],

/* ---------- state ---------- */
const P = new URLSearchParams(location.search);
const pick = (k, d, ok) => (ok.includes(P.get(k)) ? P.get(k) : d);
const st = {
  v: pick('v', 'A', ORDER), lang: pick('lang', 'de', ['de', 'en']), addr: pick('addr', 'sie', ['sie', 'du']),
  case: pick('case', 'low', ['cap', 'low']), w: pick('w', 'web', ['web', '360']), theme: pick('theme', 'light', ['light', 'dark']),
  keys: P.get('keys') === '1' ? '1' : '0',
};
const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function applyCase(s) {
  if (st.lang !== 'en' || st.v === 'H') return s.replace(/[⟦⟧]/g, '');
  return s.replace(/⟦([^⟧]+)⟧/g, (m, term, off, all) => {
    if (st.case === 'cap') return term;
    const before = all.slice(0, off).replace(/[⟦⟧]/g, '').trimEnd();
    const sentenceStart = before === '' || /[.!?]$/.test(before);
    return sentenceStart ? term : term.charAt(0).toLowerCase() + term.slice(1);
  });
}
function pickLang(pair, voice) {
  if (!pair) return null;
  if (st.lang === 'en') return pair[0];
  const de = pair[1];
  return Array.isArray(de) ? de[voice === 'H' ? 0 : st.addr === 'du' ? 1 : 0] : de;
}
function raw(f) { return pickLang(f[st.v], st.v); }
/* one string as an element; returns '' when a voice leaves the field out */
function T(f, cls = '', tag = 'p', opt = {}) {
  const s = raw(f);
  const today = pickLang(f.H, 'H');
  const key = `<span class="key"><b>${esc(f.key)}</b>${st.v !== 'H' && today ? ' · today: ' + esc(today) : ''}</span>`;
  if (s == null) {
    if (st.v === 'H' && !opt.quietWhenMissing) return `<${tag} class="t missing ${cls}">${st.lang === 'de' ? '(neu, nicht im Katalog)' : '(new, not in the catalog)'}${key}</${tag}>`;
    return '';
  }
  return `<${tag} class="t ${cls}">${esc(applyCase(s))}${key}</${tag}>`;
}
const L = (de, en) => (st.lang === 'de' ? de : en);
const vlabel = (k) => VL[k][st.lang === 'de' ? 1 : 0];
const chip = (k, n) => `<span class="vchip" style="--c:var(--${k})"><svg aria-hidden="true"><use href="#g-${k}"/></svg>${esc(vlabel(k))}${n != null ? ` <span class="n">${n}</span>` : ''}</span>`;
const btn = (f, kind = '') => `<button class="btn ${kind}">${T(f, '', 'span')}</button>`;
const ico = (id) => `<svg aria-hidden="true" viewBox="0 0 24 24"><use href="#${id}"/></svg>`;

      <div class="toast">${ico('i-check')}${T(S.qStarted, '', 'span')}</div>
      <div>
        <div class="banner k-warn">${ico('i-warn')}<div class="body">${T(S.refLimit)}</div></div>
        <div class="banner k-neutral">${ico('i-clock')}<div class="body">${T(S.abuse)}</div></div>
      </div>
    </div></section>

  <section class="sec"><h2>${L('5 · Heikle Momente', '5 · Sensitive moments')}</h2>
    <div class="grid">
      <div class="dialog">
        ${T(S.delHead, 'h')}<div style="height:6px"></div>${T(S.delContent)}${T(S.delQuota)}
        <div class="note">${T(S.delRetention, 'small')}</div>
        <div class="ack"><span class="box"></span>${T(S.delAck, '', 'span')}</div>
        <div class="btns">${btn(S.delConfirm, 'danger')}${btn(S.delCancel)}</div>
      </div>
      <div class="banner k-info">${ico('i-info')}<div class="body">${T(S.aiUnc)}</div></div>
    </div></section>

  <section class="sec"><h2>${L('6 · Schaltflächen und Bestätigungen', '6 · Buttons and confirmations')}</h2>
    <div class="grid">
      <div class="card"><div class="btnrow">
        ${[['structuring_action', S.bStructure, 'primary'], ['check_cancel', S.bCancel, ''], ['correction_apply', S.bApply, ''], ['correction_copy', S.bCopy, ''], ['revision_save_recheck', S.bRecheck, 'primary'], ['override_judge', S.bJudge, ''], ['report_ui_create', S.bReport, '']]
          .map(([k, f, kind]) => `<span class="lab">${k}</span><span>${btn(f, kind)}</span>`).join('')}
      </div></div>
      <div>
        <div class="toast">${ico('i-check')}${T(S.copied, '', 'span')}</div><br>
        <div class="toast">${ico('i-check')}${T(S.overSaved, '', 'span')}</div>
      </div>
    </div></section>

  <section class="sec"><h2>${L('7 · Offene Begriffsfragen (in keiner Stimme variiert)', '7 · Open terminology questions (not varied by any voice)')}</h2>
    <div class="card"><ol class="qs">${QUESTIONS.map(([de, en]) => `<li>${L(de, en)}</li>`).join('')}</ol></div>
  </section>`;

  /* chrome */
  const html = document.documentElement;
  html.lang = st.lang; html.dataset.theme = st.theme; html.dataset.w = st.w;
  if (st.keys === '1') html.dataset.keys = ''; else delete html.dataset.keys;
  document.getElementById('cur').textContent = `${st.v} · ${V[st.lang]}`;
  document.querySelectorAll('.dev .seg button').forEach((b) => {
    const k = b.dataset.k;
    b.setAttribute('aria-pressed', k === 'keys' ? String(st.keys === '1') : String(st[k] === b.dataset.v));
  });
  document.querySelectorAll('#seg-addr button').forEach((b) => (b.disabled = st.lang !== 'de' || st.v === 'H'));
  document.querySelectorAll('#seg-case button').forEach((b) => (b.disabled = st.lang !== 'en' || st.v === 'H'));
  const q = new URLSearchParams({ v: st.v, lang: st.lang, addr: st.addr, case: st.case, w: st.w, theme: st.theme });
  if (st.keys === '1') q.set('keys', '1');
  history.replaceState(null, '', `?${q}`);
}

const step = (d) => { st.v = ORDER[(ORDER.indexOf(st.v) + d + ORDER.length) % ORDER.length]; render(); };
document.getElementById('prev').onclick = () => step(-1);
document.getElementById('next').onclick = () => step(1);
document.querySelectorAll('.dev .seg button').forEach((b) => (b.onclick = () => {
  const k = b.dataset.k;
  st[k] = k === 'keys' ? (st.keys === '1' ? '0' : '1') : b.dataset.v;
  render();
}));
addEventListener('keydown', (e) => {
  const el = document.activeElement;
  if (el && (/^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName) || el.isContentEditable)) return;
  if (e.key === 'ArrowLeft') step(-1);
  if (e.key === 'ArrowRight') step(1);
});
render();
</script>
</body>
</html>
