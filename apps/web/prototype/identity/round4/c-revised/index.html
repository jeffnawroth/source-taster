<!doctype html>
<html lang="de" data-theme="light" data-w="web">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Source Taster · Glass</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8.4' fill='%233b5bdb'/%3E%3Cpath transform='translate(21.3 12.2) scale(1.12)' fill='%23fff' fill-opacity='.55' d='M4.6 0C4.6 6.3 1.7 10.3-3.5 11.7C-4.5 12-5.1 10.8-4.3 10.2C-1.8 8.6-.4 6.8-.1 4.6A4.6 4.6 0 1 1 4.6 0Z'/%3E%3Cpath transform='translate(10.2 12.2) scale(1.12)' fill='%23fff' d='M4.6 0C4.6 6.3 1.7 10.3-3.5 11.7C-4.5 12-5.1 10.8-4.3 10.2C-1.8 8.6-.4 6.8-.1 4.6A4.6 4.6 0 1 1 4.6 0Z'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   SOURCE TASTER · "Glass" (light-first) · round 4
   Calm work surfaces. Glass only where something floats.
   Rhythm: 4-pt spacing (4 8 12 16 24 32 48). Type: 11.5 / 13 / 14.5 / 16 / 18 / 22 / 30 / 40 / 128.
   ===================================================================== */
@property --fx1 { syntax: '<percentage>'; inherits: true; initial-value: 18%; }
@property --fy1 { syntax: '<percentage>'; inherits: true; initial-value: 20%; }
@property --fx2 { syntax: '<percentage>'; inherits: true; initial-value: 82%; }
@property --fy2 { syntax: '<percentage>'; inherits: true; initial-value: 30%; }
@property --fx3 { syntax: '<percentage>'; inherits: true; initial-value: 55%; }
@property --fy3 { syntax: '<percentage>'; inherits: true; initial-value: 90%; }

:root {
  /* springs: a lively one for small objects, a soft one for large surfaces, an exit curve */
  --spring: linear(0, 0.009, 0.035 2.1%, 0.141, 0.281 6.7%, 0.723 12.9%, 0.938 16.7%, 1.017, 1.077, 1.121, 1.149 24.3%, 1.159, 1.163 27%, 1.154, 1.129 32.8%, 1.051 39.6%, 1.017 43.1%, 0.991, 0.977 51%, 0.975 57.1%, 0.997 69.8%, 1.003 76.9%, 1);
  --spring-soft: linear(0, 0.06 2%, 0.23 5.5%, 0.5 10.5%, 0.75 16%, 0.9 21.5%, 0.985 27%, 1.02 32.5%, 1.03 38%, 1.022 45%, 1.008 55%, 0.999 68%, 1);
  --ease: cubic-bezier(.2, .8, .2, 1);
  --ease-out: cubic-bezier(.4, 0, 1, 1);
  --sans: 'Atkinson Hyperlegible Next', ui-sans-serif, system-ui, sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  --r-xl: 28px; --r-lg: 22px; --r-md: 16px; --r-sm: 10px;
  --pad: 40px;
  animation: field-drift 46s ease-in-out infinite alternate;
}
@keyframes field-drift {
  0%   { --fx1: 18%; --fy1: 20%; --fx2: 82%; --fy2: 30%; --fx3: 55%; --fy3: 90%; }
  50%  { --fx1: 42%; --fy1: 70%; --fx2: 60%; --fy2: 10%; --fx3: 20%; --fy3: 40%; }
  100% { --fx1: 70%; --fy1: 30%; --fx2: 25%; --fy2: 80%; --fx3: 85%; --fy3: 50%; }
}

/* ---------- LIGHT (default, the hero) ---------- */
html[data-theme=light], [data-t=light] {
  color-scheme: light;
  --outer: oklch(0.925 0.012 265);
  --bg: oklch(0.978 0.007 262);
  --bg-glow: oklch(0.925 0.055 252 / 0.85);
  --surface: oklch(1 0 0);
  --surface-2: oklch(0.966 0.01 262);
  --line: oklch(0.28 0.05 265 / 0.11);
  --line-2: oklch(0.28 0.05 265 / 0.19);
  --line-strong: oklch(0.38 0.05 265 / 0.62);
  --ink: oklch(0.2 0.035 265);
  --ink-2: oklch(0.37 0.035 265);
  --ink-3: oklch(0.47 0.03 265);
  --accent: oklch(0.5 0.2 264);
  --accent-hi: oklch(0.6 0.19 262);
  --accent-lo: oklch(0.46 0.2 266);
  --accent-ink: oklch(1 0 0);
  --accent-text: oklch(0.47 0.2 265);
  --accent-soft: oklch(0.5 0.2 264 / 0.08);
  --accent-ring: oklch(0.55 0.2 264 / 0.26);
  --focus: oklch(0.5 0.2 264);
  --ok: oklch(0.56 0.15 152);
  --diff: oklch(0.6 0.13 68);
  --mixed: oklch(0.54 0.2 5);
  --doi: oklch(0.54 0.21 28);
  --miss: oklch(0.47 0.19 18);
  --unk: oklch(0.52 0.025 265);
  --on: oklch(1 0 0);
  /* tracked change: neutral strike + cobalt insert (never verdict green) */
  --del-ink: oklch(0.4 0.03 265);
  --del-line: oklch(0.4 0.03 265 / 0.9);
  --del-bg: oklch(0.3 0.03 265 / 0.06);
  --ins-bg: oklch(0.55 0.19 264 / 0.13);
  --ins-line: oklch(0.5 0.2 264);
  --shadow: 0 1px 2px oklch(0.3 0.06 265 / 0.05), 0 12px 30px -18px oklch(0.3 0.08 265 / 0.2);
  --shadow-lift: 0 2px 4px oklch(0.3 0.06 265 / 0.05), 0 26px 50px -24px oklch(0.3 0.1 265 / 0.3);
  --hi: inset 0 1px 0 oklch(1 0 0);
  /* glass */
  --glass-base: oklch(1 0 0 / 0.56);
  --glass-strong: oklch(1 0 0 / 0.82);
  --glass-line: oklch(0.32 0.06 265 / 0.14);
  --rim-a: oklch(1 0 0 / 0.98); --rim-b: oklch(1 0 0 / 0.1); --rim-c: oklch(1 0 0 / 0.75);
  --glass-shadow: 0 1px 1px oklch(0.3 0.08 265 / 0.08), 0 10px 24px -12px oklch(0.32 0.12 265 / 0.22), 0 40px 70px -30px oklch(0.32 0.12 265 / 0.36);
  --glass-depth: inset 0 -10px 22px -18px oklch(0.4 0.12 265 / 0.22);
  --f1: oklch(0.84 0.1 238 / 0.85);
  --f2: oklch(0.86 0.1 292 / 0.75);
  --f3: oklch(0.9 0.08 212 / 0.8);
  --scrim: oklch(0.3 0.05 265 / 0.2);
  --hero-base: oklch(0.93 0.04 255);
  --hero-1: oklch(0.8 0.13 238 / 0.95); --hero-2: oklch(0.82 0.12 292 / 0.9); --hero-3: oklch(0.86 0.1 212 / 0.9);
}
/* ---------- DARK (deep ink, cobalt field, never an inversion) ---------- */
html[data-theme=dark], [data-t=dark] {
  color-scheme: dark;
  --outer: oklch(0.1 0.01 265);
  --bg: oklch(0.15 0.017 266);
  --bg-glow: oklch(0.36 0.15 266 / 0.5);
  --surface: oklch(0.195 0.019 266);
  --surface-2: oklch(0.172 0.017 266);
  --line: oklch(1 0 0 / 0.085);
  --line-2: oklch(1 0 0 / 0.14);
  --line-strong: oklch(1 0 0 / 0.42);
  --ink: oklch(0.97 0.004 265);
  --ink-2: oklch(0.83 0.012 265);
  --ink-3: oklch(0.71 0.016 265);
  --accent: oklch(0.77 0.13 262);
  --accent-hi: oklch(0.83 0.1 258);
  --accent-lo: oklch(0.72 0.15 264);
  --accent-ink: oklch(0.17 0.04 265);
  --accent-text: oklch(0.8 0.12 262);
  --accent-soft: oklch(0.77 0.13 262 / 0.11);
  --accent-ring: oklch(0.77 0.13 262 / 0.32);
  --focus: oklch(0.8 0.12 262);
  --ok: oklch(0.8 0.17 152);
  --diff: oklch(0.83 0.15 85);
  --mixed: oklch(0.74 0.18 5);
  --doi: oklch(0.72 0.19 28);
  --miss: oklch(0.68 0.2 20);
  --unk: oklch(0.72 0.02 265);
  --on: oklch(0.16 0.02 265);
  --del-ink: oklch(0.78 0.012 265);
  --del-line: oklch(0.78 0.012 265 / 0.85);
  --del-bg: oklch(1 0 0 / 0.05);
  --ins-bg: oklch(0.72 0.15 264 / 0.2);
  --ins-line: oklch(0.8 0.12 262);
  --shadow: 0 0 0 1px oklch(0 0 0 / 0.45), 0 20px 44px -28px oklch(0 0 0 / 0.9);
  --shadow-lift: 0 0 0 1px oklch(0 0 0 / 0.5), 0 34px 70px -30px oklch(0.35 0.18 266 / 0.45);
  --hi: inset 0 1px 0 oklch(1 0 0 / 0.06);
  --glass-base: oklch(0.22 0.025 266 / 0.62);
  --glass-strong: oklch(0.205 0.022 266 / 0.88);
  --glass-line: oklch(0 0 0 / 0.6);
  --rim-a: oklch(1 0 0 / 0.36); --rim-b: oklch(1 0 0 / 0.04); --rim-c: oklch(0.8 0.1 262 / 0.3);
  --glass-shadow: 0 10px 24px -12px oklch(0 0 0 / 0.7), 0 40px 80px -24px oklch(0 0 0 / 0.85);
  --glass-depth: inset 0 -12px 24px -18px oklch(0.6 0.15 266 / 0.2);
  --f1: oklch(0.42 0.17 266 / 0.6);
  --f2: oklch(0.44 0.15 300 / 0.5);
  --f3: oklch(0.46 0.1 220 / 0.5);
  --scrim: oklch(0.05 0.01 265 / 0.55);
  --hero-base: oklch(0.19 0.035 266);
  --hero-1: oklch(0.46 0.2 266 / 0.95); --hero-2: oklch(0.42 0.17 300 / 0.8); --hero-3: oklch(0.5 0.12 220 / 0.65);
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { font: 400 15px/1.5 var(--sans); color: var(--ink); background: var(--outer); -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; overflow: hidden; font-feature-settings: 'ss01' off; }
h1, h2, h3, h4, p, ul, ol, figure { margin: 0; padding: 0; }
ul, ol { list-style: none; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: inherit; }
a { color: inherit; }
svg { display: block; }
.mono { font-family: var(--mono); }
.num-tab { font-variant-numeric: tabular-nums; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 8px; }
kbd { font: 500 11px/1 var(--mono); padding: 4px 6px; min-width: 22px; text-align: center; border-radius: 6px; border: 1px solid var(--line-2); background: var(--surface-2); color: var(--ink-2); box-shadow: 0 1px 0 var(--line); }

/* ---------- stage + app frame ---------- */
.stage { position: fixed; inset: 0; display: flex; justify-content: center; background: var(--outer); }
html[data-grey] .stage { filter: grayscale(1); }
.app { position: relative; width: 100%; height: 100%; display: flex; flex-direction: column; container: app / inline-size; background: var(--bg); overflow: hidden; isolation: isolate; transition: max-width .7s var(--spring-soft); }
html[data-w=panel] .app { max-width: 360px; box-shadow: 0 0 0 1px var(--line-2), 0 40px 90px -30px oklch(0.2 0.08 265 / 0.45); }
html[data-w=panel] { --pad: 16px; }
@media (max-width: 420px) { html { --pad: 16px; } }

/* airy luminous base */
.app::before { content: ''; position: absolute; inset: 0; z-index: -1; pointer-events: none;
  background:
    radial-gradient(70% 38% at 50% -12%, var(--bg-glow), transparent 72%),
    radial-gradient(40% 30% at 100% 0%, color-mix(in oklch, var(--bg-glow) 50%, transparent), transparent 70%); }
html[data-theme=dark] .app::before {
  background:
    radial-gradient(64% 36% at 50% -10%, var(--bg-glow), transparent 72%),
    radial-gradient(40% 34% at 0% 100%, oklch(0.4 0.14 220 / 0.14), transparent 70%),
    radial-gradient(36% 30% at 100% 70%, oklch(0.4 0.15 300 / 0.1), transparent 70%); }
/* fine dot grain on dark only, faded towards the bottom: texture without a "dev tool" grid */
.app::after { content: ''; position: absolute; inset: 0; z-index: -1; pointer-events: none; opacity: 0;
  background-image: radial-gradient(oklch(1 0 0 / 0.07) 1px, transparent 1.2px); background-size: 22px 22px;
  mask-image: radial-gradient(80% 55% at 50% 0, #000, transparent 80%); -webkit-mask-image: radial-gradient(80% 55% at 50% 0, #000, transparent 80%); }
html[data-theme=dark] .app::after { opacity: 1; }

/* ---------- top bar ---------- */
.topbar { flex: none; position: relative; z-index: 6; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; height: 64px; padding: 0 var(--pad); border-bottom: 1px solid var(--line); background: color-mix(in oklch, var(--bg) 80%, transparent); view-transition-name: topbar; }
.brand { display: inline-flex; align-items: center; gap: 10px; justify-self: start; font-weight: 700; font-size: 16.5px; letter-spacing: -0.025em; color: var(--ink); text-decoration: none; border-radius: 10px; min-height: 32px; }
.brand .mark { width: 28px; height: 28px; flex: none; filter: drop-shadow(0 3px 6px oklch(0.45 0.2 264 / 0.28)); transition: transform .6s var(--spring); }
.brand:hover .mark { transform: rotate(-6deg) scale(1.06); }
.brand i { font-style: normal; color: var(--accent-text); }
.nav { display: flex; gap: 2px; padding: 3px; border-radius: 99px; background: var(--surface-2); border: 1px solid var(--line); box-shadow: inset 0 1px 2px oklch(0.3 0.05 265 / 0.05); }
.nav button { height: 32px; min-width: 24px; padding: 0 16px; border-radius: 99px; font-weight: 600; font-size: 14px; color: var(--ink-2); transition: background .25s, color .25s, box-shadow .25s; text-align: center; }
.nav button:hover { color: var(--ink); }
.nav button[aria-current=page] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px oklch(0.3 0.06 265 / 0.14), inset 0 0 0 1px var(--line); }
html[data-theme=dark] .nav button[aria-current=page] { background: oklch(1 0 0 / 0.1); box-shadow: inset 0 1px 0 oklch(1 0 0 / 0.1), inset 0 0 0 1px var(--line-2); }
.tools { justify-self: end; display: flex; align-items: center; gap: 8px; }
.kbtn { display: inline-flex; align-items: center; gap: 10px; height: 36px; padding: 0 6px 0 12px; border-radius: 99px; border: 1px solid var(--line-2); background: var(--surface); color: var(--ink-2); font-size: 14px; box-shadow: var(--shadow), var(--hi); transition: transform .5s var(--spring), border-color .2s; }
.kbtn:hover { border-color: var(--line-strong); transform: translateY(-1px); }
.kbtn svg { width: 16px; height: 16px; }
.avatar { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font: 600 12px var(--mono); color: var(--accent-ink); background: linear-gradient(145deg, var(--accent-hi), var(--accent-lo)); box-shadow: inset 0 1px 0 oklch(1 0 0 / 0.45); }
html[data-theme=light] .avatar { background: linear-gradient(145deg, oklch(0.55 0.2 262), oklch(0.45 0.2 268)); }

/* panel: a compact two-row header that behaves like a native side panel */
@container app (max-width: 700px) {
  .topbar { grid-template-columns: 1fr auto; grid-template-rows: auto auto; height: auto; padding: 10px var(--pad) 10px; row-gap: 10px; }
  .brand { font-size: 15.5px; gap: 8px; }
  .brand .mark { width: 26px; height: 26px; }
  .nav { grid-column: 1 / -1; grid-row: 2; width: 100%; }
  .nav button { flex: 1; padding: 0 8px; height: 30px; font-size: 13.5px; }
  .kbtn span, .kbtn kbd { display: none; }
  .kbtn { width: 32px; height: 32px; padding: 0; justify-content: center; }
  .avatar { width: 28px; height: 28px; font-size: 11px; }
}

.scroll { flex: 1; min-height: 0; overflow: auto; position: relative; padding-bottom: 72px; scrollbar-gutter: stable; scrollbar-width: thin; scrollbar-color: var(--line-2) transparent; }
.page { max-width: 1120px; margin: 0 auto; padding: 32px var(--pad) 0; }
.enter { animation: view-in .55s var(--spring-soft) both; }
@keyframes view-in { from { opacity: 0; transform: translateY(10px); } }
.stagger > * { animation: rise .7s var(--spring-soft) both; animation-delay: calc(var(--i, 0) * 45ms + 60ms); }
@keyframes rise { from { opacity: 0; transform: translateY(14px) scale(.985); } }

/* ---------- glyph helpers ---------- */
.gly { width: 20px; height: 20px; flex: none; color: var(--c); overflow: visible; }
.v-ok { --c: var(--ok); } .v-diff { --c: var(--diff); } .v-mixed { --c: var(--mixed); }
.v-doi { --c: var(--doi); } .v-miss { --c: var(--miss); } .v-unk { --c: var(--unk); }
.ui { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- GLASS: the only floating material ----------
   hairline outside, refraction rim inside (bright top-left, a second catch-light bottom-right),
   a soft inner depth at the bottom edge, and the drifting colour field showing through. */
.glass { position: relative; isolation: isolate;
  background:
    radial-gradient(70% 110% at var(--fx1) var(--fy1), var(--f1), transparent 72%),
    radial-gradient(60% 100% at var(--fx2) var(--fy2), var(--f2), transparent 72%),
    radial-gradient(60% 90% at var(--fx3) var(--fy3), var(--f3), transparent 72%),
    var(--glass-base);
  -webkit-backdrop-filter: blur(28px) saturate(1.8); backdrop-filter: blur(28px) saturate(1.8);
  border: 1px solid var(--glass-line);
  box-shadow: var(--glass-depth), var(--glass-shadow); }
.glass.strong { background:
    radial-gradient(70% 110% at var(--fx1) var(--fy1), color-mix(in oklch, var(--f1) 50%, transparent), transparent 72%),
    radial-gradient(60% 100% at var(--fx2) var(--fy2), color-mix(in oklch, var(--f2) 50%, transparent), transparent 72%),
    var(--glass-strong); }
@supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) { .glass, .glass.strong { background: var(--glass-strong) !important; } }
.glass::before { content: ''; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; z-index: 2; padding: 1px;
  background: linear-gradient(158deg, var(--rim-a), var(--rim-b) 26%, transparent 52%, var(--rim-b) 76%, var(--rim-c));
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor;
  mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0); }
.glass::after { content: ''; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; z-index: 0;
  background: radial-gradient(120% 70% at 12% -14%, oklch(1 0 0 / 0.42), transparent 58%), radial-gradient(240px circle at var(--mx, 50%) var(--my, -40%), oklch(1 0 0 / 0.3), transparent 65%); }
html[data-theme=dark] .glass::after { background: radial-gradient(120% 70% at 12% -14%, oklch(1 0 0 / 0.08), transparent 58%), radial-gradient(240px circle at var(--mx, 50%) var(--my, -40%), oklch(1 0 0 / 0.06), transparent 65%); }
.glass > * { position: relative; z-index: 1; }

/* ---------- controls ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 40px; padding: 0 18px; border-radius: 99px; font-weight: 700; font-size: 14.5px; letter-spacing: -0.01em; border: 1px solid var(--line-2); background: var(--surface); color: var(--ink); box-shadow: var(--shadow), var(--hi); transition: transform .5s var(--spring), box-shadow .3s, border-color .2s, background .2s; white-space: nowrap; }
.btn:hover { transform: translateY(-1px); border-color: var(--line-strong); }
.btn:active { transform: scale(.96); transition-duration: .12s; }
.btn .ui { width: 16px; height: 16px; }
.btn.primary { border-color: transparent; color: var(--accent-ink); background: linear-gradient(180deg, var(--accent-hi), var(--accent-lo)); box-shadow: inset 0 1px 0 oklch(1 0 0 / 0.35), inset 0 -1px 0 oklch(0.2 0.1 265 / 0.2), 0 8px 20px -8px var(--accent-ring), 0 1px 2px oklch(0.2 0.1 265 / 0.25); }
html[data-theme=light] .btn.primary { background: linear-gradient(180deg, oklch(0.55 0.2 263), oklch(0.47 0.2 266)); }
.btn.ghost { background: transparent; box-shadow: none; border-color: transparent; color: var(--ink-2); }
.btn.ghost:hover { background: var(--accent-soft); border-color: transparent; color: var(--ink); }
.btn.sm { height: 32px; padding: 0 12px; font-size: 13.5px; gap: 6px; }
.btn.icon { width: 32px; padding: 0; }
.btn[disabled] { opacity: .45; pointer-events: none; }
.eyebrow { font: 500 11.5px/1 var(--mono); letter-spacing: 0.09em; text-transform: uppercase; color: var(--ink-3); }

/* verdict chip: glyph shape + text label, never colour alone */
.vchip { display: inline-flex; align-items: center; gap: 8px; min-height: 28px; padding: 3px 12px 3px 6px; border-radius: 99px; font-size: 13.5px; font-weight: 700; letter-spacing: -0.005em; color: var(--ink); background: color-mix(in oklch, var(--c) 10%, var(--surface)); box-shadow: inset 0 0 0 1px color-mix(in oklch, var(--c) 36%, transparent); line-height: 1.2; white-space: nowrap; }
.vchip .gly { width: 20px; height: 20px; }
.vchip.pend { --c: var(--ink-3); background: transparent; box-shadow: inset 0 0 0 1px var(--line-2); font-weight: 600; color: var(--ink-2); }
.spinner { width: 18px; height: 18px; border-radius: 50%; border: 2.2px solid var(--accent); border-right-color: transparent; animation: rot .9s linear infinite; flex: none; }
.wait { width: 18px; height: 18px; border-radius: 50%; border: 2px dotted var(--ink-3); flex: none; }
@keyframes rot { to { transform: rotate(360deg); } }
.fixtag { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px 0 6px; border-radius: 99px; font: 600 11.5px/1 var(--sans); color: var(--accent-text); background: var(--accent-soft); box-shadow: inset 0 0 0 1px color-mix(in oklch, var(--accent) 35%, transparent); white-space: nowrap; }
.fixtag .ui { width: 12px; height: 12px; stroke-width: 2.6; }

/* ---------- INTAKE (the owner's favourite: kept, polished) ---------- */
.intake { max-width: 780px; margin: 0 auto; padding: 64px var(--pad) 0; text-align: center; }
.intake h1 { font: 700 40px/1.06 var(--sans); letter-spacing: -0.032em; margin-top: 16px; text-wrap: balance; }
.intake .lead { margin: 14px auto 0; max-width: 52ch; color: var(--ink-2); font-size: 17px; line-height: 1.55; text-wrap: pretty; }
.paste { position: relative; margin-top: 36px; text-align: left; border-radius: var(--r-xl); background: var(--surface); border: 1.5px solid var(--line-strong); box-shadow: var(--shadow-lift), var(--hi); transition: box-shadow .4s, border-color .25s, transform .6s var(--spring-soft); }
.paste::before { content: ''; position: absolute; inset: -1.5px; border-radius: inherit; pointer-events: none; opacity: 0; transition: opacity .4s; box-shadow: 0 0 0 4px var(--accent-ring), 0 0 70px -12px var(--accent-ring); }
.paste:focus-within { border-color: var(--accent); }
.paste:focus-within::before { opacity: 1; }
.paste textarea { display: block; width: 100%; min-height: 216px; resize: none; border: 0; outline: 0; background: transparent; color: var(--ink); font: 400 14.5px/1.7 var(--mono); padding: 24px 24px 8px; border-radius: var(--r-xl) var(--r-xl) 0 0; }
.paste textarea::placeholder { color: var(--ink-3); opacity: 1; }
.paste .bar { display: flex; align-items: center; gap: 10px; padding: 10px 12px 12px 20px; }
.paste .bar .hint { flex: 1; font-size: 13.5px; color: var(--ink-3); min-width: 0; display: inline-flex; align-items: center; gap: 6px; }
.paste .bar .hint.ok { color: var(--ink-2); font-weight: 600; }
.paste .bar .hint.ok .ui { color: var(--accent); }
.paste .btn.primary kbd { background: oklch(1 0 0 / .18); border-color: oklch(1 0 0 / .3); color: inherit; box-shadow: none; }
html[data-theme=dark] .paste .btn.primary kbd { background: oklch(0 0 0 / .12); border-color: oklch(0 0 0 / .2); }
.drop { margin-top: 14px; display: flex; align-items: center; gap: 16px; padding: 16px 20px; border-radius: var(--r-lg); border: 1.5px dashed var(--line-strong); background: color-mix(in oklch, var(--surface) 55%, transparent); text-align: left; width: 100%; transition: background .3s, border-color .3s, transform .5s var(--spring); }
.drop:hover, .drop.over { background: var(--accent-soft); border-color: var(--accent); transform: scale(1.006); }
.drop .ic { width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; flex: none; background: var(--accent-soft); color: var(--accent); transition: transform .6s var(--spring); }
.drop:hover .ic { transform: translateY(-2px); }
.drop .ic .ui { width: 22px; height: 22px; }
.drop b { display: block; font-size: 15px; }
.drop span { display: block; color: var(--ink-3); font-size: 13.5px; }
.fmts { display: flex; gap: 6px; margin-left: auto; flex-wrap: wrap; justify-content: flex-end; }
.fmts i { font: 500 11.5px/1 var(--mono); font-style: normal; padding: 6px 8px; border-radius: 7px; border: 1px solid var(--line-2); color: var(--ink-2); background: var(--surface); }
.sources { margin-top: 32px; display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; align-items: center; color: var(--ink-3); font-size: 13.5px; }
.sources b { font: 500 11.5px/1 var(--mono); letter-spacing: .09em; text-transform: uppercase; margin-right: 6px; }
.sources span.s { font: 500 12.5px/1 var(--mono); padding: 7px 10px; border-radius: 99px; border: 1px solid var(--line-2); color: var(--ink-2); background: var(--surface); }
@container app (max-width: 700px) {
  .intake { padding-top: 28px; text-align: left; }
  .intake h1 { font-size: 28px; margin-top: 12px; }
  .intake .lead { font-size: 15px; margin-left: 0; }
  .paste { margin-top: 22px; border-radius: 22px; }
  .paste textarea { min-height: 176px; font-size: 13px; padding: 16px 16px 4px; }
  .paste .bar { padding: 8px 8px 10px 12px; flex-wrap: wrap; }
  .paste .bar .hint { flex-basis: 100%; order: 3; padding: 2px 4px 0; }
  .paste .bar .btn.ghost { order: 1; } .paste .bar .btn.primary { order: 2; margin-left: auto; }
  .drop { flex-wrap: wrap; padding: 14px 16px; gap: 12px; }
  .drop .fmts { margin-left: 0; justify-content: flex-start; flex-basis: 100%; }
  .sources { justify-content: flex-start; margin-top: 24px; }
}

/* ---------- RUNNING ---------- */
.run-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.run-side { display: flex; align-items: center; gap: 14px; }
#run-cta { opacity: 0; visibility: hidden; transform: translateY(6px) scale(.96); transition: opacity .3s, transform .5s var(--spring), visibility 0s .3s; }
#run-cta.show { opacity: 1; visibility: visible; transform: none; transition: opacity .3s, transform .6s var(--spring); }
.run-head h2 { font: 700 28px/1.15 var(--sans); letter-spacing: -0.026em; }
.run-head .sub { color: var(--ink-3); font-size: 14.5px; margin-top: 4px; }
.count { font: 600 13.5px/1 var(--mono); color: var(--ink-2); display: flex; align-items: baseline; gap: 8px; }
.count b { font: 700 24px/1 var(--sans); letter-spacing: -0.03em; color: var(--ink); font-variant-numeric: tabular-nums; }
/* progress: eight cells, one per reference; each takes its verdict glyph colour when it lands (labels live in the rows) */
.prog { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; margin: 18px 0 24px; }
.prog i { position: relative; height: 4px; border-radius: 4px; background: var(--line-2); overflow: hidden; }
.prog i::after { content: ''; position: absolute; inset: 0; border-radius: inherit; transform-origin: left; transform: scaleX(0); background: var(--accent); transition: transform .5s var(--ease), background .4s; }
.prog i.b::after { transform: scaleX(.45); background: linear-gradient(90deg, var(--accent-lo), var(--accent-hi)); transition: transform 1.2s var(--ease); }
.prog i.d::after { transform: scaleX(1); background: var(--c); transition: transform .45s var(--spring-soft), background .3s; }
.feed { display: grid; gap: 10px; }
.ref { position: relative; display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 2px 14px; align-items: start; padding: 14px 18px 14px 16px; border-radius: var(--r-md); background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow), var(--hi); color: inherit; width: 100%; transition: border-color .6s, box-shadow .6s; overflow: hidden; }
/* verdict light pooling in from the left edge when the row resolves */
.ref::before { content: ''; position: absolute; inset: 0; pointer-events: none; opacity: 0; transform: scaleX(.4); transform-origin: left; transition: opacity .9s, transform 1.1s var(--spring-soft); background: radial-gradient(260px 100px at 0% 50%, color-mix(in oklch, var(--c) 13%, transparent), transparent 75%); }
.ref.done::before { opacity: 1; transform: none; }
.ref::after { content: ''; position: absolute; left: 0; top: 12px; bottom: 12px; width: 3px; border-radius: 0 3px 3px 0; background: var(--c, transparent); transform: scaleY(0); transition: transform .6s var(--spring); }
.ref.done::after { transform: scaleY(1); }
.ref.done { border-color: color-mix(in oklch, var(--c) 26%, var(--line)); }
html[data-theme=dark] .ref.done { box-shadow: var(--shadow), var(--hi), 0 0 36px -20px var(--c); }
/* the reference being checked: a calm scanning light along the top edge, no pulsing box */
.ref.active { border-color: color-mix(in oklch, var(--accent) 55%, var(--line)); box-shadow: var(--shadow), 0 0 0 3px var(--accent-soft); }
.ref .scan { position: absolute; left: 0; right: 0; top: 0; height: 2px; overflow: hidden; opacity: 0; transition: opacity .3s; pointer-events: none; }
.ref.active .scan { opacity: 1; }
.ref .scan::before { content: ''; position: absolute; top: 0; bottom: 0; width: 40%; background: linear-gradient(90deg, transparent, var(--accent), transparent); animation: scan 1.6s var(--ease) infinite; }
@keyframes scan { from { transform: translateX(-100%); } to { transform: translateX(260%); } }
.ref > * { position: relative; }
.ref .ix { font: 500 12px/1.9 var(--mono); color: var(--ink-3); padding-top: 1px; }
.ref .main { min-width: 0; }
.ref .title { font-weight: 700; font-size: 15.5px; line-height: 1.32; letter-spacing: -0.012em; text-wrap: pretty; }
.ref .meta { font: 400 12px/1.5 var(--mono); color: var(--ink-3); margin-top: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ref .vslot { justify-self: end; min-height: 28px; display: flex; align-items: center; }
.ref .vslot .vchip { animation: pop .65s var(--spring) both; }
.ref .vslot .vchip.pend { animation: none; }
@keyframes pop { from { transform: scale(.7); opacity: 0; filter: blur(3px); } }
.trail { grid-column: 2 / -1; display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; min-height: 26px; }
.ev { display: inline-flex; align-items: center; gap: 6px; min-height: 24px; padding: 2px 9px; border-radius: 8px; font-size: 12.5px; line-height: 1.3; color: var(--ink-2); background: var(--surface-2); border: 1px solid var(--line); visibility: hidden; opacity: 0; transform: translateY(6px) scale(.96); transition: opacity .35s, transform .55s var(--spring), visibility 0s .35s; }
.ev.on { visibility: visible; opacity: 1; transform: none; transition: opacity .35s, transform .55s var(--spring), visibility 0s; }
.ev b { font: 600 12px/1.3 var(--mono); color: var(--ink); }
.ev .ei { width: 14px; height: 14px; flex: none; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.ev.r-ok .ei { color: var(--ok); }
.ev.r-diff { background: color-mix(in oklch, var(--diff) 10%, var(--surface)); border-color: color-mix(in oklch, var(--diff) 42%, transparent); color: var(--ink); }
.ev.r-diff .ei { color: color-mix(in oklch, var(--diff) 80%, var(--ink)); }
.ev.r-bad { background: color-mix(in oklch, var(--doi) 8%, var(--surface)); border-color: color-mix(in oklch, var(--doi) 38%, transparent); color: var(--ink); }
.ev.r-bad .ei { color: var(--doi); }
.ev.r-none .ei, .ev.r-warn .ei { color: var(--ink-3); } .ev.r-warn { border-style: dashed; }
.ev.k-end { background: transparent; border-color: transparent; padding-left: 2px; color: var(--ink-3); }
.ev.k-end .ei { color: var(--ink-3); }
.legend-note { margin-top: 24px; font-size: 13.5px; color: var(--ink-3); display: flex; gap: 8px; align-items: flex-start; max-width: 70ch; }
.legend-note .ui { margin-top: 2px; }
@container app (max-width: 700px) {
  .page { padding-top: 22px; }
  .run-head h2 { font-size: 22px; }
  .run-head { align-items: center; }
  .ref { grid-template-columns: 24px minmax(0, 1fr); padding: 12px 14px 13px 12px; gap: 2px 10px; }
  .ref .vslot { grid-column: 2; grid-row: 2; justify-self: start; margin-top: 8px; }
  .ref .trail { grid-column: 2; grid-row: 3; margin-top: 8px; gap: 5px; min-height: 0; }
  .ref .meta { white-space: normal; }
  .ref .title { font-size: 14.5px; }
}

/* toast: floating glass */
.toasts { position: absolute; z-index: 40; left: 0; right: 0; bottom: 24px; display: flex; flex-direction: column; align-items: center; gap: 10px; pointer-events: none; padding: 0 12px; }
.toast { pointer-events: auto; display: flex; align-items: center; gap: 12px; padding: 8px 8px 8px 14px; border-radius: 99px; font-weight: 600; font-size: 14px; max-width: 100%; animation: toast-in .75s var(--spring) both; }
.toast.out { animation: toast-out .3s var(--ease-out) both; }
.toast .tic { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent-text); box-shadow: inset 0 0 0 1px color-mix(in oklch, var(--accent) 35%, transparent); flex: none; }
.toast .tic .ui { width: 14px; height: 14px; stroke-width: 2.6; }
.toast .btn { height: 32px; padding: 0 12px; font-size: 13.5px; box-shadow: none; }
@keyframes toast-in { from { opacity: 0; transform: translateY(28px) scale(.9); } }
@keyframes toast-out { to { opacity: 0; transform: translateY(10px) scale(.96); } }

/* ---------- SUMMARY (the signature moment) ---------- */
.bento { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 16px; }
.tile { position: relative; border-radius: var(--r-lg); background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow), var(--hi); padding: 20px 22px; overflow: hidden; color: inherit; text-align: left; display: flex; flex-direction: column; }
.tile::before { content: ''; position: absolute; inset: 0; pointer-events: none; background: radial-gradient(240px 150px at 100% 0%, color-mix(in oklch, var(--c, var(--accent)) 12%, transparent), transparent 75%); }
.tile > * { position: relative; }
button.tile { cursor: pointer; transition: transform .6s var(--spring), box-shadow .3s, border-color .25s; }
button.tile:hover, .sub-v:hover { transform: translateY(-3px); box-shadow: var(--shadow-lift), var(--hi); }
button.tile:active, .sub-v:active { transform: scale(.985); transition-duration: .12s; }
.tile[aria-pressed=true], .sub-v[aria-pressed=true] { border-color: var(--ink); box-shadow: 0 0 0 1px var(--ink), var(--shadow-lift); }
.tile .top { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 14px; font-weight: 700; letter-spacing: -0.01em; min-height: 26px; }
.tile .top .lab { display: flex; align-items: center; gap: 10px; }
.tile .top .gly { width: 24px; height: 24px; }
.pressed-tag { display: none; font: 600 11px/1 var(--mono); letter-spacing: .05em; text-transform: uppercase; align-items: center; gap: 5px; color: var(--ink); }
.tile[aria-pressed=true] .pressed-tag, .sub-v[aria-pressed=true] .pressed-tag { display: inline-flex; }
.pressed-tag .ui { width: 12px; height: 12px; stroke-width: 3; }
.tile .num { font: 800 72px/0.86 var(--sans); letter-spacing: -0.055em; margin-top: auto; padding-top: 16px; font-variant-numeric: tabular-nums; }
.tile .note { font-size: 13.5px; color: var(--ink-2); margin-top: 8px; line-height: 1.4; }
.tile .names { font: 400 12px/1.5 var(--mono); color: var(--ink-3); margin-top: 6px; }

/* lede: the plain-language verdict, set beside the hero, no tile chrome */
.lede { grid-column: 6 / 13; grid-row: 1; padding: 8px 4px 4px; display: flex; flex-direction: column; justify-content: center; }
.lede .eyebrow { margin-bottom: 12px; }
.lede h2 { font: 700 34px/1.1 var(--sans); letter-spacing: -0.03em; text-wrap: balance; }
.lede p { margin-top: 12px; font-size: 16.5px; line-height: 1.6; color: var(--ink-2); max-width: 60ch; text-wrap: pretty; }
.lede p .vi { display: inline-flex; vertical-align: -3px; margin-right: 4px; }
.lede p .vi .gly { width: 17px; height: 17px; }
.lede p b { color: var(--ink); font-weight: 700; }
.lede .cta { margin-top: 20px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.lede .meta { font: 500 12px/1.4 var(--mono); color: var(--ink-3); margin-left: 6px; }

/* hero lens: a colour field under one sheet of glass */
.hero { grid-column: 1 / 6; grid-row: 1 / 3; padding: 12px; border: 0; background: var(--hero-base); box-shadow: var(--shadow-lift); border-radius: var(--r-xl); overflow: hidden; }
.hero::before { inset: 0; background:
    radial-gradient(60% 55% at var(--fx1) var(--fy1), var(--hero-1), transparent 70%),
    radial-gradient(55% 55% at var(--fx2) var(--fy2), var(--hero-2), transparent 72%),
    radial-gradient(60% 50% at var(--fx3) var(--fy3), var(--hero-3), transparent 72%); }
.hero-glass { flex: 1; border-radius: calc(var(--r-xl) - 10px); padding: 22px 24px 22px; display: flex; flex-direction: column; animation: lift 9s ease-in-out infinite alternate; }
@keyframes lift { to { transform: translateY(-5px); } }
.hero-glass .eyebrow { color: var(--ink-2); }
.ringwrap { position: relative; width: min(100%, 340px); aspect-ratio: 1; margin: auto; padding: 0; flex: none; }
.ring { width: 100%; height: 100%; overflow: visible; transform: rotate(-90deg); }
.ring circle { fill: none; stroke-width: 14; }
.ring .trk { stroke: oklch(1 0 0 / 0.55); }
html[data-theme=dark] .ring .trk { stroke: oklch(1 0 0 / 0.08); }
.ring .seg { stroke: var(--c); stroke-linecap: round; transition: stroke-dasharray 1.1s var(--spring-soft), opacity .2s; }
/* the pinch of boldness: a soft verdict light under the arc, kept inside the lens */
.ring .halo { stroke: var(--c); stroke-width: 22; opacity: 0; filter: blur(9px); transition: opacity 1.4s .5s; stroke-linecap: round; }
.ring.drawn .halo { opacity: .28; }
html[data-theme=dark] .ring.drawn .halo { opacity: .38; }
.ringwrap .mid { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
.mid .big { font: 800 128px/0.8 var(--sans); letter-spacing: -0.07em; color: var(--ink); font-variant-numeric: tabular-nums; padding-right: .06em;
  background: linear-gradient(180deg, var(--ink) 45%, color-mix(in oklch, var(--ink) 72%, var(--accent))); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
.mid .lbl { font-size: 16px; font-weight: 700; margin-top: 12px; letter-spacing: -0.015em; }
.ringwrap .mk-dot { position: absolute; width: 28px; height: 28px; margin: -14px 0 0 -14px; border-radius: 50%; display: grid; place-items: center; background: var(--surface); box-shadow: 0 2px 8px oklch(0.2 0.1 265 / 0.25), 0 0 0 1px var(--line-2); opacity: 0; transform: scale(.4); transition: opacity .3s, transform .6s var(--spring); }
.ringwrap .mk-dot.on { opacity: 1; transform: none; }
.ringwrap .mk-dot .gly { width: 18px; height: 18px; }
.legend { margin-top: 16px; padding-top: 14px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px 16px; border-top: 1px solid color-mix(in oklch, var(--ink) 10%, transparent); }
.legend li { display: grid; grid-template-columns: 18px 1fr auto; gap: 8px; align-items: center; font-size: 13px; font-weight: 600; color: var(--ink); min-width: 0; }
.legend li span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.legend li b { font: 600 13px var(--mono); }
.legend .gly { width: 18px; height: 18px; }

.t-ok { grid-column: 6 / 10; grid-row: 2; --c: var(--ok); min-height: 188px; }
.t-diff { grid-column: 10 / 13; grid-row: 2; --c: var(--diff); min-height: 188px; }
.t-red { grid-column: 6 / 13; grid-row: 3; --c: var(--doi); padding: 16px 18px 18px; }
.t-red .top { margin-bottom: 12px; }
.t-red .top small { font-weight: 500; color: var(--ink-3); font-size: 12.5px; margin-left: 8px; }
.subs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: auto; }
.sub-v { position: relative; display: grid; grid-template-columns: auto 1fr; grid-template-rows: auto auto; align-items: center; gap: 0 10px; padding: 10px 12px; border-radius: 16px; background: color-mix(in oklch, var(--c) 7%, var(--surface)); border: 1px solid color-mix(in oklch, var(--c) 28%, var(--line)); transition: transform .6s var(--spring), box-shadow .3s; min-height: 64px; text-align: left; }
.sub-v .gly { grid-row: 1 / 3; width: 26px; height: 26px; }
.sub-v b { font: 800 26px/1 var(--sans); letter-spacing: -0.04em; }
.sub-v span { font-size: 12.5px; font-weight: 600; line-height: 1.2; color: var(--ink); }
.sub-v .pressed-tag { position: absolute; top: 8px; right: 10px; }
.t-unk { grid-column: 1 / 6; grid-row: 3; --c: var(--unk); }
.t-unk .num { font-size: 56px; }
.t-src { grid-column: 1 / 13; grid-row: 4; }
.t-src .srcs { grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: repeat(3, auto); grid-auto-flow: column; column-gap: 48px; }
@container app (max-width: 980px) { .t-src .srcs { grid-template-columns: minmax(0, 1fr); grid-template-rows: none; grid-auto-flow: row; } }
.srcs { display: grid; gap: 10px; margin-top: 14px; }
.srcrow { display: grid; grid-template-columns: 128px 1fr 40px; gap: 12px; align-items: center; font: 500 12.5px/1 var(--mono); color: var(--ink-2); }
.srcrow .bar { height: 6px; border-radius: 6px; background: var(--line-2); overflow: hidden; }
.srcrow .bar s { display: block; height: 100%; border-radius: 6px; width: 0; background: linear-gradient(90deg, var(--accent-lo), var(--accent-hi)); transition: width 1.1s var(--spring-soft); }
.srcrow .bar s.on { width: calc(var(--n) / 8 * 100%); }
.srcrow em { font-style: normal; text-align: right; color: var(--ink); font-weight: 600; }
.filter-bar { margin: 36px 0 12px; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; min-height: 32px; }
.filter-bar h3 { font: 700 18px/1.2 var(--sans); letter-spacing: -0.02em; }
.rows { display: grid; gap: 8px; }
.row { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto 18px; align-items: center; gap: 12px; padding: 12px 16px 12px 14px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow), var(--hi); transition: transform .5s var(--spring), border-color .2s; width: 100%; }
.row.in { animation: rise .5s var(--spring-soft) both; animation-delay: calc(var(--i, 0) * 30ms); }
.row:hover { transform: translateX(3px); border-color: var(--line-strong); }
.row .ix { font: 500 12px var(--mono); color: var(--ink-3); }
.row .t { font-weight: 700; font-size: 14.5px; letter-spacing: -0.01em; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .t small { display: block; font: 400 12px var(--mono); color: var(--ink-3); letter-spacing: 0; overflow: hidden; text-overflow: ellipsis; }
.row .chips { display: flex; gap: 6px; align-items: center; justify-content: flex-end; }
.row .chev { width: 16px; height: 16px; stroke: var(--ink-3); fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; transition: transform .5s var(--spring); }
.row:hover .chev { transform: translateX(3px); }
.row .vchip { min-height: 26px; font-size: 12.5px; }
.note-line { margin-top: 20px; display: flex; gap: 8px; color: var(--ink-3); font-size: 13.5px; max-width: 72ch; }
.note-line .ui { margin-top: 2px; }
@container app (max-width: 980px) and (min-width: 701px) {
  .lede { grid-column: 1 / 13; grid-row: auto; }
  .hero { grid-column: 1 / 13; grid-row: auto; }
  .t-ok { grid-column: 1 / 7; grid-row: auto; } .t-diff { grid-column: 7 / 13; grid-row: auto; }
  .t-red, .t-unk, .t-src { grid-column: 1 / 13; grid-row: auto; }
}
@container app (max-width: 700px) {
  .bento { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .lede, .hero, .t-ok, .t-diff, .t-red, .t-unk, .t-src { grid-column: auto; grid-row: auto; }
  .lede, .hero, .t-red, .t-unk, .t-src { grid-column: 1 / 3; }
  .lede { padding: 0 0 6px; }
  .lede h2 { font-size: 25px; }
  .lede p { font-size: 15px; margin-top: 10px; }
  .lede .cta { margin-top: 16px; }
  .lede .cta .btn.primary { flex: 1; }
  .lede .meta { flex-basis: 100%; margin: 2px 0 0; }
  /* panel hero: ring and legend side by side, sized by content, no dead air */
  .hero { padding: 8px; border-radius: 24px; }
  .hero-glass { padding: 14px 14px 14px; border-radius: 18px; display: grid; grid-template-columns: 116px 1fr; grid-template-rows: auto 1fr; gap: 10px 14px; align-items: center; }
  .hero-glass .eyebrow { grid-column: 1 / 3; }
  .ringwrap { width: 116px; margin: 0; }
  .ring circle { stroke-width: 18; }
  .ringwrap .mk-dot { display: none; }
  .mid .big { font-size: 54px; }
  .mid .lbl { font-size: 11.5px; margin-top: 4px; font-weight: 600; }
  .legend { grid-template-columns: 1fr; margin: 0; padding: 0; border: 0; gap: 7px; }
  .legend li { font-size: 12.5px; line-height: 1.2; grid-template-columns: 16px 1fr auto; gap: 7px; }
  .legend li span { white-space: normal; overflow: visible; }
  .legend .gly { width: 16px; height: 16px; }
  .t-ok, .t-diff { min-height: 0; }
  .tile { padding: 14px 14px 14px; border-radius: 20px; }
  .tile .top { font-size: 13px; align-items: flex-start; }
  .tile .top .gly { width: 22px; height: 22px; }
  .tile .num { font-size: 48px; padding-top: 12px; }
  .tile .note { font-size: 12.5px; }
  .t-diff .top .lab { align-items: flex-start; }
  .subs { grid-template-columns: 1fr; gap: 8px; }
  .sub-v { min-height: 48px; grid-template-columns: 26px 1fr auto; grid-template-rows: auto; padding: 8px 12px; }
  .sub-v .gly { grid-row: 1; }
  .sub-v b { order: 3; font-size: 22px; }
  .sub-v span { font-size: 13.5px; }
  .sub-v .pressed-tag { position: static; order: 4; grid-column: 2; }
  .t-unk { flex-direction: row; flex-wrap: wrap; align-items: flex-end; }
  .t-unk .top { flex-basis: 100%; }
  .t-unk .num { font-size: 40px; padding-top: 8px; margin-right: 12px; }
  .t-unk .note { flex: 1; min-width: 0; }
  .srcrow { grid-template-columns: 104px 1fr 32px; gap: 8px; }
  .filter-bar { margin-top: 26px; }
  .row { grid-template-columns: 22px minmax(0, 1fr) 16px; gap: 4px 10px; padding: 11px 12px; }
  .row .chips { grid-column: 2; grid-row: 2; justify-content: flex-start; margin-top: 4px; flex-wrap: wrap; }
  .row .chev { grid-column: 3; grid-row: 1 / 3; }

/* ---------- DETAIL ---------- */
.crumbs { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
.pager { margin-left: auto; display: flex; gap: 2px; align-items: center; padding: 3px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--line); }
.pager button { position: relative; min-width: 28px; height: 28px; border-radius: 9px; display: grid; place-items: center; transition: background .2s, transform .4s var(--spring); }
.pager button:hover { background: var(--surface); transform: translateY(-1px); }
.pager button[aria-current=true] { background: var(--surface); box-shadow: 0 1px 2px oklch(0.3 0.06 265 / 0.14), inset 0 0 0 1px var(--line-strong); }
.pager button .gly { width: 15px; height: 15px; }
.stepbtns { display: flex; gap: 4px; }
.d-head { position: relative; border-radius: var(--r-xl); padding: 26px 28px 24px; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow-lift), var(--hi); overflow: hidden; }
.d-head::before { content: ''; position: absolute; inset: 0; pointer-events: none; background: radial-gradient(420px 220px at 0% 0%, color-mix(in oklch, var(--c) 15%, transparent), transparent 75%); }
.d-head > * { position: relative; }
.d-head .chiprow { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.d-head h2 { font: 700 28px/1.18 var(--sans); letter-spacing: -0.026em; margin: 14px 0 6px; text-wrap: balance; max-width: 32ch; }
.d-head .vchip { font-size: 15px; padding: 5px 16px 5px 8px; min-height: 34px; }
.d-head .vchip .gly { width: 24px; height: 24px; }
.d-head .cite { font: 400 13px/1.55 var(--mono); color: var(--ink-2); }
.d-head .what { margin-top: 14px; font-size: 15px; color: var(--ink-2); max-width: 64ch; }
.d-head .trail { margin: 0; min-height: 0; }
.d-head .ev { visibility: visible; opacity: 1; transform: none; }
.card { position: relative; border-radius: var(--r-lg); background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow), var(--hi); padding: 20px 22px; }
.card h3 { font: 700 16px/1.25 var(--sans); letter-spacing: -0.015em; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.card h3 small { font: 500 12px var(--mono); color: var(--ink-3); letter-spacing: 0; margin-left: auto; }
.d-stack { display: grid; gap: 14px; margin-top: 14px; }
.d-grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; align-items: start; }
.d-side { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); gap: 14px; align-items: start; }
.d-side > :only-child .srclist { display: block; column-count: 2; column-gap: 36px; }
@container app (max-width: 860px) { .d-side > :only-child .srclist { column-count: 1; } }
.srcitem { break-inside: avoid; }

/* tracked change in the user's own reference */
.trk { overflow: hidden; }
.trk::before { content: ''; position: absolute; inset: 0; pointer-events: none; border-radius: inherit; background: radial-gradient(500px 160px at 100% 0%, var(--accent-soft), transparent 70%); }
.trk > * { position: relative; }
.trk-head { display: flex; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
.trk-head h3 { flex: 1; min-width: 0; }
.trk-head .state { display: inline-flex; }
.trk-text { margin-top: 14px; padding: 18px 20px; border-radius: 16px; background: var(--surface-2); border: 1px solid var(--line); font: 400 16.5px/1.85 var(--sans); color: var(--ink); overflow-wrap: anywhere; view-transition-name: trk-text; }
.trk-text del { color: var(--del-ink); background: var(--del-bg); text-decoration: line-through 1.5px var(--del-line); border-radius: 4px; padding: 1px 2px; transition: opacity .25s; }
.trk-text ins { text-decoration: none; color: var(--ink); background: var(--ins-bg); box-shadow: inset 0 -2px 0 var(--ins-line); border-radius: 4px 4px 2px 2px; padding: 1px 3px; margin-left: 2px; transition: background 1.4s var(--ease), box-shadow 1.4s var(--ease); }
.trk-text.applied ins { background: transparent; box-shadow: inset 0 -1.5px 0 color-mix(in oklch, var(--ins-line) 55%, transparent); margin-left: 0; padding: 0; }
.trk-text.applied.fresh ins { background: var(--ins-bg); box-shadow: inset 0 -2px 0 var(--ins-line); animation: settle 1.6s .35s var(--ease) both; }
@keyframes settle { to { background: transparent; box-shadow: inset 0 -1.5px 0 color-mix(in oklch, var(--ins-line) 55%, transparent); } }
.trk-key { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 12.5px; color: var(--ink-2); align-items: center; }
.trk-key span { display: inline-flex; align-items: center; gap: 6px; }
.trk-key del, .trk-key ins { font: 600 12px/1.4 var(--mono); }
.trk-key del { color: var(--del-ink); background: var(--del-bg); text-decoration: line-through 1.5px var(--del-line); border-radius: 4px; padding: 0 4px; }
.trk-key ins { text-decoration: none; background: var(--ins-bg); box-shadow: inset 0 -2px 0 var(--ins-line); border-radius: 4px; padding: 0 4px; color: var(--ink); }
.trk-bar { display: flex; align-items: center; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
.trk-bar .fmt { font: 500 12px var(--mono); color: var(--ink-3); margin-right: auto; padding: 0 2px; }
.trk-bar .fmt b { color: var(--ink-2); font-weight: 600; }

/* field-by-field comparison with the sources that back each value */
.cmp { margin-top: 14px; display: grid; grid-template-columns: 120px minmax(0, 1fr) minmax(0, 1fr) minmax(200px, .8fr); border-top: 1px solid var(--line); }
.cmp > [role=row] > * { padding: 12px 14px 12px 0; border-bottom: 1px solid var(--line); font-size: 14.5px; line-height: 1.4; min-width: 0; overflow-wrap: anywhere; }
.cmp .hd { font: 500 11px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); padding-top: 12px; padding-bottom: 12px; }
.cmp .fld { color: var(--ink-2); font-size: 13px; font-weight: 700; }
.cmp .val { font-size: 14.5px; font-weight: 500; } .cmp .val.mono { font-size: 12.5px; font-weight: 400; }
.cmp .rowdiff { background: color-mix(in oklch, var(--diff) 7%, transparent); }
.cmp .by { display: flex; flex-wrap: wrap; gap: 4px; align-content: flex-start; padding-right: 0; }
.src-b { display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 7px 0 5px; border-radius: 6px; font: 500 11px/1 var(--mono); color: var(--ink-2); background: var(--surface-2); border: 1px solid var(--line-2); white-space: nowrap; }
.src-b .ui { width: 11px; height: 11px; stroke-width: 3; color: var(--ink-3); }
.cmp .tagd { display: inline-flex; align-items: center; gap: 5px; font: 700 11px/1 var(--sans); padding: 3px 7px 3px 5px; border-radius: 6px; margin-top: 6px; color: var(--ink); background: color-mix(in oklch, var(--diff) 20%, var(--surface)); box-shadow: inset 0 0 0 1px color-mix(in oklch, var(--diff) 55%, transparent); }
.cmp .tagd .ui { width: 12px; height: 12px; stroke-width: 2.4; }
.cmp .okt { display: inline-flex; align-items: center; gap: 5px; color: var(--ink-3); font: 600 11.5px/1 var(--sans); margin-top: 6px; white-space: nowrap; }
.cmp .okt .ui { width: 12px; height: 12px; stroke-width: 3; }
mark.d { background: color-mix(in oklch, var(--diff) 24%, transparent); color: inherit; border-radius: 4px; padding: 1px 3px; text-decoration: underline wavy color-mix(in oklch, var(--diff) 90%, var(--ink)) 1.5px; text-underline-offset: 4px; }
.srclist { margin-top: 10px; display: grid; }
.srcitem { display: grid; grid-template-columns: 24px 1fr auto; gap: 2px 10px; padding: 11px 0; border-bottom: 1px solid var(--line); align-items: center; }
.srcitem:last-child { border-bottom: 0; padding-bottom: 2px; }
.srcitem .ei { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; grid-row: 1 / 3; }
.srcitem.r-ok .ei { color: var(--ok); } .srcitem.r-none .ei, .srcitem.r-warn .ei { color: var(--ink-3); }
.srcitem b { font: 600 13.5px var(--mono); }
.srcitem em { font: 400 12px var(--mono); color: var(--ink-3); text-align: right; }
.srcitem span { grid-column: 2 / 4; font-size: 13.5px; color: var(--ink-2); line-height: 1.4; }
.nextcard { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 4px 14px; width: 100%; text-align: left; margin-top: 14px; padding: 16px 20px; border-radius: var(--r-lg); border: 1px dashed var(--line-2); background: color-mix(in oklch, var(--surface) 50%, transparent); transition: transform .5s var(--spring), border-color .2s, background .2s; }
.nextcard:hover { transform: translateY(-2px); border-color: var(--line-strong); background: var(--surface); }
.nextcard .eyebrow { grid-column: 1 / 3; }
.nextcard .gly { width: 22px; height: 22px; }
.nextcard b { font-size: 15px; letter-spacing: -0.01em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nextcard .ui { grid-column: 3; grid-row: 1 / 3; width: 18px; height: 18px; color: var(--ink-2); transition: transform .5s var(--spring); }
.nextcard:hover .ui { transform: translateX(3px); }
@container app (max-width: 980px) { .d-grid { grid-template-columns: 1fr; } }
@container app (max-width: 860px) and (min-width: 701px) { .cmp { grid-template-columns: 96px minmax(0, 1fr) minmax(0, 1fr) 128px; } }
@container app (max-width: 700px) {
  .crumbs { gap: 8px; }
  .crumbs .stepbtns { margin-left: auto; }
  .crumbs .pager { margin-left: 0; width: 100%; justify-content: space-between; order: 3; }
  .pager button { min-width: 32px; height: 30px; }
  .d-head { padding: 18px 16px 18px; border-radius: 22px; }
  .d-head h2 { font-size: 21px; }
  .d-head .what { font-size: 14px; }
  .card { padding: 16px 16px; border-radius: 20px; }
  .trk-text { font-size: 15px; line-height: 1.8; padding: 14px 14px; border-radius: 14px; }
  .trk-bar .fmt { flex-basis: 100%; order: 3; margin: 4px 0 0; }
  .trk-bar .btn { flex: 1; }
  .cmp { grid-template-columns: 1fr; border-top: 0; }
  .cmp .hd { display: none; }
  .cmp > [role=row] > * { padding-right: 0; }
  .cmp .fld { padding: 14px 0 4px; border-bottom: 0; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .cmp .fld br { display: none; }
  .cmp .fld .tagd, .cmp .fld .okt { margin-top: 0; }
  .cmp .val { padding: 4px 0 6px; border-bottom: 0; display: grid; grid-template-columns: 64px 1fr; gap: 8px; align-items: baseline; }
  .cmp .val::before { content: attr(data-l); font: 600 11px/1.3 var(--sans); color: var(--ink-3); }
  .cmp .rowdiff { background: none; }
  .cmp .by { padding: 4px 0 14px 72px; }
  .nextcard { padding: 14px 16px; }
}

/* ---------- COMMAND BAR (glass) ---------- */
.overlay { position: absolute; inset: 0; z-index: 60; }
.scrim { position: absolute; inset: 0; background: var(--scrim); -webkit-backdrop-filter: blur(4px) saturate(1.1); backdrop-filter: blur(4px) saturate(1.1); animation: fade .35s both; }
@keyframes fade { from { opacity: 0; } }
.cmd { position: absolute; top: 88px; left: 50%; width: min(620px, calc(100% - 24px)); transform: translateX(-50%); border-radius: 24px; animation: cmd-in .7s var(--spring) both; overflow: hidden; }
@keyframes cmd-in { from { opacity: 0; transform: translateX(-50%) translateY(-14px) scale(.95); } }
.cmd .q { display: flex; align-items: center; gap: 12px; padding: 0 16px 0 18px; height: 60px; border-bottom: 1px solid var(--line-2); }
.cmd .q .ui { width: 20px; height: 20px; color: var(--ink-2); }
.cmd input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font: 500 17px var(--sans); color: var(--ink); height: 100%; }
.cmd.glass { --glass-base: oklch(1 0 0 / 0.64); }
html[data-theme=dark] .cmd.glass { --glass-base: oklch(0.2 0.022 266 / 0.84); }
.cmd input::placeholder { color: var(--ink-2); opacity: 1; }
.cmd .list { max-height: 380px; overflow: auto; padding: 6px 8px 8px; }
.cmd .grp { font: 500 11px/1 var(--mono); letter-spacing: .09em; text-transform: uppercase; color: var(--ink-2); padding: 12px 10px 6px; }
.cmd .opt { display: flex; align-items: center; gap: 12px; min-height: 42px; padding: 6px 10px; border-radius: 12px; cursor: pointer; font-size: 14.5px; font-weight: 600; width: 100%; transition: background .15s; }
.cmd .opt > span:not(.ic) { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cmd .opt[aria-selected=true] { background: color-mix(in oklch, var(--accent) 13%, transparent); box-shadow: inset 0 0 0 1px color-mix(in oklch, var(--accent) 40%, transparent); }
.cmd .opt .ic { width: 28px; height: 28px; display: grid; place-items: center; border-radius: 9px; background: oklch(1 0 0 / 0.55); color: var(--ink); flex: none; box-shadow: inset 0 0 0 1px var(--line); }
html[data-theme=dark] .cmd .opt .ic { background: oklch(1 0 0 / 0.07); }
.cmd .opt .gly { width: 22px; height: 22px; margin: 0 3px; }
.cmd .opt small { margin-left: auto; font: 500 12px var(--mono); color: var(--ink-2); white-space: nowrap; padding-left: 8px; }
.cmd .foot { display: flex; gap: 14px; padding: 10px 18px; border-top: 1px solid var(--line-2); font-size: 12.5px; color: var(--ink-2); align-items: center; }
.cmd .foot span { display: inline-flex; gap: 6px; align-items: center; }
.cmd .empty { padding: 26px; text-align: center; color: var(--ink-2); }
@container app (max-width: 700px) { .cmd { top: 64px; } .cmd .foot span:first-child { display: none; } }

/* ---------- BRAND SHEET (glass sheet) ---------- */
.sheet { position: absolute; inset: 14px; border-radius: 30px; display: flex; flex-direction: column; animation: sheet-in .8s var(--spring-soft) both; overflow: hidden; }
@keyframes sheet-in { from { opacity: 0; transform: translateY(36px) scale(.97); } }
.sheet-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px 14px 26px; border-bottom: 1px solid var(--line-2); flex: none; }
.sheet-head h2 { font: 700 18px var(--sans); letter-spacing: -0.02em; }
.sheet-body { overflow: auto; padding: 26px 26px 48px; flex: 1; }
.sheet-body h3 { font: 500 11.5px/1 var(--mono); letter-spacing: .09em; text-transform: uppercase; color: var(--ink-2); margin: 40px 0 14px; }
.sheet-body h3:first-child { margin-top: 0; }
.bs-grid { display: grid; grid-template-columns: 1.25fr 1fr; gap: 14px; }
.bs-card { border-radius: 22px; padding: 22px; background: var(--surface); border: 1px solid var(--line-2); color: var(--ink); }
.bs-card p { color: var(--ink-2); font-size: 14px; line-height: 1.55; }
.bs-card .cap { font: 500 11px var(--mono); color: var(--ink-3); }
.marks { display: flex; align-items: flex-end; gap: 28px; flex-wrap: wrap; }
.markcell { display: grid; gap: 8px; justify-items: center; font: 500 11px var(--mono); color: var(--ink-3); }
.mk-anat { display: flex; gap: 16px; align-items: center; margin-top: 18px; padding-top: 18px; border-top: 1px solid var(--line); }
.mk-anat svg { flex: none; }
.variants { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-top: 14px; }
.var { border-radius: 18px; min-height: 120px; display: grid; place-items: center; gap: 10px; padding: 18px 10px 12px; border: 1px solid var(--line-2); font: 500 11px var(--mono); color: var(--ink-3); text-align: center; }
.var.on-light { background: oklch(0.985 0.005 262); color: oklch(0.47 0.03 265); }
.var.on-dark { background: oklch(0.16 0.018 266); color: oklch(0.71 0.016 265); border-color: oklch(1 0 0 / .1); }
.var.on-accent { background: oklch(0.47 0.2 266); color: oklch(0.95 0.02 262); border-color: transparent; }
.var.on-photo { background: radial-gradient(70% 90% at 20% 20%, oklch(0.84 0.1 238), transparent 70%), radial-gradient(70% 90% at 90% 90%, oklch(0.82 0.12 292), transparent 70%), oklch(0.92 0.04 255); color: oklch(0.3 0.04 265); }
.appicons { display: flex; gap: 22px; align-items: flex-end; flex-wrap: wrap; }
.appicons .ai { filter: drop-shadow(0 18px 24px oklch(0.3 0.15 268 / 0.35)); }
.ctx { margin-top: 18px; display: grid; gap: 10px; }
.tabbar { display: flex; align-items: center; gap: 8px; padding: 6px 8px 0; border-radius: 12px 12px 0 0; background: oklch(0.9 0.012 265); }
html[data-theme=dark] .tabbar { background: oklch(0.12 0.012 265); }
.tabbar .tab { display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 14px 0 10px; border-radius: 9px 9px 0 0; background: var(--surface); font: 500 12.5px var(--sans); color: var(--ink); max-width: 230px; }
.tabbar .tab.ghost { background: transparent; color: var(--ink-3); }
.tbar { display: flex; align-items: center; gap: 8px; padding: 6px 10px; background: var(--surface); border-radius: 0 0 12px 12px; border: 1px solid var(--line); border-top: 0; }
.tbar .url { flex: 1; height: 26px; border-radius: 99px; background: var(--surface-2); font: 400 12px/26px var(--mono); color: var(--ink-3); padding: 0 12px; overflow: hidden; white-space: nowrap; }
.tbar .ext { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; }
.tbar .ext.on { background: var(--accent-soft); box-shadow: inset 0 0 0 1px color-mix(in oklch, var(--accent) 30%, transparent); }
.lockups { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; margin-top: 14px; }
.lockup { border-radius: 18px; padding: 22px; display: flex; align-items: center; justify-content: center; min-height: 100px; background: var(--bg); border: 1px solid var(--line); color: var(--ink); }
.wm { display: inline-flex; align-items: center; gap: 11px; font: 700 24px/1 var(--sans); letter-spacing: -0.028em; color: var(--ink); white-space: nowrap; }
.wm svg { width: 36px; height: 36px; flex: none; }
.wm i { font-style: normal; color: var(--accent-text); }
.wm.mono i { color: inherit; opacity: 1; font-weight: 500; }
.pal { display: grid; gap: 14px; }
.palset { border-radius: 20px; padding: 16px; background: var(--bg); color: var(--ink); border: 1px solid var(--line-2); }
.palset > b { font: 600 12px var(--mono); display: block; margin-bottom: 12px; }
.sw-row { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
.sw { border-radius: 14px; border: 1px solid var(--line-2); background: var(--surface); overflow: hidden; display: grid; }
.sw i { height: 40px; background: var(--k); }
.sw span { padding: 8px 10px 9px; font: 500 10.5px/1.45 var(--mono); color: var(--ink-2); overflow-wrap: anywhere; }
.sw span b { display: block; font: 700 12.5px var(--sans); color: var(--ink); }
.vgrid { display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); }
.vcell { border-radius: 14px; padding: 12px; background: var(--surface); border: 1px solid var(--line-2); display: grid; gap: 8px; }
.vcell .row1 { display: flex; align-items: center; gap: 10px; }
.vcell .row1 .gly { width: 28px; height: 28px; }
.vcell code { font: 500 10.5px/1.45 var(--mono); color: var(--ink-2); }
.vcell b { font-size: 13.5px; line-height: 1.2; }
.type { display: grid; grid-template-columns: 1.3fr 1fr; gap: 14px; }
.type > div { border-radius: 20px; padding: 22px; background: var(--surface); border: 1px solid var(--line-2); }
.type .sample { margin: 0 0 14px; }
.type .t0 { font: 800 96px/.85 var(--sans); letter-spacing: -0.07em; }
.type .t1 { font: 700 34px/1.1 var(--sans); letter-spacing: -0.03em; }
.type .t2 { font: 700 22px/1.2 var(--sans); letter-spacing: -0.02em; }
.type .t3 { font: 400 15px/1.55 var(--sans); }
.type .t4 { font: 400 13px/1.6 var(--mono); color: var(--ink-2); }
.type .tag { font: 500 11px var(--mono); color: var(--ink-3); display: block; margin-bottom: 6px; }
.type .alpha { font: 400 20px/1.5 var(--sans); letter-spacing: -0.005em; word-break: break-all; }
.type .pairs { margin-top: 18px; font: 400 26px/1.3 var(--mono); letter-spacing: .02em; }
.motion { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.motion > div { border-radius: 18px; padding: 16px; background: var(--surface); border: 1px solid var(--line-2); }
.motion svg { width: 100%; height: 84px; margin: 6px 0 10px; overflow: visible; }
.motion svg path { fill: none; stroke: var(--accent); stroke-width: 2; vector-effect: non-scaling-stroke; }
.motion svg line { stroke: var(--line-2); stroke-dasharray: 3 3; vector-effect: non-scaling-stroke; }
.motion b { font-size: 13.5px; display: block; }
.motion code { font: 500 11px var(--mono); color: var(--ink-3); }
.motion .ball { width: 16px; height: 16px; border-radius: 50%; background: var(--accent); margin-top: 8px; animation: ball 1.6s var(--b) infinite alternate; }
@keyframes ball { from { transform: translateX(0); } to { transform: translateX(calc(100% * 8)); } }
@container app (max-width: 900px) { .bs-grid, .type, .motion { grid-template-columns: minmax(0, 1fr); } .bs-grid > *, .type > * { min-width: 0; } }
@container app (max-width: 700px) {
  .sheet { inset: 8px; border-radius: 24px; }
  .sheet-head { padding: 12px 12px 12px 18px; }
  .sheet-body { padding: 18px 16px 30px; }
  .variants { grid-template-columns: repeat(2, 1fr); }
  .sw-row { grid-template-columns: repeat(2, 1fr); }
  .wm { font-size: 20px; } .wm svg { width: 30px; height: 30px; }
  .type .t0 { font-size: 72px; }
  .marks { gap: 18px; }
}

/* ---------- PROTOTYPE CONTROLS (obviously not the design) ---------- */
.devbar { position: fixed; z-index: 9999; left: 50%; bottom: 12px; transform: translateX(-50%); display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; justify-content: center; padding: 6px 10px; border-radius: 10px; background: oklch(0.2 0.02 265); color: oklch(0.92 0.01 265); font: 500 11px/1 ui-monospace, 'SF Mono', Menlo, monospace; border: 1px dashed oklch(0.7 0.02 265); box-shadow: 0 10px 30px oklch(0 0 0 / .35); max-width: calc(100vw - 16px); }
.devbar .lab { color: oklch(0.75 0.15 90); letter-spacing: .08em; }
.devbar .grp { display: inline-flex; gap: 2px; align-items: center; }
.devbar button { min-height: 26px; min-width: 26px; padding: 0 8px; border-radius: 6px; color: inherit; font: inherit; border: 1px solid transparent; }
.devbar button:hover { background: oklch(1 0 0 / 0.1); }
.devbar button[aria-pressed=true], .devbar button[aria-current=true] { background: oklch(0.9 0.02 265); color: oklch(0.2 0.02 265); }
.devbar button:focus-visible { outline: 2px solid oklch(0.85 0.12 262); }
html[data-chrome=off] .devbar { display: none; }

/* ---------- view transitions ---------- */
::view-transition-group(root) { animation-duration: .45s; }
::view-transition-old(root) { animation: vt-out .2s var(--ease-out) both; }
::view-transition-new(root) { animation: vt-in .5s var(--spring-soft) both; }
@keyframes vt-out { to { opacity: 0; transform: scale(.992); } }
@keyframes vt-in { from { opacity: 0; transform: translateY(8px); } }
::view-transition-group(ref-card) { animation-duration: .62s; animation-timing-function: var(--spring-soft); }
::view-transition-old(ref-card), ::view-transition-new(ref-card) { height: 100%; object-fit: none; object-position: left top; overflow: clip; }
::view-transition-old(ref-card) { animation: vt-fade-out .22s var(--ease-out) both; }
::view-transition-new(ref-card) { animation: vt-fade-in .4s .08s var(--ease) both; }
@keyframes vt-fade-out { to { opacity: 0; } }
@keyframes vt-fade-in { from { opacity: 0; } }
::view-transition-group(topbar) { animation: none; }
::view-transition-old(trk-text) { animation: vt-fade-out .16s var(--ease-out) both; }
::view-transition-new(trk-text) { animation: trk-in .45s var(--spring-soft) both; }
::view-transition-group(trk-text) { animation-duration: .45s; animation-timing-function: var(--spring-soft); }
@keyframes trk-in { from { opacity: 0; transform: translateY(3px); } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
  :root { animation: none; }
  ::view-transition-group(*), ::view-transition-old(*), ::view-transition-new(*) { animation: none !important; }
}
html[data-still] *, html[data-still] *::before, html[data-still] *::after, html[data-still] { animation: none !important; transition: none !important; }
/* re-renders that are not navigation (language switch) must not replay entrances */
[data-instant] *, [data-instant] *::before, [data-instant] *::after { animation: none !important; transition: none !important; }
html.vt-local::view-transition-old(root), html.vt-local::view-transition-new(root) { animation: none; }
.trk-text del.out { opacity: 0; }
.stepbtns .btn.icon { width: 32px; height: 32px; }
.row .chips .fixtag { order: -1; }
.d-head .fixtag { height: 26px; font-size: 12.5px; padding: 0 10px 0 8px; }
.trk .applied-note { margin-top: 10px; font-size: 13px; color: var(--ink-2); display: flex; gap: 8px; align-items: flex-start; }
.trk .applied-note .ui { margin-top: 1px; width: 15px; height: 15px; color: var(--accent-text); }
.cmp [role=row] { display: contents; }
.mtrack { position: relative; height: 16px; margin-top: 4px; }
@container app (max-width: 700px) {
  .marks .markcell:first-child svg, .appicons .ai[width="128"] { width: 96px; height: 96px; }
  .appicons { gap: 14px; flex-wrap: wrap; }
}
/* dark command bar: the field stays a hint, not a light show */
html[data-theme=dark] .cmd.glass { background:
  radial-gradient(70% 110% at var(--fx1) var(--fy1), color-mix(in oklch, var(--f1) 36%, transparent), transparent 72%),
  radial-gradient(60% 100% at var(--fx2) var(--fy2), color-mix(in oklch, var(--f2) 26%, transparent), transparent 72%),
  var(--glass-base); }
.type .wts { display: flex; gap: 22px; font: 400 44px/1 var(--sans); letter-spacing: -0.02em; margin: 4px 0 0; }
.type .vrow { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 0; }
/* brand sheet: in-context browser strip must shrink at panel width */
.tabbar .tab { min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; flex: 0 1 auto; }
.tabbar .tab svg { flex: none; }
.tbar .url { min-width: 0; }
.tbar > * { flex-shrink: 1; } .tbar .ext { flex: none; }
.tabbar, .tbar { min-width: 0; }
.ctx, .ctx > div, .bs-card { min-width: 0; }
.tabbar .tab.ghost { flex: 0 2 auto; }
</style>

/* =====================  DATA + I18N  ===================== */
const V = ['ok', 'diff', 'mixed', 'doi', 'miss', 'unk'];

function applyTick(t) {

  $$('.ref', feed).forEach((el, i) => {
    const r = REFS[i], started = t >= r.start, done = t >= r.done;
    if (done) n++;
    const ph = done ? 'd' : started ? 'b' : 'w';
    if (el.dataset.ph !== ph) {
      el.dataset.ph = ph;
      $('.vslot', el).innerHTML = done ? vchip(r.v) : started ? `<span class="vchip pend"><i class="spinner"></i>${T().run.busy}</span>` : `<span class="vchip pend"><i class="wait"></i>${T().run.wait}</span>`;
      el.classList.toggle('done', done); el.classList.toggle('active', started && !done);
      el.classList.remove(...V.map(v => 'v-' + v)); if (done) el.classList.add('v-' + r.v);
      const c = cells[i]; c.className = done ? `d v-${r.v}` : started ? 'b' : '';

  return finished;
}
let raf = 0;
/* fresh = a new run (go('running')); otherwise continue the same clock (language switch) */
function startRun(fresh) {
  cancelAnimationFrame(raf);

  if (reducedMQ.matches) { applyTick(99); S.ran = true; return; }
  if (fresh || !S.runStart) { S.runStart = performance.now(); S.ran = false; }
  const loop = () => {
    if (S.s !== 'running') return;
    const fin = applyTick((performance.now() - S.runStart) / 1000);
    if (fin) { if (!S.ran) { S.ran = true; toast(T().run.toast(counts().ok), T().run.toastBtn, () => go('summary'), 9000); } return; }
    raf = requestAnimationFrame(loop);

function ringHTML(c) {
  const C = 2 * Math.PI * 100, gap = 26; let acc = 0, segs = '', halos = '', dots = '', k = 0;
  V.forEach(v => {
    const n = c[v]; if (!n) return;
    const frac = n / 8, len = Math.max(frac * C - gap, 2), start = acc + gap / 2;
    const attrs = `cx="120" cy="120" r="100" data-len="${len}" data-k="${k}" style="stroke-dasharray:0 ${C};stroke-dashoffset:${-start}"`;
    segs += `<circle class="seg v-${v}" ${attrs}/>`;
    if (v === 'ok') halos += `<circle class="halo v-${v}" cx="120" cy="120" r="100" style="stroke-dasharray:${len} ${C};stroke-dashoffset:${-start}"/>`;
    const mid = (acc + frac * C / 2) / C * 2 * Math.PI - Math.PI / 2;
    dots += `<span class="mk-dot" data-k="${k}" style="left:${50 + 41.67 * Math.cos(mid)}%;top:${50 + 41.67 * Math.sin(mid)}%">${gly(v)}</span>`;
    acc += frac * C; k++;

  return `<svg class="ring" id="ring" viewBox="0 0 240 240" aria-hidden="true"><circle class="trk" cx="120" cy="120" r="100"/>${halos}${segs}</svg>${dots}`;
}

let countRaf = 0;
function growRing(instant) {

    <span class="grp">${sb('intake', '1 Intake')}${sb('running', '2 Check')}${sb('summary', '3 Summary')}${sb('detail', '4 Detail')}${tg('brand', 'Brand', S.brand)}</span>
    <span class="grp">${tg('theme:light', 'Light', S.theme === 'light')}${tg('theme:dark', 'Dark', S.theme === 'dark')}</span>
    <span class="grp">${tg('w:web', 'Web', S.w === 'web')}${tg('w:panel', 'Panel 360', S.w === 'panel')}</span>
    <span class="grp">${tg('grey', 'Grey', S.grey)}${tg('lang:de', 'DE', S.lang === 'de')}${tg('lang:en', 'EN', S.lang === 'en')}${S.s === 'running' ? tg('replay', '↻ Replay') : ''}</span>`;
}

/* =====================  EVENTS  ===================== */
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const [a, arg] = el.dataset.act.split(':');
  if (a === 'home') { e.preventDefault(); go('intake'); }
  else if (a === 'nav') { const dest = ['intake', 'hist', 'acct'][+arg]; go(dest === 'intake' && !['hist', 'acct'].includes(S.s) ? S.s : dest); }
  else if (a === 'cmd') openCmd();
  else if (a === 'closeov') closeOv();
  else if (a === 'example' || a === 'drop') { S.filled = true; const ta = $('#paste'); ta.value = EXAMPLE(); $('#hint').outerHTML = hintHTML(countParas(ta.value)); }
  else if (a === 'start') { S.filled = true; go('running'); }
  else if (a === 'new') { S.filled = false; S.draft = ''; S.filter = null; go('intake'); }
  else if (a === 'filter') { S.filter = S.filter === arg ? null : arg; patchFilter(); }
  else if (a === 'open') { const from = S.s; go('detail', { ref: +arg }, from === 'summary' ? el : null); }
  else if (a === 'to') go(arg, arg === 'summary' && S.s === 'detail' ? { _back: true } : {});
  else if (a === 'copy') { const r = REFS.find(x => x.id === S.ref); copyText(plainTrack(r, 1)); toast(T().trk.copied); }
  else if (a === 'accept') setAccepted(true);
  else if (a === 'undo') setAccepted(false);
  else if (a === 'step') { S.filter = null; if (arg === 'detail') S.ref = 3; closeOv(); go(arg); }
  else if (a === 'brand') { S.brand = !S.brand; renderOverlay(); renderDev(); }
  else if (a === 'theme') { S.theme = arg; applyChrome(); renderDev(); }
  else if (a === 'w') { S.w = arg; applyChrome(); renderDev(); }
  else if (a === 'grey') { S.grey = !S.grey; applyChrome(); renderDev(); }
  else if (a === 'lang') { S.lang = arg; render({ instant: true }); }
  else if (a === 'replay') { go('running'); }
});
document.addEventListener('keydown', (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); S.cmd ? closeOv() : openCmd(); return; }
  if ((e.metaKey || e.ctrlKey) && e.key === 'Enter' && S.s === 'intake') { S.filled = true; go('running'); return; }
  if (e.key === 'Escape' && (S.cmd || S.brand)) { closeOv(); return; }
  if (S.cmd) {
    const n = (S._flat || []).length;
    if (e.key === 'ArrowDown') { e.preventDefault(); S.sel = (S.sel + 1) % Math.max(n, 1); updateSel(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); S.sel = (S.sel + n - 1) % Math.max(n, 1); updateSel(); }
    else if (e.key === 'Enter') { e.preventDefault(); const it = S._flat[S.sel]; if (it) { closeOv(); it.f(); } }
    else if (e.key === 'Tab') { e.preventDefault(); }
    return;
  }
  const typing = /^(INPUT|TEXTAREA)$/.test(document.activeElement && document.activeElement.tagName);
  if (S.s === 'detail' && !S.brand && !typing && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) {
    const i = REFS.findIndex(r => r.id === S.ref); go('detail', { ref: REFS[(i + (e.key === 'ArrowRight' ? 1 : 7)) % 8].id });
  }
});
function updateSel() { $$('.opt').forEach((o, i) => o.setAttribute('aria-selected', i === S.sel)); const o = $('.opt[aria-selected=true]'); if (o) { o.scrollIntoView({ block: 'nearest' }); $('#cmdq').setAttribute('aria-activedescendant', o.id); } }
document.addEventListener('input', (e) => {
  if (e.target.id === 'cmdq') { S.q = e.target.value; S.sel = 0; const pos = e.target.selectionStart; renderOverlay(); const q = $('#cmdq'); q.focus(); q.setSelectionRange(pos, pos); }
  else if (e.target.id === 'paste') { S.draft = e.target.value; S.filled = false; $('#hint').outerHTML = hintHTML(countParas(e.target.value)); }
});
document.addEventListener('mouseover', (e) => { const o = e.target.closest('.opt'); if (o && S.cmd && +o.dataset.i !== S.sel) { S.sel = +o.dataset.i; updateSel(); } });
document.addEventListener('mousedown', (e) => { const o = e.target.closest('.opt'); if (o && S.cmd) { e.preventDefault(); const it = S._flat[+o.dataset.i]; closeOv(); it && it.f(); } });
document.addEventListener('pointermove', (e) => { const g = e.target.closest && e.target.closest('.glass'); if (!g) return; const r = g.getBoundingClientRect(); g.style.setProperty('--mx', (e.clientX - r.left) + 'px'); g.style.setProperty('--my', (e.clientY - r.top) + 'px'); });
['dragover', 'dragenter'].forEach(ev => document.addEventListener(ev, (e) => { const d = e.target.closest && e.target.closest('#drop'); if (d) { e.preventDefault(); d.classList.add('over'); } }));
['dragleave', 'drop'].forEach(ev => document.addEventListener(ev, (e) => { const d = $('#drop'); if (d) d.classList.remove('over'); if (ev === 'drop' && e.target.closest && e.target.closest('#drop')) { e.preventDefault(); S.filled = true; render({ instant: true }); } }));

/* boot */
render();
if (S.cmd) { S._noFocus = still(); renderOverlay(); }
document.fonts && document.fonts.ready.then(() => document.body.setAttribute('data-fonts', 'ready'));
</script>
</body>
</html>
