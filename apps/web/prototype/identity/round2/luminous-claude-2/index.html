<!doctype html>
<html lang="de" data-theme="dark" data-w="web">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Source Taster – Luminous (Lumen)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<script>
/* ============ Palette: single source of truth (OKLCH). Injected as CSS variables, shown live in the brand sheet. ============ */
const PAL = {
  light: {
    bg:[.98,.004,240], surface:[1,0,0], raised:[.962,.007,240], text:[.2,.02,250], t2:[.44,.02,250], t3:[.5,.02,250],
    accent:[.5,.12,232], onAccent:[1,0,0], mkHi:[.72,.12,215], mkLo:[.42,.14,255], ctl:[.58,.02,250],
    ok:[.48,.14,155], diff:[.5,.11,75], mixed:[.52,.17,8], doi:[.52,.18,28], miss:[.5,.17,42], unk:[.5,.012,250]
  },
  dark: {
    bg:[.14,.012,245], surface:[.18,.014,245], raised:[.22,.016,245], text:[.96,.006,245], t2:[.76,.02,245], t3:[.66,.02,245],
    accent:[.82,.12,228], onAccent:[.16,.03,235], mkHi:[.92,.09,205], mkLo:[.66,.14,245], ctl:[.56,.02,245],
    ok:[.82,.17,155], diff:[.85,.15,88], mixed:[.76,.16,8], doi:[.74,.18,28], miss:[.72,.19,40], unk:[.74,.012,250]
  }
};
const ok_ = ([l,c,h]) => `oklch(${l} ${c} ${h})`;
const NAMES = {bg:'bg',surface:'surface',raised:'raised',text:'text',t2:'text-2',t3:'text-3',accent:'accent',onAccent:'on-accent',mkHi:'mark-hi',mkLo:'mark-lo',ctl:'control',ok:'v-ok',diff:'v-diff',mixed:'v-mixed',doi:'v-doi',miss:'v-miss',unk:'v-unk'};
function paletteCSS(){
  const block = p => Object.keys(NAMES).map(k => `--${NAMES[k]}:${ok_(p[k])};`).join('');
  return `:root{${block(PAL.light)}}:root[data-theme="dark"]{${block(PAL.dark)}}`;
}
document.write('<style id="pal">' + paletteCSS() + '</style>');
/* theme/width from URL before first paint */
(function(){
  const q = new URLSearchParams(location.search), h = document.documentElement;
  if (q.get('theme')) h.dataset.theme = q.get('theme');
  if (q.get('w')) h.dataset.w = q.get('w');
  if (q.get('chrome') === '0') h.dataset.chrome = 'off';
  if (q.get('gray') === '1') h.dataset.gray = '1';
  if (q.get('lang') === 'en') h.lang = 'en';
})();
</script>
<style>
:root{
  --f-sans:'IBM Plex Sans',ui-sans-serif,system-ui,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --spring:linear(0,.2 4%,.62 9%,.92 15%,1.045 21%,1.055 26%,1.02 33%,.995 42%,1.002 55%,1);
  --ease:cubic-bezier(.2,.8,.2,1);
  --r-lg:20px;--r-md:14px;--r-sm:9px;
  --line:oklch(.2 .03 250/.09);--line-2:oklch(.2 .03 250/.17);
  --shadow-tile:0 1px 0 oklch(1 0 0/.9) inset,0 1px 2px oklch(.2 .03 250/.06),0 18px 40px -22px oklch(.3 .07 250/.28);
  --glow-a:oklch(.78 .1 225/.40);--glow-b:oklch(.86 .08 200/.30);
  --c:var(--text);
  --accent-glow:oklch(.7 .12 228/.45);
  --glass-bg:oklch(1 0 0/.8);--glass-line:oklch(.2 .03 250/.16);--glass-ink:oklch(.2 .02 250);--glass-ink2:oklch(.34 .02 250);
  --scrim:oklch(.2 .03 250/.25);
  color-scheme:light;
}
:root[data-theme="dark"]{
  --line:oklch(1 0 0/.08);--line-2:oklch(1 0 0/.15);
  --shadow-tile:0 1px 0 oklch(1 0 0/.07) inset,0 24px 50px -28px oklch(0 0 0/.9);
  --glow-a:oklch(.58 .13 228/.34);--glow-b:oklch(.55 .11 200/.18);
  --accent-glow:oklch(.72 .13 225/.55);
  --glass-bg:oklch(.2 .015 245/.8);--glass-line:oklch(1 0 0/.16);--glass-ink:oklch(.97 .005 245);--glass-ink2:oklch(.86 .01 245);
  --scrim:oklch(0 0 0/.5);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:400 15px/1.5 var(--f-sans);font-feature-settings:"tnum" 1;-webkit-font-smoothing:antialiased;min-height:100dvh}
button{font:inherit;color:inherit;cursor:pointer}
button,input,textarea{outline-offset:2px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.mono{font-family:var(--f-mono)}
kbd{font:500 11px/1 var(--f-mono);padding:3px 6px;border-radius:6px;border:1px solid var(--line-2);background:color-mix(in oklab,var(--text) 5%,transparent);color:var(--text-2)}
svg.gl{flex:none;display:block}

/* verdict colour hooks */
.v-ok{--c:var(--v-ok)}.v-diff{--c:var(--v-diff)}.v-mixed{--c:var(--v-mixed)}.v-doi{--c:var(--v-doi)}.v-miss{--c:var(--v-miss)}.v-unk{--c:var(--v-unk)}
.gl{color:var(--c)}
:root[data-theme="dark"] .gl-glow{filter:drop-shadow(0 0 5px color-mix(in oklab,var(--c) 60%,transparent))}

/* ============ page stage + frame ============ */
.stage{min-height:100dvh;padding-bottom:84px}
.frame{position:relative;isolation:isolate;container:app/inline-size;display:flex;flex-direction:column;min-height:calc(100dvh - 84px);background:var(--bg);overflow:clip}
.frame::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(52% 38% at 50% -6%,var(--glow-a),transparent 72%),
    radial-gradient(36% 30% at 100% 100%,var(--glow-b),transparent 72%);}
.frame::after{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;opacity:.55;
  background-image:radial-gradient(var(--line-2) 1px,transparent 1.2px);background-size:26px 26px;
  -webkit-mask-image:radial-gradient(70% 55% at 50% 0,#000,transparent 80%);mask-image:radial-gradient(70% 55% at 50% 0,#000,transparent 80%)}
html[data-w="panel"] .stage{padding:0;display:flex;justify-content:center;background:color-mix(in oklab,var(--bg) 70%,black)}
html[data-w="panel"] .frame{width:360px;height:calc(100dvh - 84px);min-height:0;margin-top:12px;border-radius:20px;border:1px solid var(--line-2);box-shadow:0 30px 80px -30px #000}
html[data-w="panel"] .scroll{overflow:auto;overscroll-behavior:contain}
html[data-chrome="off"] .stage{padding-bottom:0}
html[data-chrome="off"][data-w="panel"] .frame{width:100%;height:100dvh;margin:0;border:0;border-radius:0;box-shadow:none}
html[data-chrome="off"] .frame{min-height:100dvh}
html[data-gray="1"] .stage,html[data-gray="1"] .overlays{filter:grayscale(1)}

/* ============ header ============ */
.top{view-transition-name:top;position:sticky;top:0;z-index:20;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;height:60px;padding:0 24px;background:color-mix(in oklab,var(--bg) 92%,transparent);border-bottom:1px solid var(--line)}
html[data-w="panel"] .top{position:relative}
.lockup{height:28px;width:auto;color:var(--text);overflow:visible}
.lockup .wm{font:500 17px var(--f-sans);letter-spacing:-.012em;fill:currentColor}
.lockup .w2{font-weight:600;fill:var(--accent)}
.brandbtn{display:inline-flex;align-items:center;background:none;border:0;padding:4px;margin:-4px;border-radius:10px;justify-self:start}
.nav{display:flex;gap:2px;padding:3px;border-radius:12px;background:color-mix(in oklab,var(--text) 5%,transparent);border:1px solid var(--line)}
.nav button{position:relative;border:0;background:none;height:30px;padding:0 14px;border-radius:9px;font-weight:500;font-size:14px;color:var(--text-2);transition:color .2s,background .3s var(--ease)}
.nav button:hover{color:var(--text)}
.nav button[aria-current="page"]{color:var(--text);background:var(--surface);box-shadow:0 0 0 1px var(--line-2),0 4px 14px -6px oklch(0 0 0/.35)}
.topr{display:flex;gap:10px;justify-content:flex-end;align-items:center}
.kbtn{display:inline-flex;align-items:center;gap:10px;height:34px;padding:0 8px 0 12px;border-radius:10px;border:1px solid var(--line-2);background:color-mix(in oklab,var(--text) 4%,transparent);color:var(--text-2);font-size:13.5px;transition:border-color .2s,background .2s}
.kbtn:hover{color:var(--text);border-color:color-mix(in oklab,var(--accent) 55%,var(--line-2))}
.avatar{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font:600 12px var(--f-sans);color:var(--on-accent);background:linear-gradient(140deg,var(--mark-hi),var(--mark-lo));box-shadow:0 0 0 1px var(--line-2)}
.dock{display:none}

.scroll{flex:1;min-height:0}
.view{max-width:1120px;margin:0 auto;padding:44px 32px 40px}
.view[data-v="intake"]{max-width:780px;padding-top:min(10vh,88px)}

/* ============ shared atoms ============ */
.eyebrow{font:500 11.5px/1 var(--f-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--text-2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:38px;padding:0 16px;border-radius:11px;border:1px solid var(--line-2);background:color-mix(in oklab,var(--text) 5%,transparent);font-weight:500;font-size:14px;color:var(--text);transition:transform .35s var(--spring),border-color .2s,background .2s,box-shadow .3s}
.btn:hover{border-color:color-mix(in oklab,var(--accent) 55%,var(--line-2))}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(180deg,color-mix(in oklab,var(--accent) 88%,white),var(--accent));color:var(--on-accent);border-color:color-mix(in oklab,var(--accent) 60%,transparent);font-weight:600;box-shadow:0 1px 0 oklch(1 0 0/.4) inset,0 8px 26px -8px var(--accent-glow)}
.btn.primary:hover{box-shadow:0 1px 0 oklch(1 0 0/.4) inset,0 10px 34px -6px var(--accent-glow)}
.btn.primary kbd{background:color-mix(in oklab,var(--on-accent) 14%,transparent);border-color:color-mix(in oklab,var(--on-accent) 30%,transparent);color:var(--on-accent)}
.btn.sm{height:30px;padding:0 11px;font-size:13px;border-radius:9px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px 3px 7px;border-radius:99px;font-size:12.5px;font-weight:500;line-height:1.3;white-space:nowrap;color:var(--c);background:color-mix(in oklab,var(--c) 14%,var(--surface));border:1px solid color-mix(in oklab,var(--c) 34%,transparent)}
.chip.pend{--c:var(--accent)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px 1px var(--accent-glow)}
.dot.live{animation:pulse 1.6s var(--ease) infinite}
@keyframes pulse{50%{opacity:.35;transform:scale(.75)}}

/* ============ INTAKE ============ */
.hero-i{text-align:center;position:relative}
.hero-i h1{text-wrap:balance;margin:18px 0 12px;font-size:clamp(30px,4.4vw,46px);line-height:1.08;font-weight:600;letter-spacing:-.03em}
.hero-i h1 em{font-style:normal;background:linear-gradient(95deg,var(--text) 10%,var(--accent) 90%);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero-i p{margin:0 auto 30px;max-width:520px;color:var(--text-2);font-size:16px}
.badge{display:inline-flex;align-items:center;gap:9px;padding:6px 12px;border-radius:99px;border:1px solid var(--line-2);background:color-mix(in oklab,var(--text) 4%,transparent);font:500 12px var(--f-mono);color:var(--text-2)}
.beam{position:absolute;left:50%;top:-120px;width:560px;height:340px;transform:translateX(-50%);pointer-events:none;z-index:-1;
  background:conic-gradient(from 180deg at 50% 0,transparent 156deg,color-mix(in oklab,var(--accent) 32%,transparent) 180deg,transparent 204deg);filter:blur(14px);opacity:1;
  -webkit-mask-image:linear-gradient(#000 20%,transparent);mask-image:linear-gradient(#000 20%,transparent)}
:root:not([data-theme="dark"]) .beam{opacity:.7}
.field{position:relative;text-align:left;border-radius:var(--r-lg);background:linear-gradient(180deg,color-mix(in oklab,var(--surface) 100%,transparent),color-mix(in oklab,var(--surface) 92%,var(--bg)));border:1px solid var(--control);box-shadow:var(--shadow-tile);transition:box-shadow .5s var(--ease),border-color .3s}
.field::before{content:"";position:absolute;left:12%;right:12%;top:-1px;height:1px;background:linear-gradient(90deg,transparent,color-mix(in oklab,var(--accent) 80%,white),transparent);opacity:.75}
.field:focus-within{border-color:var(--accent);box-shadow:var(--shadow-tile),0 0 0 4px color-mix(in oklab,var(--accent) 18%,transparent),0 0 60px -10px var(--accent-glow)}
.field-h{display:flex;align-items:center;justify-content:space-between;padding:14px 18px 0}
.field textarea{display:block;width:100%;min-height:196px;resize:vertical;border:0;background:none;color:var(--text);font:400 15px/1.6 var(--f-sans);padding:10px 18px 14px;outline:none}
.field textarea::placeholder{color:var(--text-3)}
.field-f{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:12px;border-top:1px solid var(--line)}
.drop{display:flex;align-items:center;gap:10px;min-height:38px;padding:0 14px;border-radius:11px;border:1px dashed var(--control);background:none;color:var(--text-2);font-size:13.5px;text-align:left;transition:border-color .2s,background .2s,color .2s}
.drop:hover,.drop.over{border-color:var(--accent);color:var(--text);background:color-mix(in oklab,var(--accent) 9%,transparent)}
.drop small{font:400 11.5px var(--f-mono);color:var(--text-3)}
.actions{display:flex;gap:8px;align-items:center}
.srcrow{margin-top:26px;display:flex;flex-wrap:wrap;justify-content:center;gap:8px 18px;font:500 12.5px var(--f-mono);color:var(--text-2)}
.srcrow span{display:inline-flex;gap:8px;align-items:center}
.srcrow i{width:6px;height:6px;border-radius:50%;background:var(--v-ok);box-shadow:0 0 8px var(--v-ok)}

/* ============ RUNNING ============ */
.rh{display:grid;grid-template-columns:1fr auto;gap:8px 24px;align-items:end;margin-bottom:24px}
.rh h2{margin:8px 0 0;font-size:28px;font-weight:600;letter-spacing:-.025em;line-height:1.15}
.rh .cnt{font:500 34px/1 var(--f-mono);letter-spacing:-.04em}
.rh .cnt small{font-size:15px;color:var(--text-2);letter-spacing:0}
.pbar{grid-column:1/-1;height:3px;border-radius:3px;background:var(--line-2);overflow:visible;position:relative}
.pbar i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;width:calc(var(--p,0)*100%);background:linear-gradient(90deg,color-mix(in oklab,var(--accent) 40%,transparent),var(--accent));box-shadow:0 0 16px 1px var(--accent-glow);transition:width .7s var(--ease)}
.pbar i::after{content:"";position:absolute;right:-3px;top:-3px;width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 14px 3px var(--accent-glow)}
.tally{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px 16px;font:500 12.5px var(--f-mono);color:var(--text-2);margin-top:2px}
.tally span{display:inline-flex;gap:6px;align-items:center;opacity:.6}
.tally span.n{opacity:1;color:var(--text)}
.feed{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.fr{position:relative;display:grid;grid-template-columns:34px minmax(0,1fr);gap:0 14px;animation:rowin .6s var(--spring) both}
.fr.static{animation:none}
@keyframes rowin{from{opacity:0;transform:translateY(14px) scale(.985)}}
.spine{position:relative;display:flex;justify-content:center;padding-top:18px}
.spine::before{content:"";position:absolute;top:44px;bottom:-14px;left:50%;width:1px;background:var(--line-2)}
.fr:last-child .spine::before{display:none}
.fr[data-s="done"] .spine::before{background:linear-gradient(var(--c),var(--line-2) 80%);opacity:.8}
.node{position:relative;z-index:1;width:26px;height:26px;display:grid;place-items:center;border-radius:50%;background:var(--bg)}
.ring{width:22px;height:22px;border-radius:50%;border:2px solid color-mix(in oklab,var(--accent) 30%,transparent);border-top-color:var(--accent);animation:spin 1s linear infinite;box-shadow:0 0 18px -2px var(--accent-glow)}
@keyframes spin{to{transform:rotate(1turn)}}
.fcard{min-width:0;padding:14px 16px;border-radius:var(--r-md);background:linear-gradient(180deg,color-mix(in oklab,var(--surface) 100%,transparent),color-mix(in oklab,var(--surface) 90%,var(--bg)));border:1px solid var(--line);box-shadow:var(--shadow-tile);transition:border-color .6s,box-shadow .8s}
.fr[data-s="pending"] .fcard{border-color:color-mix(in oklab,var(--accent) 50%,transparent);box-shadow:var(--shadow-tile),0 0 36px -10px var(--accent-glow)}
.fr[data-s="done"] .fcard{border-color:color-mix(in oklab,var(--c) 30%,var(--line))}
:root[data-theme="dark"] .fr[data-s="done"] .fcard{box-shadow:var(--shadow-tile),0 0 34px -18px var(--c)}
.fhead{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;align-items:start}
.ix{font:500 12px/1.9 var(--f-mono);color:var(--text-3)}
.cit{min-width:0;font-size:15px;line-height:1.45}
.cit b{font-weight:600;letter-spacing:-.005em}
.cit span{color:var(--text-2)}
.fstat{min-height:26px;display:flex;justify-content:flex-end}
.fstat .chip{animation:chipin .55s var(--spring) both}
@keyframes chipin{from{opacity:0;transform:scale(.8)}}
.trail{list-style:none;margin:10px 0 0;padding:10px 0 0;border-top:1px dashed var(--line-2);display:grid;gap:6px}
.ev{display:grid;grid-template-columns:16px minmax(0,1fr);gap:8px;align-items:start;font-size:13.5px;line-height:1.5;color:var(--text-2);opacity:0;transform:translateY(5px);transition:opacity .45s var(--ease),transform .6s var(--spring)}
.ev.on{opacity:1;transform:none}
.ev b{font:500 12.5px var(--f-mono);color:var(--text);margin-right:8px}
.ev svg{margin-top:3px}
.k-ok svg{color:var(--v-ok)}.k-dev svg{color:var(--v-diff)}.k-none svg{color:var(--text-3)}.k-skip svg,.k-err svg{color:var(--v-unk)}
.donebar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:22px;padding:14px 16px;border-radius:var(--r-md);border:1px solid var(--line-2);background:color-mix(in oklab,var(--accent) 7%,var(--surface));animation:rowin .6s var(--spring) both}

/* ============ BENTO ============ */
.sh{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.sh h2{margin:8px 0 0;font-size:28px;font-weight:600;letter-spacing:-.025em;line-height:1.15}
.sh .meta{font:400 12.5px var(--f-mono);color:var(--text-2)}
.bento{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));grid-template-rows:repeat(3,150px) auto;gap:14px}
.tile{position:relative;isolation:isolate;overflow:hidden;text-align:left;border-radius:var(--r-lg);padding:18px 20px;border:1px solid var(--line);background:linear-gradient(180deg,color-mix(in oklab,var(--surface) 100%,transparent),color-mix(in oklab,var(--surface) 88%,var(--bg)));box-shadow:var(--shadow-tile);transition:transform .5s var(--spring),border-color .25s,box-shadow .4s}
.tile::after{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;opacity:0;transition:opacity .35s;background:radial-gradient(260px circle at var(--mx,50%) var(--my,-30%),color-mix(in oklab,var(--c,var(--accent)) 20%,transparent),transparent 70%)}
.tile:hover::after{opacity:1}
button.tile{cursor:pointer;display:flex;flex-direction:column;border-color:var(--line)}
button.tile:hover{border-color:color-mix(in oklab,var(--c) 45%,var(--line));transform:translateY(-2px)}
button.tile:active{transform:scale(.985)}
button.tile[aria-pressed="true"]{border-color:var(--c);box-shadow:var(--shadow-tile),0 0 0 3px color-mix(in oklab,var(--c) 22%,transparent),0 0 40px -12px var(--c)}
.th{display:flex;align-items:center;gap:9px;font-size:13.5px;font-weight:500;color:var(--text)}
.th .short{display:none}
.th .pc{margin-left:auto;font:500 12px var(--f-mono);color:var(--text-2)}
.tn{font-size:68px;line-height:.9;font-weight:600;letter-spacing:-.05em;margin-top:auto;color:var(--text)}
.td{font-size:13px;line-height:1.4;color:var(--text-2);margin-top:8px}
.tnames{font:400 11.5px/1.5 var(--f-mono);color:var(--text-3);margin-top:8px}
.tbar{display:block;height:4px;border-radius:4px;background:var(--line-2);margin-top:12px;overflow:hidden}
.tbar i{display:block;height:100%;width:var(--w);background:var(--c);border-radius:4px;box-shadow:0 0 12px var(--c);animation:grow .9s var(--spring) both .3s}
@keyframes grow{from{width:0}}
.t-hero{grid-column:1/6;grid-row:1/4;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;background:
  radial-gradient(70% 52% at 50% 36%,color-mix(in oklab,var(--accent) 22%,transparent),transparent 72%),linear-gradient(180deg,var(--surface),color-mix(in oklab,var(--surface) 86%,var(--bg)))}
.t-hero .eyebrow{align-self:flex-start}
.dial{position:relative;width:min(100%,292px);aspect-ratio:1;margin:6px 0 0}
.dial svg{width:100%;height:100%;overflow:visible}
.dial .seg{fill:none;stroke:var(--c);stroke-width:12;stroke-linecap:butt;transform:rotate(-90deg);transform-origin:120px 120px;animation:seg 1s var(--spring) both;animation-delay:calc(var(--i)*.07s + .15s)}
:root[data-theme="dark"] .dial .seg{filter:drop-shadow(0 0 6px color-mix(in oklab,var(--c) 70%,transparent))}
@keyframes seg{from{stroke-dasharray:0 100}}
.dial .trk{fill:none;stroke:var(--line-2);stroke-width:12}
.dial-c{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.dial-c b{display:block;font-size:104px;line-height:.9;font-weight:600;letter-spacing:-.06em;background:linear-gradient(180deg,var(--text) 35%,color-mix(in oklab,var(--accent) 70%,var(--text)));-webkit-background-clip:text;background-clip:text;color:transparent}
.dial-c span{font-size:14px;color:var(--text-2);margin-top:6px}
.dial-c span em{font-style:normal;color:var(--text);font-weight:500}
.t-hero p{margin:14px 0 14px;font-size:14.5px;color:var(--text-2);max-width:300px;line-height:1.45}
.t-hero p strong{color:var(--text);font-weight:600}
.t-ok{grid-column:6/9;grid-row:1/3}
.t-diff{grid-column:9/13;grid-row:1/2}
.t-unk{grid-column:9/13;grid-row:2/3}
.t-ok .tn{font-size:96px}
.t-red{grid-column:6/13;grid-row:3/4;display:flex;flex-direction:column;gap:10px;padding:14px 14px 14px 20px}
.t-red .reds{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;flex:1;min-height:0}
.rb{position:relative;display:flex;flex-direction:column;justify-content:space-between;text-align:left;padding:10px 12px;border-radius:12px;border:1px solid color-mix(in oklab,var(--c) 26%,var(--line));background:color-mix(in oklab,var(--c) 7%,var(--surface));transition:transform .4s var(--spring),border-color .2s,box-shadow .3s}
.rb:hover{border-color:var(--c);transform:translateY(-2px)}
.rb[aria-pressed="true"]{border-color:var(--c);box-shadow:0 0 0 3px color-mix(in oklab,var(--c) 22%,transparent)}
.rb .l{display:flex;gap:7px;align-items:center;font-size:12.5px;font-weight:500;line-height:1.2}
.rb .n{font-size:34px;line-height:1;font-weight:600;letter-spacing:-.04em}
.t-src{grid-column:1/8;grid-row:4/5;min-height:180px}
.t-note{grid-column:8/13;grid-row:4/5;display:flex;flex-direction:column;justify-content:space-between;gap:14px;background:linear-gradient(160deg,color-mix(in oklab,var(--accent) 12%,var(--surface)),var(--surface))}
.t-note p{margin:0;font-size:15px;line-height:1.5}
.srcs{display:grid;gap:9px;margin-top:14px}
.srcs div{display:grid;grid-template-columns:132px 1fr 40px;gap:12px;align-items:center;font:500 12.5px var(--f-mono);color:var(--text-2)}
.srcs i{display:block;height:6px;border-radius:6px;background:var(--line-2);position:relative;overflow:hidden}
.srcs i::before{content:"";position:absolute;inset:0;width:var(--w);background:linear-gradient(90deg,color-mix(in oklab,var(--accent) 45%,transparent),var(--accent));border-radius:6px;animation:grow .9s var(--spring) both .4s}
.srcs b{text-align:right;color:var(--text);font-weight:500}

.lh{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:34px 0 12px;flex-wrap:wrap}
.lh h3{margin:0;font-size:17px;font-weight:600;letter-spacing:-.01em}
.filt{font:500 12.5px var(--f-mono);color:var(--text-2);display:inline-flex;gap:10px;align-items:center}
.rows{display:grid;gap:0;border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface);overflow:hidden;box-shadow:var(--shadow-tile)}
.rw{display:grid;grid-template-columns:36px 20px minmax(0,1fr) auto 16px;gap:12px;align-items:center;width:100%;text-align:left;padding:12px 16px;border:0;border-top:1px solid var(--line);background:none;min-height:56px;transition:background .2s}
.rw:first-child{border-top:0}
.rw:hover{background:color-mix(in oklab,var(--c) 7%,transparent)}
.rw .cit{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rw .arr{color:var(--text-3)}
.rw[hidden]{display:none}
.empty{padding:28px;text-align:center;color:var(--text-2)}

/* ============ DETAIL ============ */
.back{display:inline-flex;align-items:center;gap:8px;height:30px;padding:0 12px 0 8px;border-radius:9px;border:1px solid var(--line-2);background:none;font-size:13.5px;color:var(--text-2)}
.back:hover{color:var(--text);border-color:var(--accent)}
.dh{display:grid;grid-template-columns:auto 1fr;gap:6px 20px;align-items:center;margin:22px 0 28px}
.dh .big{grid-row:1/3;width:68px;height:68px;border-radius:20px;display:grid;place-items:center;color:var(--c);background:radial-gradient(circle at 50% 30%,color-mix(in oklab,var(--c) 30%,transparent),color-mix(in oklab,var(--c) 8%,var(--surface)));border:1px solid color-mix(in oklab,var(--c) 40%,transparent);box-shadow:0 0 44px -10px var(--c);view-transition-name:vt-glyph}
.dh h2{margin:0;font-size:30px;font-weight:600;letter-spacing:-.028em;line-height:1.15}
.dh p{margin:0;color:var(--text-2);font-size:15px}
.dcols{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:18px;align-items:start}
.card{border:1px solid var(--line);border-radius:var(--r-lg);background:linear-gradient(180deg,var(--surface),color-mix(in oklab,var(--surface) 90%,var(--bg)));box-shadow:var(--shadow-tile);overflow:hidden}
.card+.card{margin-top:18px}
.card>h3{margin:0;padding:16px 20px 12px;display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:600;gap:12px}
.cmp{display:grid;grid-template-columns:104px minmax(0,1fr) minmax(0,1fr) 128px;font-size:14px}
.cmp>*{padding:12px 14px;border-top:1px solid var(--line);min-width:0;overflow-wrap:anywhere}
.cmp .hd{font:500 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--text-2);border-top:1px solid var(--line-2);padding-top:9px;padding-bottom:9px;background:color-mix(in oklab,var(--text) 3%,transparent)}
.cmp .lb{color:var(--text-2);font-size:13px}
.cmp .rowdev{box-shadow:inset 3px 0 0 var(--v-diff)}
.cmp .st{display:flex;gap:7px;align-items:flex-start;font-size:12.5px;font-weight:500;color:var(--text-2)}
.cmp .st.dev{color:var(--v-diff)}
.cmp .st.bad{color:var(--v-miss)}
del{text-decoration:line-through;text-decoration-thickness:1.5px;text-decoration-color:var(--v-diff);color:var(--text-2)}
mark{background:color-mix(in oklab,var(--v-diff) 22%,transparent);color:var(--text);padding:0 3px;border-radius:4px;box-shadow:inset 0 -2px 0 var(--v-diff);font-weight:500}
mark.bad{background:color-mix(in oklab,var(--v-miss) 20%,transparent);box-shadow:inset 0 -2px 0 var(--v-miss)}
.fix{padding:0 20px 20px}
.seg2{display:inline-flex;padding:2px;border-radius:9px;background:color-mix(in oklab,var(--text) 6%,transparent);border:1px solid var(--line)}
.seg2 button{border:0;background:none;height:24px;padding:0 10px;border-radius:7px;font:500 12px var(--f-mono);color:var(--text-2)}
.seg2 button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:0 0 0 1px var(--line-2)}
.code{margin:0 0 14px;padding:14px;border-radius:12px;background:color-mix(in oklab,var(--bg) 70%,var(--surface));border:1px solid var(--line-2);font:400 13px/1.65 var(--f-mono);white-space:pre-wrap;overflow-wrap:anywhere;color:var(--text)}
.srcl{list-style:none;margin:0;padding:0 8px 10px}
.srcl li{display:grid;grid-template-columns:18px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;border-radius:10px;font-size:13.5px}
.srcl li+li{border-top:1px solid var(--line)}
.srcl b{font:500 13px var(--f-mono)}
.srcl .m{display:block;font-size:12.5px;color:var(--text-2);margin-top:1px}
.srcl .pct{font:500 12px var(--f-mono);color:var(--text-2)}
.reason{padding:6px 20px 20px;color:var(--text-2);font-size:14.5px}
.disc{margin-top:26px;display:flex;gap:10px;align-items:flex-start;color:var(--text-2);font-size:13px;max-width:70ch}

/* ============ small views ============ */
.plain h2{margin:8px 0 22px;font-size:28px;font-weight:600;letter-spacing:-.025em}

/* ============ BRAND SHEET ============ */
.brand{display:grid;gap:30px}
.brand h2{margin:8px 0 0;font-size:28px;font-weight:600;letter-spacing:-.025em}
.brand h3{margin:0 0 14px;font-size:13px;font-weight:500;font-family:var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--text-2)}
.bgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.mk-tile{border-radius:var(--r-lg);padding:22px;display:flex;flex-wrap:wrap;gap:22px;align-items:flex-end;border:1px solid var(--line-2)}
.mk-tile.d{background:oklch(.14 .012 245);color:oklch(.96 .006 245);--text:oklch(.96 .006 245);--accent:oklch(.82 .12 228);--mark-hi:oklch(.92 .09 205);--mark-lo:oklch(.66 .14 245)}
.mk-tile.l{background:oklch(.98 .004 240);color:oklch(.2 .02 250);--text:oklch(.2 .02 250);--accent:oklch(.5 .12 232);--mark-hi:oklch(.72 .12 215);--mark-lo:oklch(.42 .14 255)}
.mk-tile .cap{font:400 11px var(--f-mono);opacity:.7;margin-top:6px;display:block}
.glrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.gcell{display:flex;flex-direction:column;gap:12px;padding:14px;border-radius:var(--r-md);border:1px solid var(--line);background:var(--surface)}
.gcell .sizes{display:flex;gap:14px;align-items:flex-end}
.gcell small{font-size:12.5px;color:var(--text-2);line-height:1.3}
.sw-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:10px}
.sw{border-radius:var(--r-md);border:1px solid var(--line);overflow:hidden;background:var(--surface)}
.sw i{display:block;height:46px;background:var(--sw)}
.sw div{padding:8px 10px 10px;font:400 11px/1.55 var(--f-mono);color:var(--text-2)}
.sw b{display:block;font:500 12.5px var(--f-sans);color:var(--text)}
.sw .cr{color:var(--text)}
.spec{display:grid;gap:14px}
.spec .row{display:flex;align-items:baseline;gap:18px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:12px}
.spec .row small{font:400 11px var(--f-mono);color:var(--text-2);min-width:110px}

/* ============ OVERLAYS: command bar, toasts (glass) ============ */
.glass{position:relative;background:var(--glass-bg);-webkit-backdrop-filter:blur(26px) saturate(1.7);backdrop-filter:blur(26px) saturate(1.7);border:1px solid var(--glass-line);color:var(--glass-ink);
  box-shadow:0 1px 0 oklch(1 0 0/.18) inset,0 0 0 .5px oklch(0 0 0/.25),0 30px 80px -20px oklch(0 0 0/.55)}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(120% 70% at 20% -10%,oklch(1 0 0/.16),transparent 60%)}
.glass .mut{color:var(--glass-ink2)}
.overlays{position:relative;z-index:200}
.cmdk{position:fixed;inset:0;display:none;align-items:flex-start;justify-content:center;padding-top:12vh;background:var(--scrim)}
.cmdk[data-open="1"]{display:flex;animation:fade .2s ease both}
html[data-w="panel"] .cmdk{padding-top:80px}
@keyframes fade{from{opacity:0}}
.cmd{width:min(620px,calc(100vw - 24px));border-radius:20px;overflow:hidden;animation:pop .5s var(--spring) both}
@keyframes pop{from{opacity:0;transform:translateY(-10px) scale(.96)}}
.cmd-i{display:flex;align-items:center;gap:12px;padding:0 18px;height:58px;border-bottom:1px solid var(--glass-line)}
.cmd-i input{flex:1;min-width:0;border:0;background:none;outline:none;font:400 17px var(--f-sans);color:var(--glass-ink)}
.cmd-i input::placeholder{color:var(--glass-ink2)}
.cmd-i kbd{color:var(--glass-ink2);border-color:var(--glass-line)}
.cmd-l{list-style:none;margin:0;padding:8px;max-height:min(52vh,420px);overflow:auto}
.cmd-g{padding:10px 12px 4px;font:500 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--glass-ink2)}
.cmd-o{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 12px;border-radius:12px;font-size:14.5px;cursor:pointer}
.cmd-o[aria-selected="true"]{background:oklch(1 0 0/.1);box-shadow:inset 0 0 0 1px var(--glass-line)}
:root:not([data-theme="dark"]) .cmd-o[aria-selected="true"]{background:oklch(.2 .03 250/.08)}
.cmd-o .hint{margin-left:auto;font:400 12px var(--f-mono);color:var(--glass-ink2)}
.cmd-f{display:flex;gap:16px;padding:10px 18px;border-top:1px solid var(--glass-line);font:400 11.5px var(--f-mono);color:var(--glass-ink2)}
.toasts{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);display:grid;gap:8px;justify-items:center;pointer-events:none;width:max-content;max-width:calc(100vw - 24px)}
html[data-chrome="off"] .toasts{bottom:78px}
.toast{pointer-events:auto;display:flex;align-items:center;gap:12px;padding:10px 14px 10px 12px;border-radius:16px;font-size:14px;animation:pop .6s var(--spring) both}
.toast.out{animation:fade .3s reverse both}
.toast .btn{height:28px;font-size:12.5px;border-color:var(--glass-line);color:var(--glass-ink)}

/* ============ demo toolbar (obviously not part of the design) ============ */
.toolbar{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);z-index:300;display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center;padding:6px 8px;border-radius:12px;background:#111;color:#eee;border:1px dashed #777;font:500 12px var(--f-mono);max-width:calc(100vw - 16px);color-scheme:dark}
html[data-chrome="off"] .toolbar{display:none}
.toolbar .tag{color:#f2c94c;padding:0 6px}
.toolbar button{height:28px;padding:0 9px;border-radius:7px;border:1px solid #444;background:#1c1c1c;color:#eee;font:500 12px var(--f-mono)}
.toolbar button[aria-pressed="true"],.toolbar button[aria-current="step"]{background:#eee;color:#111;border-color:#eee}
.toolbar .sep{width:1px;height:20px;background:#444}
.toolbar :focus-visible{outline-color:#f2c94c}

/* ============ compact (side panel / narrow) ============ */
@container app (max-width:640px){
  .top{height:52px;padding:0 14px;grid-template-columns:1fr auto}
  .nav{display:none}
  .lockup{height:24px}
  .kbtn{padding:0 6px;width:34px;justify-content:center}.kbtn .kl,.kbtn kbd{display:none}
  .avatar{display:none}
  .scroll{padding-bottom:0}
  .view{padding:22px 16px 28px}
  .view[data-v="intake"]{padding-top:22px}
  .dock{display:grid;grid-template-columns:repeat(3,1fr);position:sticky;bottom:0;z-index:15;background:color-mix(in oklab,var(--bg) 96%,transparent);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
  .dock button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:46px;border:0;background:none;border-radius:12px;color:var(--text-2);font-size:11.5px;font-weight:500}
  .dock button[aria-current="page"]{color:var(--accent);background:color-mix(in oklab,var(--accent) 10%,transparent)}
  html[data-w="web"] .frame{min-height:calc(100dvh - 84px)}
  .hero-i h1{font-size:27px;margin:14px 0 10px}
  .hero-i p{font-size:14.5px;margin-bottom:20px}
  .beam{width:320px;top:-80px}
  .field textarea{min-height:150px;font-size:14.5px}
  .field-f{padding:10px}
  .field-f .drop{flex:1 1 100%}
  .field-f .actions{flex:1 1 100%}
  .field-f .actions .btn.primary{flex:1}
  .srcrow{margin-top:18px;gap:6px 14px;font-size:11.5px}
  .rh{grid-template-columns:1fr auto}.rh h2,.sh h2,.plain h2,.brand h2{font-size:22px}.rh .cnt{font-size:26px}
  .fr{grid-template-columns:26px minmax(0,1fr);gap:0 8px}
  .fcard{padding:12px}
  .fhead{grid-template-columns:auto minmax(0,1fr)}
  .fstat{grid-column:2;justify-content:flex-start;min-height:28px}
  .ev{font-size:13px}
  .bento{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:none;gap:10px}
  .bento>*{grid-column:auto!important;grid-row:auto!important}
  .t-hero,.t-red,.t-unk,.t-src,.t-note{grid-column:1/-1!important}
  .tile{padding:14px 15px}
  .th .full{display:none}.th .short{display:inline}
  .t-ok .tn,.tn{font-size:52px}
  .t-ok{min-height:176px}.t-diff{min-height:176px}
  .t-unk{min-height:0}
  .t-unk{flex-direction:row!important;align-items:center;gap:12px}
  .t-unk .tn{font-size:40px;margin:0 0 0 auto}.t-unk .td,.t-unk .tnames,.t-unk .tbar{display:none}
  .t-red .reds{grid-template-columns:1fr;gap:6px}
  .rb{flex-direction:row;align-items:center;gap:10px;min-height:44px;padding:8px 12px}
  .rb .n{font-size:26px;margin-left:auto}
  .dial{width:min(100%,240px)}
  .dial-c b{font-size:84px}
  .t-hero{padding:16px}
  .srcs div{grid-template-columns:104px 1fr 28px;gap:8px;font-size:12px}
  .rw{grid-template-columns:22px 18px minmax(0,1fr) 14px;gap:8px;padding:10px 12px}
  .rw .chip{display:none}
  .rw .cit{white-space:normal;overflow:visible}
  .dh{grid-template-columns:auto 1fr;margin:16px 0 20px;gap:4px 14px}
  .dh .big{width:52px;height:52px;border-radius:16px}
  .dh h2{font-size:21px}.dh p{grid-column:1/-1;font-size:14px}
  .dh .big{grid-row:1}
  .dcols{grid-template-columns:1fr}
  .cmp{grid-template-columns:1fr}
  .cmp .hd{display:none}
  .cmp>*{border-top:0;padding:0}
  .cmp .f{display:grid;gap:8px;padding:14px 16px!important;border-top:1px solid var(--line)!important}
  .cmp .f.rowdev{box-shadow:inset 3px 0 0 var(--v-diff)}
  .cmp .f>div{padding:0!important;border:0!important;box-shadow:none!important}
  .cmp .f .lb{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .cmp .f .sub{font:500 10.5px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--text-3);display:block;margin-bottom:1px}
  .fix{padding:0 16px 16px}
  .card>h3{padding:14px 16px 10px}
  .srcl{padding:0 6px 8px}
  .mk-tile{padding:16px;gap:16px}
}
@container app (min-width:641px){
  .cmp .f{display:contents}
  .cmp .f .sub{display:none}
  .cmp .f>div{padding:12px 14px;border-top:1px solid var(--line);min-width:0;overflow-wrap:anywhere}
  .cmp .f.rowdev>div:first-child{box-shadow:inset 3px 0 0 var(--v-diff)}
}
@container app (min-width:641px) and (max-width:900px){
  .bento{grid-template-rows:repeat(3,150px) auto auto}
  .t-hero{grid-column:1/7}.t-ok{grid-column:7/13}.t-diff{grid-column:7/13;grid-row:3/4}
  .t-unk{grid-column:1/7;grid-row:4/5}.t-red{grid-column:7/13;grid-row:4/5;min-height:150px}
  .t-src{grid-column:1/13;grid-row:5/6}.t-note{grid-column:1/13;grid-row:6/7}
  .t-hero{grid-row:1/4}.t-ok{grid-row:1/3}
  .dcols{grid-template-columns:1fr}
}

/* view transitions */
::view-transition-old(root){animation:vtout .16s ease both}
::view-transition-new(root){animation:vtin .6s var(--spring) both}
::view-transition-group(vt-glyph){animation-duration:.6s;animation-timing-function:var(--spring)}
@keyframes vtout{to{opacity:0}}
@keyframes vtin{from{opacity:0;transform:translateY(10px)}}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
  .ev{opacity:1;transform:none}
  .ring{border-top-color:var(--accent)}
}
</style>

<body>

<!-- sprite -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">

function startRun(freeze){

function toast(msg, actionLabel, fn){
  const el=document.createElement('div'); el.className='toast glass';
  el.innerHTML=`<span class="dot"></span><span>${esc(msg)}</span>${actionLabel?`<button class="btn" type="button">${esc(actionLabel)}</button>`:''}`;
  if(actionLabel) $('button',el).addEventListener('click',()=>{fn();el.remove();});
  $('#toasts').appendChild(el); live(msg);
  setTimeout(()=>{el.classList.add('out');setTimeout(()=>el.remove(),300)}, 5200);
}

   {g:T.cmdGroup1,l:T.cmdNew,ic:'scan',k:'N',f:()=>go('intake')},
   {g:T.cmdGroup1,l:T.cmdRun,ic:'arr',k:'R',f:()=>go('running')},
   {g:T.cmdGroup1,l:T.cmdSum,ic:'hist',k:'S',f:()=>go('summary')},
   {g:T.cmdGroup1,l:T.cmdDet,ic:'file',k:'3',f:()=>go('detail',{id:3})},
   {g:T.cmdGroup1,l:T.cmdFlag,ic:'search',k:'F',f:()=>{S.filter='flagged';go('summary')}},
   ...REFS.map(r=>({g:T.refs,l:`${r.short} – ${T.v[r.v]}`,gl:r.v,f:()=>go('detail',{id:r.id})})),
   {g:T.cmdGroup2,l:T.cmdTheme,ic:'cmd',k:'D',f:toggleTheme},
   {g:T.cmdGroup2,l:T.cmdPanel,ic:'cmd',k:'P',f:toggleW},
   {g:T.cmdGroup2,l:T.cmdBrand,ic:'cmd',k:'B',f:()=>go('brand')}
  ];
}
function cmdRender(){
  const q=$('#cmdq').value.trim().toLowerCase(); cmdItems=allCmds().filter(c=>c.l.toLowerCase().includes(q)); if(q===''&&false) cmdItems=cmdItems.slice(0,8);
  if(cmdIdx>=cmdItems.length) cmdIdx=0;
  let last='',out='';
  cmdItems.forEach((c,i)=>{ if(c.g!==last){ out+=`<li class="cmd-g" role="presentation">${esc(c.g)}</li>`; last=c.g; }
    out+=`<li class="cmd-o v-${c.gl||''}" role="option" id="co${i}" aria-selected="${i===cmdIdx}" data-i="${i}">${c.gl?gl(c.gl,16):ic(c.ic,18)}<span>${esc(c.l)}</span>${c.k?`<span class="hint"><kbd>${c.k}</kbd></span>`:''}</li>`; });
  $('#cmdl').innerHTML = out || `<li class="cmd-g">${esc(t().cmdEmpty)}</li>`;
  $('#cmdq').setAttribute('aria-activedescendant', cmdItems.length?`co${cmdIdx}`:'');
  $(`#co${cmdIdx}`)?.scrollIntoView({block:'nearest'});
}
function openCmd(){
  if(S.cmdOpen) return; S.cmdOpen=true; lastFocus=document.activeElement;
  const c=$('#cmdk'); c.dataset.open='1'; cmdIdx=0;
  c.innerHTML=`<div class="cmd glass" role="dialog" aria-modal="true" aria-label="${esc(t().cmdBtn)}"><div class="cmd-i">${ic('search',20)}<input id="cmdq" role="combobox" aria-expanded="true" aria-controls="cmdl" aria-autocomplete="list" placeholder="${esc(t().cmdPh)}" autocomplete="off" spellcheck="false"><kbd>esc</kbd></div><ul class="cmd-l" id="cmdl" role="listbox"></ul><div class="cmd-f"><span>↑↓ ${S.lang==='de'?'wählen':'select'}</span><span>↵ ${S.lang==='de'?'öffnen':'open'}</span><span>esc ${S.lang==='de'?'schließen':'close'}</span></div></div>`;
  cmdRender(); $('#cmdq').focus(); syncToolbar();
}
function closeCmd(){ if(!S.cmdOpen) return; S.cmdOpen=false; const c=$('#cmdk'); c.dataset.open='0'; c.innerHTML=''; (lastFocus&&lastFocus.focus)&&lastFocus.focus(); syncToolbar(); }
function runCmd(i){ const c=cmdItems[i]; if(!c) return; closeCmd(); c.f(); }

/* ===================== TOOLBAR (prototype chrome) ===================== */
const STEPS=[['intake','1 Einfügen'],['running','2 Prüfung'],['summary','3 Übersicht'],['detail','4 Detail']];
function renderToolbar(){
  $('#toolbar').innerHTML = `<span class="tag">PROTOTYP</span>${STEPS.map(([k,l])=>`<button data-tb="step" data-k="${k}">${l}</button>`).join('')}<button data-tb="auto">▶ Auto</button><span class="sep"></span>
   <button data-tb="theme">Dark / Light</button><button data-tb="w" data-w="web">Web</button><button data-tb="w" data-w="panel">Panel 360</button><button data-tb="gray">Graustufen</button><button data-tb="lang">DE / EN</button><button data-tb="brand">Marke</button><button data-tb="cmdk">⌘K</button>`;
}
function syncToolbar(){
  $$('[data-tb="step"]').forEach(b=>{ if(b.dataset.k===S.view) b.setAttribute('aria-current','step'); else b.removeAttribute('aria-current'); });
  $$('[data-tb="w"]').forEach(b=>b.setAttribute('aria-pressed',String(html.dataset.w===b.dataset.w)));
  $('[data-tb="gray"]')?.setAttribute('aria-pressed',String(html.dataset.gray==='1'));
  $('[data-tb="auto"]')?.setAttribute('aria-pressed',String(!!S.auto));
  $('[data-tb="brand"]')?.setAttribute('aria-pressed',String(S.view==='brand'));
}
function toggleTheme(){ const n=html.dataset.theme==='dark'?'light':'dark'; html.dataset.theme=n; if(S.view==='brand') render(); }
function toggleW(){ html.dataset.w=html.dataset.w==='panel'?'web':'panel'; syncToolbar(); }
function setLang(l){ S.lang=l; html.lang=l; render(); }
function stopAuto(){ if(S.auto){S.auto.forEach(clearTimeout);S.auto=null;syncToolbar();} }
function autoplay(){
  stopAuto(); S.auto=[]; syncToolbar(); const at=(fn,ms)=>S.auto.push(setTimeout(fn,ms));
  go('intake'); at(()=>{S.text=SAMPLE;const p=$('#paste');if(p){p.value=SAMPLE;detect();}},1400);
  at(()=>go('running'),2800); at(()=>go('summary'),2800+8200); at(()=>{S.filter='flagged';applyFilter();},2800+8200+2800); at(()=>{S.filter=null;go('detail',{id:3})},2800+8200+5600); at(()=>{S.auto=null;syncToolbar();},2800+8200+9600);
}

/* ===================== EVENTS ===================== */
document.addEventListener('click',e=>{
  const tb=e.target.closest('[data-tb]');
  if(tb){ const a=tb.dataset.tb;
    if(a==='auto'){ S.auto?stopAuto():autoplay(); return; } stopAuto();
    if(a==='step'){ const k=tb.dataset.k; if(k==='running'){S.freeze=undefined;} go(k,{id:3,freeze:undefined}); }
    if(a==='theme') toggleTheme(); if(a==='w'){ html.dataset.w=tb.dataset.w; syncToolbar(); }
    if(a==='gray'){ html.dataset.gray=html.dataset.gray==='1'?'':'1'; if(!html.dataset.gray) delete html.dataset.gray; syncToolbar(); }
    if(a==='lang') setLang(S.lang==='de'?'en':'de'); if(a==='brand') go('brand'); if(a==='cmdk') openCmd();
    return; }
  const el=e.target.closest('[data-act]'); if(!el) { const o=e.target.closest('.cmd-o'); if(o) runCmd(+o.dataset.i); else if(e.target.id==='cmdk') closeCmd(); return; }
  const a=el.dataset.act;
  if(a==='go'){ stopAuto(); go(el.dataset.to); }
  else if(a==='nav'){ stopAuto(); const k=el.dataset.k; go(k==='check'?'intake':k); }
  else if(a==='cmdk') openCmd();
  else if(a==='sample'){ S.text=SAMPLE; const p=$('#paste'); p.value=SAMPLE; detect(); p.focus(); }
  else if(a==='file'){ loadFile(); }
  else if(a==='run'){ if(!S.text){ S.text=SAMPLE; } stopAuto(); go('running',{freeze:undefined}); }
  else if(a==='filter'){ S.filter=S.filter===el.dataset.v?null:el.dataset.v; applyFilter(); if(S.filter) $('#rows').scrollIntoView({behavior:RM?'auto':'smooth',block:'nearest'}); }
  else if(a==='flagged'){ S.filter=S.filter==='flagged'?null:'flagged'; applyFilter(); }
  else if(a==='clearf'){ S.filter=null; applyFilter(); }
  else if(a==='open'){ stopAuto(); const g=$('svg',el); go('detail',{id:+el.dataset.id,vtEl:g}); }
  else if(a==='fmt'){ S.fixFmt=el.dataset.f; const r=REFS.find(x=>x.id===S.ref); $('#fixcode').innerHTML=S.fixFmt==='apa'?r.fixApa:esc(r.fixBib); $$('[data-act="fmt"]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.f===S.fixFmt))); }
  else if(a==='copy'){ const r=REFS.find(x=>x.id===S.ref); const txt=S.fixFmt==='apa'?r.fixApaPlain:r.fixBib; (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).catch(()=>{}); $('#copylbl').textContent=t().copied+' ✓'; toast(t().copied+': '+(S.fixFmt==='apa'?'APA':'BibTeX')); setTimeout(()=>{const l=$('#copylbl'); if(l) l.textContent=t().copy;},2200); }
});
document.addEventListener('pointermove',e=>{ const tile=e.target.closest?.('.tile'); if(!tile) return; const r=tile.getBoundingClientRect(); tile.style.setProperty('--mx',(e.clientX-r.left)+'px'); tile.style.setProperty('--my',(e.clientY-r.top)+'px'); });
document.addEventListener('input',e=>{ if(e.target.id==='cmdq'){ cmdIdx=0; cmdRender(); } });
document.addEventListener('keydown',e=>{
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){ e.preventDefault(); S.cmdOpen?closeCmd():openCmd(); return; }
  if((e.metaKey||e.ctrlKey)&&e.key==='Enter'&&S.view==='intake'){ e.preventDefault(); $('[data-act="run"]').click(); return; }
  if(S.cmdOpen){
    if(e.key==='Escape'){ e.preventDefault(); closeCmd(); }
    else if(e.key==='ArrowDown'){ e.preventDefault(); cmdIdx=(cmdIdx+1)%Math.max(1,cmdItems.length); cmdRender(); }
    else if(e.key==='ArrowUp'){ e.preventDefault(); cmdIdx=(cmdIdx-1+cmdItems.length)%Math.max(1,cmdItems.length); cmdRender(); }
    else if(e.key==='Enter'){ e.preventDefault(); runCmd(cmdIdx); }
    else if(e.key==='Tab'){ e.preventDefault(); }
  }
});

/* ===================== BOOT ===================== */
renderToolbar();
const st=Q.get('state'); if(st&&['intake','running','summary','detail','brand','history','account'].includes(st)) S.view=st;
if(Q.get('ref')) S.ref=+Q.get('ref');
if(Q.get('filter')) S.filter=Q.get('filter');
if(Q.get('freeze')!=null) S.freeze=+Q.get('freeze');
if(Q.get('fmt')) S.fixFmt=Q.get('fmt');
if(Q.get('text')==='1') S.text=SAMPLE;
render();
if(Q.get('cmdk')==='1') openCmd();
if(Q.get('auto')==='1') autoplay();
</script>
</body>
