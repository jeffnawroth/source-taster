<!doctype html>
<html lang="de" data-theme="dark" data-width="web">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>Source Taster · Luminous</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script>(function(){var p=new URLSearchParams(location.search),r=document.documentElement;if(p.get('theme')==='light')r.dataset.theme='light';if(p.get('width')==='panel')r.dataset.width='panel';})();</script>
<style>
@property --a { syntax: '<angle>'; inherits: false; initial-value: 0deg; }

/* ───────────── Tokens (single source of truth; the brand sheet reads these) ───────────── */
:root, .t-dark {
  color-scheme: dark;
  --bg: oklch(0.135 0.012 265);
  --surface: oklch(0.18 0.014 265);
  --surface-2: oklch(0.215 0.016 265);
  --surface-3: oklch(0.26 0.018 265);
  --line: oklch(1 0 0 / 0.09);
  --line-2: oklch(1 0 0 / 0.16);
  --text: oklch(0.96 0.006 265);
  --muted: oklch(0.74 0.016 265);
  --faint: oklch(0.64 0.016 265);
  --accent: oklch(0.8 0.13 232);
  --accent-fill: oklch(0.74 0.14 236);
  --accent-ink: oklch(0.16 0.03 250);
  --accent-glow: oklch(0.62 0.19 245 / 0.55);
  --ink: oklch(0.17 0.02 265);            /* inner glyph mark on verdict fill */
  --vf-ok: oklch(0.82 0.17 155);
  --vf-diff: oklch(0.85 0.15 85);
  --vf-mixed: oklch(0.75 0.17 355);
  --vf-doi: oklch(0.72 0.18 25);
  --vf-miss: oklch(0.75 0.16 48);
  --vf-unk: oklch(0.74 0.012 265);
  --vt: var(--text);                        /* verdict label text: neutral in dark */
  --tile-bg: linear-gradient(180deg, oklch(0.215 0.016 265), oklch(0.17 0.013 265));
  --tile-shadow: inset 0 1px 0 oklch(1 0 0 / 0.07), 0 0 0 1px oklch(0 0 0 / 0.5), 0 30px 60px -34px black;
  --glow-a: oklch(0.5 0.19 252 / 0.5);
  --glow-b: oklch(0.55 0.15 215 / 0.26);
  --glow-c: oklch(0.5 0.2 290 / 0.2);
  --gridline: oklch(1 0 0 / 0.055);
  --glass-bg: linear-gradient(180deg, oklch(0.3 0.02 265 / 0.78), oklch(0.2 0.018 265 / 0.86));
  --glass-line: oklch(1 0 0 / 0.16);
  --glass-hi: inset 0 1px 0 oklch(1 0 0 / 0.2), inset 0 0 24px oklch(1 0 0 / 0.04);
  --glass-shadow: 0 40px 90px -20px black, 0 0 0 1px oklch(0 0 0 / 0.6);
  --g-tile: url(#mk-tile-d); --g-ring: url(#mk-ring-d); --g-edge: url(#mk-edge-d); --g-halo: url(#mk-halo-d);
  --mk-t1: oklch(0.3 0.04 262); --mk-t2: oklch(0.15 0.02 265);
  --mk-r1: oklch(0.97 0.02 220); --mk-r2: oklch(0.72 0.15 245);
  --mk-edge1: oklch(0.8 0.12 232 / 0.9); --mk-edge2: oklch(0.8 0.12 232 / 0.05);
  --mk-dot: oklch(0.97 0.03 210); --mk-halo: oklch(0.8 0.14 225);
  --num-grad: linear-gradient(180deg, oklch(1 0 0) 15%, oklch(0.76 0.12 240));
  --shadow-btn: 0 0 0 1px oklch(0.85 0.1 236 / 0.5), 0 8px 28px -6px oklch(0.62 0.19 245 / 0.6), inset 0 1px 0 oklch(1 0 0 / 0.35);
  --focus: oklch(0.82 0.13 232);
}
[data-theme='light'], .t-light {
  color-scheme: light;
  --bg: oklch(0.972 0.006 245);
  --surface: oklch(1 0 0);
  --surface-2: oklch(0.955 0.008 245);
  --surface-3: oklch(0.92 0.01 245);
  --line: oklch(0.25 0.04 260 / 0.1);
  --line-2: oklch(0.25 0.04 260 / 0.18);
  --text: oklch(0.2 0.03 262);
  --muted: oklch(0.44 0.022 262);
  --faint: oklch(0.5 0.02 262);
  --accent: oklch(0.5 0.17 252);
  --accent-fill: oklch(0.5 0.17 252);
  --accent-ink: oklch(1 0 0);
  --accent-glow: oklch(0.7 0.14 240 / 0.45);
  --ink: oklch(1 0 0);
  --vf-ok: oklch(0.52 0.13 155);
  --vf-diff: oklch(0.56 0.12 72);
  --vf-mixed: oklch(0.52 0.18 355);
  --vf-doi: oklch(0.52 0.19 25);
  --vf-miss: oklch(0.54 0.15 48);
  --vf-unk: oklch(0.5 0.02 262);
  --vt: oklch(0.3 0.04 262);
  --tile-bg: linear-gradient(180deg, oklch(1 0 0), oklch(0.985 0.004 245));
  --tile-shadow: inset 0 1px 0 oklch(1 0 0), 0 1px 2px oklch(0.3 0.05 260 / 0.07), 0 18px 40px -22px oklch(0.45 0.12 250 / 0.35);
  --glow-a: oklch(0.86 0.09 235 / 0.75);
  --glow-b: oklch(0.9 0.07 205 / 0.55);
  --glow-c: oklch(0.9 0.07 290 / 0.5);
  --gridline: oklch(0.3 0.04 260 / 0.06);
  --glass-bg: linear-gradient(180deg, oklch(1 0 0 / 0.82), oklch(0.97 0.01 245 / 0.88));
  --glass-line: oklch(1 0 0 / 0.9);
  --glass-hi: inset 0 1px 0 oklch(1 0 0), inset 0 0 0 1px oklch(0.3 0.05 260 / 0.1);
  --glass-shadow: 0 40px 90px -24px oklch(0.35 0.1 255 / 0.45), 0 2px 6px oklch(0.3 0.05 260 / 0.1);
  --g-tile: url(#mk-tile-l); --g-ring: url(#mk-ring-l); --g-edge: url(#mk-edge-l); --g-halo: url(#mk-halo-l);
  --mk-t1: oklch(1 0 0); --mk-t2: oklch(0.955 0.012 245);
  --mk-r1: oklch(0.34 0.1 258); --mk-r2: oklch(0.52 0.18 252);
  --mk-edge1: oklch(0.55 0.16 250 / 0.55); --mk-edge2: oklch(0.55 0.16 250 / 0.1);
  --mk-dot: oklch(0.58 0.2 245); --mk-halo: oklch(0.7 0.15 235);
  --num-grad: linear-gradient(180deg, oklch(0.2 0.03 262) 20%, oklch(0.46 0.18 254));
  --shadow-btn: 0 0 0 1px oklch(0.4 0.16 252), 0 10px 24px -8px oklch(0.5 0.17 252 / 0.55), inset 0 1px 0 oklch(1 0 0 / 0.25);
  --focus: oklch(0.5 0.17 252);
}

:root {
  --spring: linear(0, 0.009, 0.035 2.1%, 0.141, 0.281 6.7%, 0.723 12.9%, 0.938 16.7%, 1.017, 1.077, 1.121, 1.149 24.3%, 1.159, 1.163 27%, 1.154, 1.129 32.8%, 1.051 39.6%, 1.017 43.1%, 0.991, 0.977 51%, 0.975 57.1%, 0.997 69.8%, 1.003 76.9%, 1);
  --spring-soft: linear(0, 0.012 1.6%, 0.05 3.4%, 0.2 8%, 0.45 13%, 0.72 18.5%, 0.9 24%, 0.985 30%, 1.012 36%, 1.014 44%, 1.004 56%, 1);
  --out: cubic-bezier(0.2, 0.8, 0.2, 1);
  --sans: 'IBM Plex Sans', system-ui, sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, monospace;
  --app-w: 1280px;
}

/* ───────────── Base ───────────── */
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 400 14.5px/1.5 var(--sans); -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; overflow: hidden; }
h1, h2, h3, h4, p, ul, ol { margin: 0; padding: 0; }
ul, ol { list-style: none; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: inherit; }
button:disabled { cursor: default; }
.mono { font-family: var(--mono); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 6px; }
::selection { background: color-mix(in oklab, var(--accent) 35%, transparent); }
kbd { font: 500 11px/1 var(--mono); padding: 3px 6px; border-radius: 6px; border: 1px solid var(--line-2); background: color-mix(in oklab, var(--text) 6%, transparent); color: var(--muted); display: inline-block; }
svg { display: block; }
.eyebrow { font: 500 11.5px/1.2 var(--mono); letter-spacing: 0.09em; text-transform: uppercase; color: var(--faint); }

/* ───────────── World + app frame ───────────── */
#world { height: 100%; display: grid; place-items: center; background: var(--bg); }
[data-width='panel'] #world { background: radial-gradient(circle at 1px 1px, var(--gridline) 1px, transparent 0) 0 0 / 20px 20px, var(--bg); }
.app { position: relative; width: min(var(--app-w), 100vw); height: 100dvh; overflow: hidden; background: var(--bg); container-type: inline-size; container-name: app; display: flex; flex-direction: column; isolation: isolate; }
[data-width='panel'] { --app-w: 360px; }
@media (min-width: 440px) { [data-width='panel'] .app { height: min(calc(100dvh - 40px), 800px); border-radius: 20px; box-shadow: 0 0 0 1px var(--line-2), 0 50px 100px -30px black; } }
.app.grey { filter: grayscale(1); }

.bgfx { position: absolute; inset: 0; z-index: -1; pointer-events: none; }
.bgfx::before { content: ''; position: absolute; inset: 0; background: radial-gradient(55% 42% at 50% -6%, var(--glow-a), transparent 72%), radial-gradient(38% 38% at 100% 100%, var(--glow-b), transparent 70%), radial-gradient(34% 34% at 0% 96%, var(--glow-c), transparent 70%); }
.bgfx::after { content: ''; position: absolute; inset: 0; background-image: linear-gradient(var(--gridline) 1px, transparent 1px), linear-gradient(90deg, var(--gridline) 1px, transparent 1px); background-size: 56px 56px; background-position: center top; -webkit-mask-image: radial-gradient(70% 60% at 50% 0, #000, transparent 76%); mask-image: radial-gradient(70% 60% at 50% 0, #000, transparent 76%); }

/* ───────────── Top bar / tab bar ───────────── */
.top { flex: none; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; height: 60px; padding: 0 22px; border-bottom: 1px solid var(--line); background: color-mix(in oklab, var(--bg) 70%, transparent); position: relative; z-index: 5; }
.brand { display: inline-flex; align-items: center; justify-self: start; border-radius: 10px; min-height: 36px; }
.brand svg { height: 28px; width: auto; }
.nav { display: flex; gap: 2px; padding: 3px; border-radius: 12px; border: 1px solid var(--line); background: color-mix(in oklab, var(--text) 4%, transparent); }
.nav button { min-height: 30px; padding: 0 14px; border-radius: 9px; color: var(--muted); font-weight: 500; font-size: 13.5px; transition: color 0.2s, background 0.3s; }
.nav button:hover { color: var(--text); }
.nav button[aria-current='page'] { color: var(--text); background: var(--surface-3); box-shadow: inset 0 1px 0 oklch(1 0 0 / 0.08), 0 0 0 1px var(--line); }
[data-theme='light'] .nav button[aria-current='page'] { background: var(--surface); box-shadow: 0 1px 2px oklch(0.3 0.05 260 / 0.14), 0 0 0 1px var(--line); }
.tools { justify-self: end; display: flex; align-items: center; gap: 10px; }
.cmdbtn { display: inline-flex; align-items: center; gap: 10px; min-height: 32px; padding: 0 8px 0 12px; border-radius: 10px; border: 1px solid var(--line-2); background: color-mix(in oklab, var(--text) 4%, transparent); color: var(--muted); font-size: 13px; min-width: 210px; transition: border-color 0.2s, background 0.2s; }
.cmdbtn:hover { border-color: color-mix(in oklab, var(--accent) 50%, transparent); background: color-mix(in oklab, var(--text) 7%, transparent); }
.cmdbtn .k { margin-left: auto; display: flex; gap: 3px; }
.avatar { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font: 600 11.5px var(--sans); color: var(--accent-ink); background: linear-gradient(145deg, var(--accent), color-mix(in oklab, var(--accent) 50%, oklch(0.6 0.2 290))); box-shadow: 0 0 0 1px var(--line-2); }
.iconbtn { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 10px; border: 1px solid var(--line-2); color: var(--muted); }
.iconbtn:hover { color: var(--text); }
.iconbtn svg { width: 17px; height: 17px; }
.tabbar { display: none; }
.cmdbtn .lbl-short { display: none; }

#view { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; scrollbar-width: thin; scrollbar-color: var(--line-2) transparent; position: relative; }
.canvas { width: min(100%, 1120px); margin: 0 auto; padding: 36px 32px 96px; }

/* ───────────── Buttons ───────────── */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 36px; padding: 0 16px; border-radius: 11px; font-weight: 500; font-size: 14px; border: 1px solid var(--line-2); background: color-mix(in oklab, var(--text) 5%, transparent); transition: transform 0.4s var(--spring), border-color 0.2s, background 0.2s, box-shadow 0.3s; white-space: nowrap; }
.btn:hover { border-color: color-mix(in oklab, var(--accent) 50%, var(--line-2)); background: color-mix(in oklab, var(--text) 8%, transparent); }
.btn:active { transform: scale(0.97); }
.btn.primary { color: var(--accent-ink); background: linear-gradient(180deg, color-mix(in oklab, var(--accent-fill) 82%, white), var(--accent-fill)); border-color: transparent; box-shadow: var(--shadow-btn); font-weight: 600; }
[data-theme='light'] .btn.primary { background: linear-gradient(180deg, oklch(0.56 0.17 252), oklch(0.46 0.17 254)); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.primary kbd { background: color-mix(in oklab, var(--accent-ink) 14%, transparent); border-color: color-mix(in oklab, var(--accent-ink) 25%, transparent); color: var(--accent-ink); }
.btn svg { width: 16px; height: 16px; }
.btn.sm { min-height: 28px; padding: 0 11px; font-size: 13px; border-radius: 9px; }

/* ───────────── Verdict glyph + chip ───────────── */
.gl { width: 20px; height: 20px; flex: none; color: var(--c); --gi: var(--ink); }
[data-theme='dark'] .gl, :root:not([data-theme='light']) .gl { filter: drop-shadow(0 0 7px color-mix(in oklab, var(--c) 55%, transparent)); }
.gl.lg { width: 28px; height: 28px; }
.gl.xl { width: 44px; height: 44px; }
.v-ok { --c: var(--vf-ok); } .v-diff { --c: var(--vf-diff); } .v-mixed { --c: var(--vf-mixed); }
.v-doi { --c: var(--vf-doi); } .v-miss { --c: var(--vf-miss); } .v-unk { --c: var(--vf-unk); }
.chip { display: inline-flex; align-items: center; gap: 7px; min-height: 28px; padding: 0 12px 0 6px; border-radius: 99px; font-weight: 500; font-size: 13px; line-height: 1.2; color: var(--vt); background: color-mix(in oklab, var(--c) 12%, var(--surface)); box-shadow: inset 0 0 0 1px color-mix(in oklab, var(--c) 34%, transparent); white-space: nowrap; }
.chip .gl { width: 18px; height: 18px; }
.chip.lg { min-height: 36px; padding: 0 16px 0 8px; font-size: 15px; gap: 9px; }
.chip.lg .gl { width: 24px; height: 24px; }
.spin { width: 15px; height: 15px; border-radius: 50%; border: 2px solid currentColor; border-right-color: transparent; border-bottom-color: color-mix(in oklab, currentColor 25%, transparent); animation: rot 0.8s linear infinite; flex: none; }
@keyframes rot { to { transform: rotate(360deg); } }

/* ───────────── Intake ───────────── */
.intake { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 28px 32px 90px; max-width: 880px; margin: 0 auto; }
.intake h1 { font-weight: 500; font-size: clamp(30px, 4.4vw, 46px); line-height: 1.08; letter-spacing: -0.03em; margin: 14px 0 12px; text-wrap: balance; }
.intake h1 em { font-style: normal; background: linear-gradient(180deg, var(--text), color-mix(in oklab, var(--accent) 80%, var(--text))); -webkit-background-clip: text; background-clip: text; color: transparent; }
.lede { color: var(--muted); font-size: 16px; max-width: 54ch; text-wrap: pretty; }
.paste { position: relative; width: 100%; margin-top: 32px; border-radius: 22px; text-align: left; background: var(--tile-bg); box-shadow: var(--tile-shadow); border: 1px solid var(--line-2); transition: box-shadow 0.5s var(--out), border-color 0.3s; }
.paste::before { content: ''; position: absolute; left: 12%; right: 12%; top: -1px; height: 1px; background: linear-gradient(90deg, transparent, color-mix(in oklab, var(--accent) 90%, white), transparent); opacity: 0.9; }
.paste::after { content: ''; position: absolute; left: 20%; right: 20%; top: -28px; height: 56px; background: radial-gradient(closest-side, var(--accent-glow), transparent); filter: blur(10px); opacity: 0.55; pointer-events: none; transition: opacity 0.5s; }
.paste:focus-within { border-color: color-mix(in oklab, var(--accent) 60%, var(--line-2)); box-shadow: var(--tile-shadow), 0 0 0 4px color-mix(in oklab, var(--accent) 16%, transparent), 0 0 60px -10px var(--accent-glow); }
.paste:focus-within::after { opacity: 1; }
.paste textarea { display: block; width: 100%; min-height: 168px; resize: none; background: transparent; border: 0; outline: 0; color: var(--text); font: 400 14px/1.7 var(--mono); padding: 22px 24px 8px; }
.paste textarea::placeholder { color: var(--faint); font: 400 18px/1.6 var(--sans); }
.paste-bar { display: flex; align-items: center; gap: 12px; padding: 10px 12px 12px 18px; border-top: 1px solid var(--line); }
.paste-bar .srcs { font: 400 11.5px/1.4 var(--mono); color: var(--faint); flex: 1; min-width: 0; }
.drop { margin-top: 14px; width: 100%; display: flex; align-items: center; justify-content: center; gap: 14px; min-height: 64px; padding: 12px 20px; border-radius: 16px; border: 1.5px dashed var(--line-2); color: var(--muted); transition: border-color 0.3s, background 0.3s, transform 0.5s var(--spring); }
.drop.over, .drop:hover { border-color: var(--accent); background: color-mix(in oklab, var(--accent) 7%, transparent); }
.drop svg { width: 22px; height: 22px; color: var(--accent); flex: none; }
.drop b { font-weight: 500; color: var(--text); }
.drop .ext { font: 400 11.5px var(--mono); color: var(--faint); }
.drop button { min-height: 28px; padding: 0 6px; color: var(--accent); text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--line-2); }
.linkish { color: var(--accent); font-weight: 500; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; min-height: 28px; }
.linkish:hover { text-decoration: underline; text-underline-offset: 3px; }
.assure { margin-top: 22px; display: flex; flex-wrap: wrap; gap: 8px 18px; justify-content: center; color: var(--faint); font-size: 12.5px; }
.assure span { display: inline-flex; gap: 7px; align-items: center; }
.assure svg { width: 14px; height: 14px; }

/* ───────────── Running ───────────── */
.run { display: grid; grid-template-columns: minmax(0, 1fr) 270px; gap: 28px; align-items: start; }
.run-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
.run-head h2 { font-weight: 500; font-size: 34px; letter-spacing: -0.03em; line-height: 1.1; margin-top: 8px; }
.run-head h2 .n { font-variant-numeric: tabular-nums; background: var(--num-grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
.progress { height: 3px; border-radius: 3px; background: var(--line); margin-bottom: 18px; position: relative; }
.progress i { display: block; height: 100%; border-radius: 3px; width: calc(var(--p, 0) * 100%); background: linear-gradient(90deg, color-mix(in oklab, var(--accent) 60%, transparent), var(--accent)); box-shadow: 0 0 16px 1px var(--accent-glow); transition: width 0.5s var(--out); }
.feed { display: grid; gap: 10px; }
.row { position: relative; display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; column-gap: 14px; align-items: start; padding: 14px 16px; border-radius: 16px; border: 1px solid var(--line); background: var(--tile-bg); box-shadow: var(--tile-shadow); overflow: hidden; transition: border-color 0.5s, box-shadow 0.6s, opacity 0.5s; }
.row .ix { font: 500 12px/28px var(--mono); color: var(--faint); }
.row .main { min-width: 0; }
.row .res { min-height: 28px; display: flex; align-items: center; }
.cite { display: block; line-height: 1.4; }
.cite .au { font-weight: 600; }
.cite .ti { color: var(--text); }
.cite .doi { display: block; font: 400 11.5px/1.5 var(--mono); color: var(--faint); margin-top: 1px; overflow-wrap: anywhere; }
.row[data-ph='queued'] { opacity: 0.55; border-style: dashed; box-shadow: none; background: transparent; }
.row[data-ph='checking'] { border-color: color-mix(in oklab, var(--accent) 60%, transparent); box-shadow: var(--tile-shadow), 0 0 0 1px color-mix(in oklab, var(--accent) 16%, transparent), 0 0 38px -8px var(--accent-glow); }
.row[data-ph='checking']::after { content: ''; position: absolute; inset: 0; pointer-events: none; background: linear-gradient(100deg, transparent 32%, color-mix(in oklab, var(--accent) 13%, transparent) 50%, transparent 68%); background-size: 260% 100%; animation: sweep 1.3s linear infinite; }
@keyframes sweep { from { background-position: 150% 0; } to { background-position: -50% 0; } }
.row[data-ph='done'] { border-color: color-mix(in oklab, var(--c) 30%, var(--line)); animation: land 0.7s var(--spring); }
[data-theme='dark'] .row[data-ph='done'], :root:not([data-theme='light']) .row[data-ph='done'] { box-shadow: var(--tile-shadow), 0 0 34px -16px var(--c); }
@keyframes land { 0% { transform: scale(0.985); } 100% { transform: none; } }
.trail { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 18px; margin-top: 8px; font-size: 12.5px; color: var(--muted); min-height: 20px; }
.st { display: inline-flex; align-items: center; gap: 5px; animation: stin 0.45s var(--spring) both; }
.st.ns + .st::before, .st.ns::before { }
.st .src { font: 500 11px/1 var(--mono); letter-spacing: 0.02em; padding: 4px 7px; border-radius: 6px; background: color-mix(in oklab, var(--text) 8%, transparent); color: var(--text); margin-right: 3px; box-shadow: inset 0 0 0 1px var(--line); }
.st.has-src::before { content: '' !important; margin: 0 6px 0 4px !important; }
.st.has-src:first-child::before { display: none; }
@keyframes stin { from { opacity: 0; transform: translateX(-6px); } }
.mk { width: 14px; height: 14px; flex: none; color: var(--muted); }
.st[data-m='ok'] .mk { color: var(--vf-ok); } .st[data-m='diff'] .mk { color: var(--vf-diff); } .st[data-m='x'] .mk { color: var(--vf-doi); }
.queued-tag { font: 500 11.5px var(--mono); color: var(--faint); display: inline-flex; align-items: center; gap: 8px; }
.queued-tag::before { content: ''; width: 7px; height: 7px; border-radius: 50%; border: 1.5px solid var(--faint); }
.checking-tag { font: 500 12.5px var(--sans); color: var(--accent); display: inline-flex; align-items: center; gap: 8px; }
.aside { position: sticky; top: 0; display: grid; gap: 12px; }
.panelbox { border-radius: 18px; border: 1px solid var(--line); background: var(--tile-bg); box-shadow: var(--tile-shadow); padding: 16px; }
.panelbox h3 { font: 500 11.5px var(--mono); letter-spacing: 0.09em; text-transform: uppercase; color: var(--faint); margin-bottom: 8px; }
.srcrow { display: grid; grid-template-columns: 10px 1fr auto; gap: 10px; align-items: center; min-height: 34px; border-top: 1px solid var(--line); font-size: 13px; }
.srcrow:first-of-type { border-top: 0; }
.srcrow .dot { width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid var(--faint); }
.srcrow.act .dot { background: var(--accent); border-color: var(--accent); box-shadow: 0 0 12px 1px var(--accent-glow); }
.srcrow .cnt { font: 500 12px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.runfoot { margin-top: 18px; display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 44px; }
.runfoot .btn { animation: pop 0.7s var(--spring) both; }
@keyframes pop { from { opacity: 0; transform: translateY(10px) scale(0.94); } }

/* ───────────── Bento ───────────── */
.sum-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 18px; flex-wrap: wrap; }
.sum-head h2 { font-weight: 500; font-size: 22px; letter-spacing: -0.02em; margin-top: 6px; }
.sum-head .acts { display: flex; gap: 8px; }
.bento { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); grid-auto-rows: 118px; gap: 14px; }
.tile { position: relative; display: flex; flex-direction: column; justify-content: space-between; min-width: 0; text-align: left; padding: 18px 20px; border-radius: 24px; border: 1px solid var(--line); background: var(--tile-bg); box-shadow: var(--tile-shadow); overflow: hidden; isolation: isolate; animation: tin 0.9s var(--spring) both; animation-delay: calc(var(--i, 0) * 70ms); transition: border-color 0.3s, box-shadow 0.5s, transform 0.5s var(--spring); }
@keyframes tin { from { opacity: 0; transform: translateY(18px) scale(0.965); } }
.tile::before { content: ''; position: absolute; inset: 0; z-index: -1; background: radial-gradient(120% 90% at 100% 0%, color-mix(in oklab, var(--c, var(--accent)) 15%, transparent), transparent 62%); opacity: 0.9; transition: opacity 0.4s; }
[data-theme='light'] .tile::before { background: radial-gradient(120% 90% at 100% 0%, color-mix(in oklab, var(--c, var(--accent)) 12%, transparent), transparent 60%); }
button.tile:hover { border-color: color-mix(in oklab, var(--c) 55%, var(--line)); transform: translateY(-2px); }
button.tile:active { transform: scale(0.985); }
button.tile[aria-pressed='true'] { border-color: var(--c); box-shadow: var(--tile-shadow), 0 0 0 1px var(--c), 0 0 36px -10px var(--c); }
.tile .tp { display: flex; align-items: center; gap: 9px; }
.tile .lab { font-weight: 500; font-size: 13.5px; line-height: 1.25; color: var(--vt); }
.tile .big { font-weight: 500; font-size: 64px; line-height: 0.85; letter-spacing: -0.05em; font-variant-numeric: tabular-nums; }
.tile .hint { font-size: 12.5px; color: var(--muted); line-height: 1.3; }
.tile .foot { display: flex; align-items: flex-end; justify-content: space-between; gap: 8px; }
.tile .go { font: 500 11.5px var(--mono); color: var(--faint); display: inline-flex; gap: 5px; align-items: center; white-space: nowrap; }
button.tile:hover .go { color: var(--text); }
.t-hero { grid-column: 1 / 7; grid-row: 1 / 4; --c: var(--accent); padding: 24px 26px; background: var(--tile-bg); }
.t-hero::after { content: ''; position: absolute; inset: 0; border-radius: inherit; padding: 1px; z-index: 1; pointer-events: none; background: conic-gradient(from var(--a), transparent 0 55%, color-mix(in oklab, var(--accent) 90%, white) 72%, transparent 84%); -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; animation: beam 8s linear infinite; }
@keyframes beam { to { --a: 360deg; } }
.t-hero::before { background: radial-gradient(60% 55% at 78% 20%, var(--accent-glow), transparent 72%); opacity: 0.55; }
[data-theme='light'] .t-hero::before { opacity: 0.9; }
.t-hero .headline { display: flex; align-items: flex-end; gap: 14px; margin-top: 8px; position: relative; z-index: 2; }
.t-hero .num { font-weight: 500; font-size: clamp(132px, 15cqi, 196px); line-height: 0.78; letter-spacing: -0.07em; font-variant-numeric: tabular-nums; background: var(--num-grad); -webkit-background-clip: text; background-clip: text; color: transparent; padding-bottom: 0.02em; }
.t-hero .of { font-size: 26px; line-height: 1.08; font-weight: 500; letter-spacing: -0.02em; padding-bottom: 6px; }
.t-hero .of small { display: block; font-size: 15px; color: var(--muted); font-weight: 400; letter-spacing: 0; margin-top: 4px; }
.t-hero .note { max-width: 32ch; position: relative; z-index: 2; color: var(--muted); font-size: 13.5px; line-height: 1.45; }
.ringwrap { position: absolute; right: 22px; top: 50%; translate: 0 -54%; width: 236px; height: 236px; z-index: 0; }
.ringwrap svg { width: 100%; height: 100%; overflow: visible; }
.ring-trk { fill: none; stroke: var(--line); stroke-width: 11; }
.ring-seg { fill: none; stroke: var(--c); stroke-width: 11; stroke-dasharray: 0 999; transition: stroke-dasharray 1.1s var(--spring-soft) calc(var(--i) * 90ms); }
[data-theme='dark'] .ring-seg, :root:not([data-theme='light']) .ring-seg { filter: drop-shadow(0 0 6px color-mix(in oklab, var(--c) 60%, transparent)); }
.ring-sat { transform-box: fill-box; }
.ringwrap .mid { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
.ringwrap .mid b { font-weight: 500; font-size: 34px; letter-spacing: -0.03em; line-height: 1; }
.ringwrap .mid span { font: 500 10.5px var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--faint); margin-top: 5px; }
.t-ok { grid-column: 7 / 10; grid-row: 1 / 3; }
.t-diff { grid-column: 10 / 13; grid-row: 1 / 3; }
.t-mixed { grid-column: 7 / 9; grid-row: 3; } .t-doi { grid-column: 9 / 11; grid-row: 3; } .t-miss { grid-column: 11 / 13; grid-row: 3; }
.t-unk { grid-column: 1 / 5; grid-row: 4; border-style: dashed; border-color: var(--line-2); }
.t-strip { grid-column: 5 / 13; grid-row: 4; cursor: default; padding: 14px 16px; }
.t-ok .big, .t-diff .big { font-size: 96px; }
.t-mixed .big, .t-doi .big, .t-miss .big { font-size: 44px; }
.t-mixed, .t-doi, .t-miss { padding: 14px 16px; }
.t-mixed .hint, .t-doi .hint, .t-miss .hint, .go { display: none; }
.t-ok .foot, .t-diff .foot { flex-direction: column; align-items: flex-start; gap: 6px; }
.t-unk .big { font-size: 44px; }
.t-unk .row2 { display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; }
.stripcells { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 8px; flex: 1; margin-top: 8px; }
.cell { display: flex; flex-direction: column; align-items: center; justify-content: space-between; gap: 6px; padding: 8px 4px; border-radius: 12px; border: 1px solid color-mix(in oklab, var(--c) 28%, var(--line)); background: color-mix(in oklab, var(--c) 8%, transparent); min-height: 62px; transition: transform 0.4s var(--spring), border-color 0.2s; }
.cell:hover { transform: translateY(-3px); border-color: var(--c); }
.cell .mono { font-size: 11px; color: var(--muted); }
.t-strip .tp { justify-content: space-between; }

/* filter list */
.filters { display: flex; gap: 6px; flex-wrap: wrap; margin: 30px 0 12px; align-items: center; }
.filters .eyebrow { margin-right: 8px; }
.fchip { display: inline-flex; align-items: center; gap: 7px; min-height: 30px; padding: 0 12px 0 8px; border-radius: 99px; border: 1px solid var(--line-2); font-size: 13px; color: var(--muted); transition: all 0.25s; }
.fchip:hover { color: var(--text); border-color: var(--faint); }
.fchip[aria-pressed='true'] { color: var(--text); background: color-mix(in oklab, var(--c, var(--accent)) 16%, transparent); border-color: var(--c, var(--accent)); }
.fchip .gl { width: 16px; height: 16px; }
.fchip .n { font: 500 11.5px var(--mono); }
.list { border-radius: 20px; border: 1px solid var(--line); background: var(--tile-bg); box-shadow: var(--tile-shadow); overflow: hidden; }
.li { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto 20px; gap: 14px; align-items: center; width: 100%; min-height: 56px; padding: 10px 18px; border-top: 1px solid var(--line); transition: background 0.2s; }
.li:first-child { border-top: 0; }
.li:hover { background: color-mix(in oklab, var(--text) 4%, transparent); }
.li .ix { font: 500 12px var(--mono); color: var(--faint); }
.li .cite { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.li .chev { width: 16px; height: 16px; color: var(--faint); transition: transform 0.4s var(--spring); }
.li:hover .chev { transform: translateX(3px); color: var(--text); }
.li[hidden] { display: none; }

/* ───────────── Detail ───────────── */
.back { display: inline-flex; align-items: center; gap: 8px; min-height: 30px; color: var(--muted); font-size: 13px; margin-bottom: 18px; }
.back:hover { color: var(--text); }
.back svg { width: 15px; height: 15px; }
.d-head { display: flex; flex-direction: column; gap: 14px; margin-bottom: 26px; align-items: flex-start; }
.d-head h2 { font-weight: 500; font-size: 30px; line-height: 1.15; letter-spacing: -0.025em; max-width: 34ch; text-wrap: balance; }
.d-head .by { color: var(--muted); font-size: 14px; }
.d-grid { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 20px; align-items: start; }
.box { border-radius: 20px; border: 1px solid var(--line); background: var(--tile-bg); box-shadow: var(--tile-shadow); padding: 20px; position: relative; overflow: hidden; }
.box > h3 { font: 500 11.5px var(--mono); letter-spacing: 0.09em; text-transform: uppercase; color: var(--faint); margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.cmp { display: grid; }
.cmp-h, .cmp-r { display: grid; grid-template-columns: 112px minmax(0, 1fr) minmax(0, 1fr) 128px; gap: 16px; align-items: start; padding: 11px 0; }
.cmp-h { padding: 0 0 10px; font: 500 11.5px var(--mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--faint); }
.cmp-r { border-top: 1px solid var(--line); }
.cmp-r .f { color: var(--muted); font-size: 13px; padding-top: 1px; }
.cmp-r .val { font-size: 14px; line-height: 1.45; overflow-wrap: anywhere; }
.cmp-r .val .lab { display: none; }
.val.mono { font: 400 12.5px/1.6 var(--mono); }
.dv { font-weight: 600; background: color-mix(in oklab, var(--vf-diff) 20%, transparent); box-shadow: 0 2px 0 0 var(--vf-diff); border-radius: 3px; padding: 0 2px; margin: 0 -2px; text-decoration: none; }
.fstat { display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; font-weight: 500; min-height: 24px; white-space: nowrap; }
.fstat .gl { width: 18px; height: 18px; }
.fstat.same { color: var(--muted); font-weight: 400; }
.fstat.dev { color: var(--text); }
.sim { margin-top: 18px; display: flex; align-items: center; gap: 14px; padding-top: 16px; border-top: 1px solid var(--line); font-size: 13px; color: var(--muted); }
.sim .meter { flex: 1; height: 6px; border-radius: 4px; background: var(--line); position: relative; overflow: hidden; }
.sim .meter i { position: absolute; inset: 0 auto 0 0; width: var(--w); background: linear-gradient(90deg, var(--vf-diff), color-mix(in oklab, var(--vf-diff) 60%, white)); border-radius: 4px; box-shadow: 0 0 12px var(--vf-diff); }
.sim b { font: 500 13px var(--mono); color: var(--text); }
.fix { background: color-mix(in oklab, var(--text) 5%, transparent); border: 1px solid var(--line-2); border-radius: 14px; padding: 14px 14px 14px 14px; font: 400 12.5px/1.65 var(--mono); color: var(--text); overflow-wrap: anywhere; position: relative; }
.fix .dv { font-weight: 500; }
.fix-acts { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
.fix-note { font-size: 12.5px; color: var(--muted); margin-top: 12px; line-height: 1.45; }
.srcl { display: grid; }
.srci { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); align-items: start; }
.srci:first-child { border-top: 0; padding-top: 0; }
.srci .nm { font: 500 13px var(--mono); }
.srci .rs { font-size: 12.5px; color: var(--muted); line-height: 1.4; margin-top: 1px; }
.srci .ms { font: 400 11.5px var(--mono); color: var(--faint); padding-top: 2px; }
.srci .mk { width: 18px; height: 18px; }
.srci[data-m='ok'] .mk { color: var(--vf-ok); } .srci[data-m='x'] .mk { color: var(--vf-doi); }
.right { display: grid; gap: 20px; }
.callout { display: flex; gap: 10px; align-items: flex-start; padding: 14px 16px; border-radius: 14px; border: 1px solid var(--line); background: color-mix(in oklab, var(--accent) 7%, transparent); font-size: 13px; color: var(--muted); line-height: 1.45; margin-top: 18px; }
.callout svg { width: 16px; height: 16px; color: var(--accent); flex: none; margin-top: 2px; }

/* ───────────── Glass layers (floating only) ───────────── */
.glass { background: var(--glass-bg); -webkit-backdrop-filter: blur(30px) saturate(1.7); backdrop-filter: blur(30px) saturate(1.7); border: 1px solid var(--glass-line); box-shadow: var(--glass-hi), var(--glass-shadow); }
.layer { position: absolute; inset: 0; z-index: 40; display: none; }
.layer.open { display: block; }
.scrim { position: absolute; inset: 0; background: oklch(0.1 0.01 265 / 0.5); animation: fade 0.3s var(--out) both; }
[data-theme='light'] .scrim { background: oklch(0.3 0.05 260 / 0.22); }
@keyframes fade { from { opacity: 0; } }
.cmd { position: absolute; left: 50%; top: 12%; translate: -50% 0; width: min(580px, calc(100% - 28px)); border-radius: 20px; overflow: hidden; animation: cmdin 0.6s var(--spring) both; }
@keyframes cmdin { from { opacity: 0; transform: translateY(-14px) scale(0.96); } }
.cmd-in { display: flex; align-items: center; gap: 12px; padding: 0 18px; height: 56px; border-bottom: 1px solid var(--line); }
.cmd-in svg { width: 18px; height: 18px; color: var(--muted); flex: none; }
.cmd-in input { flex: 1; min-width: 0; height: 40px; background: transparent; border: 0; outline: 0; color: var(--text); font: 400 16px var(--sans); }
.cmd-in input::placeholder { color: var(--muted); }
.cmd-list { padding: 8px; max-height: 360px; overflow-y: auto; }
.cmd-g { font: 500 11px var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); padding: 10px 10px 6px; }
.cmd-i { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 40px; padding: 0 10px; border-radius: 11px; font-size: 14px; }
.cmd-i[aria-selected='true'] { background: color-mix(in oklab, var(--accent) 20%, transparent); box-shadow: inset 0 0 0 1px color-mix(in oklab, var(--accent) 45%, transparent); }
.cmd-i svg.ic { width: 17px; height: 17px; color: var(--muted); flex: none; }
.cmd-i .k { margin-left: auto; display: flex; gap: 3px; }
.cmd-i .sub { color: var(--muted); font-size: 12.5px; margin-left: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cmd-foot { display: flex; gap: 14px; padding: 10px 16px; border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); }
.cmd-foot span { display: inline-flex; align-items: center; gap: 6px; }
.toasts { position: absolute; left: 0; right: 0; bottom: 22px; z-index: 50; display: grid; justify-items: center; gap: 8px; pointer-events: none; }
.toast { pointer-events: auto; display: inline-flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 18px 0 12px; border-radius: 99px; font-size: 13.5px; font-weight: 500; animation: toastin 0.7s var(--spring) both; }
@keyframes toastin { from { opacity: 0; transform: translateY(20px) scale(0.9); } }
.toast.out { animation: toastout 0.3s var(--out) forwards; }
@keyframes toastout { to { opacity: 0; transform: translateY(10px) scale(0.96); } }

/* ───────────── Brand sheet ───────────── */
.sheet { display: grid; gap: 22px; }
.sheet h2 { font-weight: 500; font-size: 30px; letter-spacing: -0.03em; margin-top: 6px; }
.sheet .sec { border-radius: 22px; border: 1px solid var(--line); background: var(--tile-bg); box-shadow: var(--tile-shadow); padding: 22px; }
.sheet .sec > h3 { font: 500 11.5px var(--mono); letter-spacing: 0.09em; text-transform: uppercase; color: var(--faint); margin-bottom: 16px; }
.mk-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
.mk-stage { border-radius: 16px; padding: 22px; background: var(--bg); color: var(--text); border: 1px solid var(--line); display: grid; gap: 22px; align-items: center; position: relative; overflow: hidden; }
.mk-stage::before { content: ''; position: absolute; inset: 0; background: radial-gradient(60% 70% at 20% 0, var(--glow-a), transparent 70%); opacity: 0.7; }
.mk-stage > * { position: relative; }
.mk-row { display: flex; align-items: flex-end; gap: 26px; flex-wrap: wrap; }
.mk-row figure { margin: 0; display: grid; gap: 8px; justify-items: start; }
.mk-row figcaption { font: 400 11px var(--mono); color: var(--faint); }
.mk-stage .lockup svg { height: 40px; width: auto; }
.mk-note { margin-top: 14px; font-size: 13px; color: var(--muted); max-width: 70ch; line-height: 1.5; }
.sw-wrap { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
.sw-scope { border-radius: 16px; padding: 16px; background: var(--bg); color: var(--text); border: 1px solid var(--line); }
.sw-scope > h4 { font: 500 11.5px var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-bottom: 12px; }
.sw { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 12px; align-items: center; padding: 6px 0; }
.sw .chipc { width: 34px; height: 34px; border-radius: 10px; box-shadow: inset 0 0 0 1px var(--line-2); }
.sw .tn { font: 500 12px var(--mono); }
.sw .tv { font: 400 11.5px var(--mono); color: var(--muted); overflow-wrap: anywhere; }
.vrow { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 12px; align-items: center; padding: 7px 0; border-top: 1px solid var(--line); }
.vrow:first-of-type { border-top: 0; }
.vrow .tn { font-size: 13px; font-weight: 500; }
.vrow .tv { font: 400 11px var(--mono); color: var(--muted); overflow-wrap: anywhere; }
.type-row { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 20px; align-items: baseline; padding: 14px 0; border-top: 1px solid var(--line); }
.type-row:first-of-type { border-top: 0; }
.type-row .meta { font: 400 11px var(--mono); color: var(--faint); }

/* ───────────── Prototype dock (not part of the design) ───────────── */
.dock { position: fixed; z-index: 1000; left: 50%; bottom: 14px; translate: -50% 0; display: flex; align-items: center; gap: 4px; padding: 5px; border-radius: 12px; background: #111; color: #eee; border: 1px dashed #777; font: 500 12px/1 ui-monospace, Menlo, monospace; box-shadow: 0 10px 30px rgba(0,0,0,.5); max-width: calc(100vw - 16px); flex-wrap: wrap; justify-content: center; }
.dock .tag { padding: 0 8px; color: #ffd24a; letter-spacing: .08em; font-size: 10.5px; }
.dock button { min-height: 28px; min-width: 28px; padding: 0 9px; border-radius: 8px; color: #eee; background: #262626; font: inherit; }
.dock button:hover { background: #3a3a3a; }
.dock button[aria-pressed='true'], .dock button[aria-current='true'] { background: #ffd24a; color: #111; }
.dock .sep { width: 1px; height: 18px; background: #444; margin: 0 4px; }
body.clean .dock { display: none; }
.dock :focus-visible { outline-color: #ffd24a; }

/* ───────────── Compact (panel) via container queries ───────────── */
@container app (max-width: 720px) {
  .top { grid-template-columns: 1fr auto; height: 52px; padding: 0 14px; }
  .top .nav, .cmdbtn .lbl, .cmdbtn .k, .avatar { display: none; }
  .cmdbtn { min-width: 0; width: 36px; height: 36px; padding: 0; justify-content: center; }
  .cmdbtn .lbl-short { display: block; }
  .tabbar { display: grid; grid-template-columns: repeat(3, 1fr); flex: none; height: 56px; border-top: 1px solid var(--line); background: color-mix(in oklab, var(--surface) 88%, transparent); position: relative; z-index: 5; }

  .tile .big { font-size: 40px; }

@container app (min-width: 721px) and (max-width: 1000px) {

      <div class="acts"><button class="btn sm" data-act="newcheck">${t('new_check')}</button><button class="btn sm" data-act="exp">${icon('down')} ${t('export')}</button></div></div>
    <div class="bento">
      <article class="tile t-hero" style="--i:0">
        <span class="tp"><span class="eyebrow">${t('sum_refs')} · 8</span></span>
        <div class="headline"><span class="num" data-count="${c.ok}">${c.ok}</span><span class="of">${t('sum_of')}<small>${t('sum_correct')}</small></span></div>
        <p class="note">${t('sum_note', { n: bad })}</p>
        <div class="ringwrap">${ringHTML(c)}<div class="mid"><b>8</b><span>${t('sum_refs')}</span></div></div>
      </article>
      ${tile('ok', c, 1)}${tile('diff', c, 2)}${tile('mixed', c, 3)}${tile('doi', c, 4)}${tile('miss', c, 5)}${tile('unk', c, 6)}
      <article class="tile t-strip" style="--i:7">
        <span class="tp"><span class="eyebrow">${t('sum_glance')}</span></span>
        <div class="stripcells">${REFS.map((r, i) => `<button class="cell v-${r.k}" data-ref="${i}" aria-label="${pad(i + 1)} ${esc(vl(r.k))}">${gl(r.k)}<span class="mono">${pad(i + 1)}</span></button>`).join('')}</div>
      </article>
    </div>
    <div class="filters" role="group" aria-label="${t('filter')}">
      <span class="eyebrow">${t('filter')}</span>
      <button class="fchip" data-filter="all" aria-pressed="${S.filter === 'all'}">${t('all')} <span class="n">8</span></button>
      ${ORDER.filter((k) => c[k]).map((k) => `<button class="fchip v-${k}" data-filter="${k}" aria-pressed="${S.filter === k}">${gl(k)}${esc(vl(k))} <span class="n">${c[k]}</span></button>`).join('')}
    </div>
    <div class="list" id="list"></div>
  </div>`;
  paintList();
  $$('#view [data-filter]').forEach((b) => b.addEventListener('click', () => { S.filter = S.filter === b.dataset.filter ? 'all' : b.dataset.filter; $$('#view [data-filter]').forEach((x) => x.setAttribute('aria-pressed', String(x.dataset.filter === S.filter))); paintList(); sync(); }));
  $$('#view [data-ref]').forEach((b) => b.addEventListener('click', () => { S.ref = +b.dataset.ref; go('detail'); }));
  const nc = $('[data-act="newcheck"]'); if (nc) nc.onclick = () => go('intake');
  const ex = $('[data-act="exp"]'); if (ex) ex.onclick = () => toast(t('toast_na', { x: t('export') }));
  // ring + count-up
  const fire = () => $$('.ring-seg').forEach((s) => { s.style.strokeDasharray = `${s.dataset.len} ${s.dataset.c}`; });
  if (still) { fire(); } else requestAnimationFrame(() => requestAnimationFrame(fire));
  $$('[data-count]').forEach(countUp);
}
function paintList() {
  const idx = REFS.map((r, i) => i).filter((i) => S.filter === 'all' || REFS[i].k === S.filter);
  $('#list').innerHTML = idx.map((i) => { const r = REFS[i]; return `<button class="li v-${r.k}" data-ref="${i}"><span class="ix">${pad(i + 1)}</span>${cite(r, false)}${chip(r.k)}<svg class="chev" aria-hidden="true"><use href="#i-chev"/></svg></button>`; }).join('');
  $$('#list [data-ref]').forEach((b) => b.addEventListener('click', () => { S.ref = +b.dataset.ref; go('detail'); }));
}
function countUp(el) {
  const target = +el.dataset.count; if (still || !target) { el.textContent = target; return; }
  const t0 = performance.now() + 150, d = 900; el.textContent = 0;
  const f = (n) => { const p = Math.min(1, Math.max(0, (n - t0) / d)), e = 1 - Math.pow(1 - p, 3); el.textContent = Math.round(target * e); if (p < 1) countRafs.push(requestAnimationFrame(f)); };
  countRafs.push(requestAnimationFrame(f));
}

function dv(s) { return esc(s).replace(/\{\{(.+?)\}\}/g, '<span class="dv">$1</span>'); }
function fieldsFor(r, i) {
  if (i === 2) return MAYER.fields.map((f) => ({ ...f, dev: /\{\{/.test(f.a) }));
  if (r.k !== 'ok') return null;
  const f = [{ l: ['Autor:in', 'Author'], a: r.au, b: r.au }, { l: ['Jahr', 'Year'], a: String(r.yr), b: String(r.yr) }, { l: ['Titel', 'Title'], a: r.ti, b: r.ti }];
  if (r.ve) f.push({ l: ['Quelle', 'Source'], a: r.ve, b: r.ve });
  if (r.doi) f.push({ l: [/^10\./.test(r.doi) ? 'DOI' : 'ISBN', /^10\./.test(r.doi) ? 'DOI' : 'ISBN'], a: r.doi.replace('ISBN ', ''), b: r.doi.replace('ISBN ', ''), mono: true });
  return f;
}
function mountDetail() {
  const i = S.ref, r = REFS[i], f = fieldsFor(r, i), ndev = f ? f.filter((x) => x.dev).length : 0;
  const srcs = i === 2 ? MAYER.sources : (() => { const g = {}; r.trail.forEach((s) => { (g[s.src] = g[s.src] || []).push(L([s.de, s.en])); }); return Object.entries(g).map(([n, a]) => [n, r.k === 'ok' ? 'ok' : (r.k === 'miss' || r.k === 'unk') ? 'none' : 'x', a.join(' · '), '']); })();
  const fixBox = i === 2 ? `
    <div class="box"><h3>${t('d_fix')}</h3>
      <div class="fix" id="fixtxt">${MAYER.fixHTML}</div>
      <div class="fix-acts"><button class="btn primary sm" id="copy">${icon('copy')} <span id="copylbl">${t('d_copy')}</span></button></div>
      <p class="fix-note">${t('d_fixnote')}</p></div>` : `
    <div class="box"><h3>${t('d_find')}</h3><p style="font-size:14px;line-height:1.55">${esc(L(r.why || ['Alle Angaben stimmen mit dem Treffer überein. Es ist keine Korrektur nötig.', 'All details agree with the match. No correction is needed.']))}</p></div>`;
  view.innerHTML = `
  <div class="canvas">
    <button class="back" id="back">${icon('back')} ${t('d_back')}</button>
    <div class="d-head">
      ${chip(r.k, 'lg')}
      <h2>${esc(r.ti)}</h2>
      <p class="by">${esc(r.au)} · ${r.yr}${r.ve ? ' · ' + esc(r.ve) : ''}</p>
    </div>
    <div class="d-grid">
      <div>
        <div class="box"><h3><span>${t('d_cmp')}</span>${f ? `<span class="mono" style="letter-spacing:0;text-transform:none">${ndev}/${f.length} ${t('d_dev').toLowerCase()}</span>` : ''}</h3>
        ${f ? `<div class="cmp">
          <div class="cmp-h"><span></span><span>${t('d_yours')}</span><span>${t('d_best')}</span><span>Status</span></div>
          ${f.map((x) => `<div class="cmp-r"><span class="f">${L(x.l)}</span>
            <span class="val ${x.mono ? 'mono' : ''}"><span class="lab">${t('d_yours')}</span><span>${dv(x.a)}</span></span>
            <span class="val ${x.mono ? 'mono' : ''}"><span class="lab">${t('d_best')}</span><span>${dv(x.b)}</span></span>
            <span class="fstat ${x.dev ? 'dev v-diff' : 'same v-ok'}">${gl(x.dev ? 'diff' : 'ok')}${x.dev ? t('d_dev') : t('d_same')}</span></div>`).join('')}
        </div>
        ${i === 2 ? `<div class="sim"><span>${t('d_sim')}</span><span class="meter" aria-hidden="true"><i style="--w:${MAYER.sim}%"></i></span><b>${MAYER.sim} %</b></div>` : ''}`
        : `<p style="color:var(--muted);font-size:14px">${t('d_nobest')}</p>`}
        <div class="callout">${icon('info')}<span>${t('d_hint')}</span></div></div>
      </div>
      <div class="right">
        ${fixBox}
        <div class="box"><h3>${t('d_src')}</h3><div class="srcl">${srcs.map(([n, m, tx, ms]) => `<div class="srci" data-m="${m === 'none' ? 'none' : m}"><svg class="mk" aria-hidden="true"><use href="#m-${m === 'none' ? 'none' : m === 'ok' ? 'ok' : 'x'}"/></svg><div><div class="nm">${n}</div><div class="rs">${esc(L(tx))}</div></div><span class="ms">${ms}</span></div>`).join('')}</div></div>
      </div>
    </div>
  </div>`;
  $('#back').addEventListener('click', () => go('summary'));
  const cp = $('#copy');
  if (cp) cp.addEventListener('click', async () => {
    try { await navigator.clipboard.writeText(MAYER.fix); } catch (e) { const ta = document.createElement('textarea'); ta.value = MAYER.fix; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); } catch (_) {} ta.remove(); }
    $('#copylbl').textContent = t('d_copied'); toast(t('toast_copied'), 'ok'); setTimeout(() => { const l = $('#copylbl'); if (l) l.textContent = t('d_copy'); }, 1800);
  });
}

/* ───────────── Brand sheet ───────────── */
function mountBrand() {
  const mk = (sz, bare) => `<svg width="${sz}" height="${sz}" viewBox="0 0 32 32" role="img" aria-label="Source Taster"><use href="#${bare ? 'mark-bare' : 'mark'}"/></svg>`;
  const neutrals = [['--bg', 'Canvas'], ['--surface', 'Surface'], ['--surface-2', 'Surface 2'], ['--text', 'Text'], ['--muted', 'Muted'], ['--faint', 'Faint'], ['--line', 'Hairline']];
  const accents = [['--accent', 'Accent (text, glow)'], ['--accent-fill', 'Accent fill'], ['--accent-ink', 'Ink on accent']];
  const vk = [['ok', '--vf-ok'], ['diff', '--vf-diff'], ['mixed', '--vf-mixed'], ['doi', '--vf-doi'], ['miss', '--vf-miss'], ['unk', '--vf-unk']];
  const scope = (cls, name) => `
    <div class="sw-scope ${cls}" data-scope><h4>${name}</h4>
      ${neutrals.map(([v, n]) => `<div class="sw"><span class="chipc" style="background:var(${v})"></span><div><div class="tn">${n}</div><div class="tv" data-tok="${v}"></div></div></div>`).join('')}
      ${accents.map(([v, n]) => `<div class="sw"><span class="chipc" style="background:var(${v})"></span><div><div class="tn">${n}</div><div class="tv" data-tok="${v}"></div></div></div>`).join('')}
      <div style="height:10px"></div>
      ${vk.map(([k, v]) => `<div class="vrow v-${k}">${gl(k, 'lg')}<div><div class="tn" style="color:var(--vt)">${esc(vl(k))}</div><div class="tv" data-tok="${v}"></div></div></div>`).join('')}
    </div>`;
  const stage = (cls, name) => `
    <div class="mk-stage ${cls}"><span class="eyebrow">${name}</span>
      <div class="mk-row"><figure>${mk(128)}<figcaption>128</figcaption></figure><figure>${mk(32)}<figcaption>32</figcaption></figure><figure>${mk(16)}<figcaption>16</figcaption></figure><figure>${mk(16, true)}<figcaption>16 bare</figcaption></figure></div>
      <div class="lockup"><svg viewBox="0 0 156 32" width="156" height="32" role="img" aria-label="Source Taster"><use href="#lockup"/></svg></div>
    </div>`;
  view.innerHTML = `
  <div class="canvas sheet">
    <div><p class="eyebrow">Source Taster · Luminous</p><h2>${t('bs_title')}</h2></div>
    <section class="sec"><h3>01 · Zeichen &amp; Wortmarke</h3>
      <div class="mk-grid">${stage('t-dark', 'Dark')}${stage('t-light', 'Light')}</div>
      <p class="mk-note">Eine offene Linse mit einer leuchtenden Probe am Rand: prüfen heißt hinschauen, eine Stichprobe nehmen. Der Punkt ist die Quelle des Lichts im ganzen System: Er kehrt als Glow im Hintergrund, im Fokus und in der Fortschrittsleiste wieder.</p></section>
    <section class="sec"><h3>02 · Palette · OKLCH</h3><div class="sw-wrap">${scope('t-dark', 'Dark · Standard')}${scope('t-light', 'Light')}</div></section>
    <section class="sec"><h3>03 · Urteile: sechs Formen, nie nur Farbe</h3><div class="sw-wrap">
      ${['t-dark', 't-light'].map((cls) => `<div class="sw-scope ${cls}"><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:16px 8px">${ORDER.map((k) => `<div class="v-${k}" style="display:grid;gap:8px;justify-items:center;text-align:center">${gl(k, 'xl')}<span style="font-size:12px;color:var(--vt);line-height:1.25">${esc(vl(k))}</span></div>`).join('')}</div></div>`).join('')}
    </div></section>
    <section class="sec"><h3>04 · Typografie · IBM Plex Sans &amp; Plex Mono</h3>
      <div class="type-row"><span class="meta">Display · 500 · −0.05em</span><span style="font-size:clamp(48px,9vw,96px);line-height:.95;font-weight:500;letter-spacing:-0.05em" class="">3 von 8</span></div>
      <div class="type-row"><span class="meta">H1 · 500 · 30/34</span><span style="font-size:30px;line-height:1.15;font-weight:500;letter-spacing:-0.03em">Welche Literaturliste soll geprüft werden?</span></div>
      <div class="type-row"><span class="meta">Body · 400 · 14.5/21</span><span style="max-width:62ch">Jede Referenz wird mit offenen Katalogen abgeglichen. Existiert das Werk, stimmen Titel, Jahr und Seiten? Sie sehen jeden einzelnen Beleg und entscheiden selbst.</span></div>
      <div class="type-row"><span class="meta">Label · 600 · 13</span><span style="font-size:13px;font-weight:600">Existiert, mit Abweichungen · Nicht verifizierbar</span></div>
      <div class="type-row"><span class="meta">Mono · Plex Mono 400</span><span class="mono" style="font-size:13px;line-height:1.7">doi:10.3217/zfhe-14-03/04<br>Crossref ✓ DOI gefunden · Jahr weicht ab (2019 → 2020)<br>0123456789 · 45–62 → 45–61</span></div>
    </section>
  </div>`;
  $$('[data-scope]').forEach((sc) => $$('[data-tok]', sc).forEach((e) => (e.textContent = getComputedStyle(sc).getPropertyValue(e.dataset.tok).trim().replace(/\s+/g, ' '))));
}

/* ───────────── Command bar (glass) ───────────── */
let cmdSel = 0, cmdItems = [];
function buildCmd(q) {
  const A = [
    { ic: 'scan', l: t('c_new'), run: () => go('intake'), k: ['N'] },
    { ic: 'play', l: t('c_run'), run: () => go('running'), k: ['⌘', '↵'] },
    { ic: 'file', l: t('c_res'), run: () => go('summary'), k: ['G'] },
    { ic: 'info', l: t('c_brand'), run: () => go('brand') },
  ];
  const Vw = [{ ic: 'clock', l: t('c_theme'), run: () => setTheme(S.theme === 'dark' ? 'light' : 'dark'), k: ['⌘', 'J'] }];
  const R = REFS.map((r, i) => ({ ic: 'chev', l: `${r.au.split(',')[0]} (${r.yr})`, sub: vl(r.k), run: () => { S.ref = i; go('detail'); }, ref: true, g: r.k }));
  const m = (x) => !q || (x.l + ' ' + (x.sub || '')).toLowerCase().includes(q.toLowerCase());
  const groups = [[t('cmd_actions'), A.filter(m)], [t('cmd_refs'), R.filter(m).slice(0, q ? 8 : 4)], [t('cmd_view'), Vw.filter(m)]].filter((g) => g[1].length);
  return groups;
}
function paintCmd() {
  const q = $('#cmdin').value, groups = buildCmd(q); cmdItems = groups.flatMap((g) => g[1]);
  cmdSel = Math.min(cmdSel, Math.max(0, cmdItems.length - 1)); let n = 0;
  $('#cmdlist').innerHTML = groups.length ? groups.map(([g, items]) => `<div class="cmd-g" role="presentation">${g}</div>` + items.map((it) => { const i = n++; return `<button class="cmd-i" role="option" id="ci${i}" data-n="${i}" aria-selected="${i === cmdSel}">${it.g ? `<span class="v-${it.g}" style="display:inline-flex">${gl(it.g)}</span>` : `<svg class="ic" aria-hidden="true"><use href="#i-${it.ic}"/></svg>`}<span>${esc(it.l)}</span>${it.sub ? `<span class="sub">${esc(it.sub)}</span>` : ''}${it.k ? `<span class="k">${it.k.map((x) => `<kbd>${x}</kbd>`).join('')}</span>` : ''}</button>`; }).join('')).join('') : `<div class="cmd-g">${t('cmd_none')}</div>`;
  $$('#cmdlist .cmd-i').forEach((b) => { b.addEventListener('mousemove', () => { cmdSel = +b.dataset.n; $$('#cmdlist .cmd-i').forEach((x) => x.setAttribute('aria-selected', String(+x.dataset.n === cmdSel))); }); b.addEventListener('click', () => runCmd(+b.dataset.n)); });
  $('#cmdin').setAttribute('aria-activedescendant', 'ci' + cmdSel);
}
function runCmd(n) { const it = cmdItems[n]; closeCmd(true); if (it) it.run(); }
function openCmd() { if (cmdOpen) return; cmdOpen = true; cmdFrom = document.activeElement; $('#cmdlayer').classList.add('open'); $('#cmdin').value = P.get('q') || ''; cmdSel = 0; paintCmd(); $('#cmdin').focus(); sync(); }
function closeCmd(skipFocus) { if (!cmdOpen) return; cmdOpen = false; $('#cmdlayer').classList.remove('open'); if (!skipFocus && cmdFrom && cmdFrom.focus) cmdFrom.focus(); sync(); }
$('#cmdin').addEventListener('input', () => { cmdSel = 0; paintCmd(); });
$('#cmdin').addEventListener('keydown', (e) => {
  if (e.key === 'ArrowDown') { e.preventDefault(); cmdSel = (cmdSel + 1) % Math.max(1, cmdItems.length); paintCmd(); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); cmdSel = (cmdSel - 1 + cmdItems.length) % Math.max(1, cmdItems.length); paintCmd(); }
  else if (e.key === 'Enter') { e.preventDefault(); runCmd(cmdSel); }
  else if (e.key === 'Tab') e.preventDefault();
});
$('#cmdscrim').addEventListener('click', () => closeCmd());
$('#cmdbtn').addEventListener('click', openCmd);
document.addEventListener('keydown', (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); cmdOpen ? closeCmd() : openCmd(); }
  else if (e.key === 'Escape' && cmdOpen) { e.preventDefault(); closeCmd(); }
});

/* ───────────── Toast (glass) ───────────── */
function toast(msg, kind) {
  const el = document.createElement('div'); el.className = 'toast glass';
  el.innerHTML = (kind === 'ok' ? `<span class="v-ok" style="display:inline-flex">${gl('ok')}</span>` : `<svg class="mk" style="width:18px;height:18px;color:var(--accent)" aria-hidden="true"><use href="#m-ok"/></svg>`) + `<span>${esc(msg)}</span>`;
  if (kind !== 'ok') el.querySelector('svg').innerHTML = '<use href="#i-info"/>';
  $('#toasts').appendChild(el);
  setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 320); }, 2600);
}

/* ───────────── Controls ───────────── */
function go(state) {
  clearTimeout(autoTimer); if (cmdOpen) closeCmd(true);
  const apply = () => { S.state = state; if (state !== 'running') S.at = null; mount(); };
  if (document.startViewTransition && !still) { const vt = document.startViewTransition(apply); [vt.ready, vt.finished].forEach((x) => x.catch(() => {})); } else apply();
}
function setTheme(th) { S.theme = th; root.dataset.theme = th; sync(); }
function sync() {
  root.dataset.theme = S.theme; root.dataset.width = S.width;
  app.classList.toggle('grey', S.grey);
  $('[data-act="grey"]').setAttribute('aria-pressed', String(S.grey));
  $('[data-act="auto"]').setAttribute('aria-pressed', String(S.auto));
  const q = new URLSearchParams(); q.set('state', S.state); q.set('theme', S.theme); q.set('width', S.width);
  if (S.grey) q.set('grey', '1'); if (lang) q.set('lang', 'en'); if (S.filter !== 'all') q.set('filter', S.filter); if (S.state === 'detail') q.set('ref', S.ref);
  if (P.has('clean')) q.set('clean', '1'); if (P.has('still')) q.set('still', '1'); if (S.at != null && S.state === 'running') q.set('at', S.at); if (cmdOpen) q.set('cmd', '1');
  try { history.replaceState(null, '', '?' + q); } catch (e) {}
}
$('#dock').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.step) { S.at = null; go(b.dataset.step); }
  const a = b.dataset.act;
  if (a === 'theme') setTheme(S.theme === 'dark' ? 'light' : 'dark');
  if (a === 'width') { S.width = S.width === 'web' ? 'panel' : 'web'; sync(); mount(); }
  if (a === 'grey') { S.grey = !S.grey; sync(); }
  if (a === 'lang') { lang = lang ? 0 : 1; mountNav(); mount(); }
  if (a === 'brand') go('brand');
  if (a === 'cmd') openCmd();
  if (a === 'auto') { S.auto = !S.auto; sync(); if (S.auto) autoPlay(); else clearTimeout(autoTimer); }
});
$('#brand').addEventListener('click', () => go('intake'));
function autoPlay() {
  clearTimeout(autoTimer);
  const seq = [['intake', 2200], ['running', 0], ['summary', 4500], ['detail', 4500]];
  let i = Math.max(0, seq.findIndex((s) => s[0] === S.state));
  const step = () => { if (!S.auto) return; const [st, d] = seq[i]; S.at = null; go(st); i = (i + 1) % seq.length; if (st !== 'running') autoTimer = setTimeout(step, d); else autoTimer = setTimeout(step, RUN_END + 2800); };
  step();
}

/* ───────────── Boot ───────────── */
mountNav(); mount();
if (P.has('cmd')) openCmd();
if (S.auto) autoPlay();
window.__ready = true;
})();
