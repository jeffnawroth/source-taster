services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - apps/api/.env
    ports:
      - '8000:8000'
    volumes:
      - ./apps/api/.keystore:/app/.keystore
    environment:
      DATABASE_URL: postgres://sourcetaster:${POSTGRES_PASSWORD:-sourcetaster_pg}@postgres:5432/sourcetaster
      ANYSTYLE_SERVER_URL: http://anystyle:4567
      LOKI_URL: http://loki:3100
      NODE_ENV: production
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_SERVICE_NAME: source-taster-api
      ALLOWED_WEB_ORIGINS: https://sourcetaster.com,https://www.sourcetaster.com
    restart: unless-stopped
    healthcheck:
      test: [CMD, node, -e, "fetch('http://localhost:8000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    depends_on:
      anystyle:
        condition: service_healthy
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sourcetaster
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sourcetaster_pg}
      POSTGRES_DB: sourcetaster
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U sourcetaster -d sourcetaster']
      interval: 10s
      timeout: 5s
      retries: 5

  anystyle:
    build:
      context: apps/api
      dockerfile: Dockerfile.anystyle
    ports:
      - '4567:4567'
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, 'curl -s -o /dev/null http://localhost:4567/ || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  docs:
    build:
      context: .
      dockerfile: apps/docs/Dockerfile
    ports:
      - '8080:80'
    restart: unless-stopped
    healthcheck:
      test: [CMD, curl, -f, 'http://localhost:80/']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  landing:
    build:
      context: .
      dockerfile: apps/landing/Dockerfile
    ports:
      - '8083:80'
    restart: unless-stopped
    healthcheck:
      test: [CMD, curl, -f, 'http://localhost:80/']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    # statische Astro-Site — kein depends_on nötig

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - '8084:80'
    restart: unless-stopped
    healthcheck:
      test: [CMD, curl, -f, 'http://localhost:80/']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    ports:
      - '8082:8080'
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    privileged: true
    devices:
      - /dev/kmsg
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    ports:
      - '9090:9090'
    volumes:
      - ./apps/api/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
    restart: unless-stopped

  loki:
    image: grafana/loki:latest
    ports:
      - '3100:3100'
    volumes:
      - ./apps/api/loki-config.yml:/etc/loki/config.yml
    command:
      - --config.file=/etc/loki/config.yml
    restart: unless-stopped

  promtail:
    image: grafana/promtail:latest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./apps/api/promtail-config.yml:/etc/promtail/config.yml
    restart: unless-stopped
    depends_on:
      - loki

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    volumes:
      - ./apps/api/otel-collector.yml:/etc/otel-collector.yml
    command: --config=/etc/otel-collector.yml
    ports:
      - '4318:4318'
    restart: unless-stopped

  tempo:
    image: grafana/tempo:latest
    volumes:
      - ./apps/api/tempo-config.yml:/etc/tempo.yml
    command: --config.file=/etc/tempo.yml
    ports:
      - '3200:3200'
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    ports:
      - '3000:3000'
    volumes:
      - ./apps/api/grafana/datasources:/etc/grafana/provisioning/datasources
      - ./apps/api/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./apps/api/grafana/alerting:/etc/grafana/provisioning/alerting
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/observability.json
      GF_FEATURE_TOGGLE_ENABLE: alertingSimplifiedRouting
      # SMTP — setze GF_SMTP_HOST / GF_SMTP_USER / GF_SMTP_PASSWORD als Environment-Variablen
      GF_SMTP_ENABLED: 'true'
      GF_SMTP_HOST: ${GF_SMTP_HOST:-}
      GF_SMTP_USER: ${GF_SMTP_USER:-}
      GF_SMTP_PASSWORD: ${GF_SMTP_PASSWORD:-}
      GF_SMTP_FROM_ADDRESS: contact@jeffnawroth.me
      GF_SMTP_FROM_NAME: Source Taster Alerts
    restart: unless-stopped

volumes:
  pgdata:
