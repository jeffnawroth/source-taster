services:
  api:
    image: ghcr.io/jeffnawroth/source-taster-api:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - apps/api/.env
    ports:
      - '8000:8000'
    volumes:
      - ./apps/api/.keystore:/app/.keystore
    environment:
      DATABASE_URL: postgres://sourcetaster:${POSTGRES_PASSWORD:-sourcetaster_pg}@postgres:5432/sourcetaster
      ANYSTYLE_SERVER_URL: http://anystyle:4567
      NODE_ENV: production
      ALLOWED_WEB_ORIGINS: https://sourcetaster.com,https://www.sourcetaster.com
    restart: unless-stopped
    healthcheck:
      test: [CMD, node, -e, "fetch('http://localhost:8000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    depends_on:
      anystyle:
        condition: service_healthy
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sourcetaster
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sourcetaster_pg}
      POSTGRES_DB: sourcetaster
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U sourcetaster -d sourcetaster']
      interval: 10s
      timeout: 5s
      retries: 5

  anystyle:
    image: ghcr.io/jeffnawroth/source-taster-anystyle:${IMAGE_TAG:-latest}
    build:
      context: apps/api
      dockerfile: Dockerfile.anystyle
    ports:
      - '4567:4567'
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, 'curl -s -o /dev/null http://localhost:4567/ || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  docs:
    image: ghcr.io/jeffnawroth/source-taster-docs:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: apps/docs/Dockerfile
    ports:
      - '8080:80'
    restart: unless-stopped
    healthcheck:
      test: [CMD, curl, -f, 'http://localhost:80/']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  landing:
    image: ghcr.io/jeffnawroth/source-taster-landing:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: apps/landing/Dockerfile
    ports:
      - '8083:80'
    restart: unless-stopped
    healthcheck:
      test: [CMD, curl, -f, 'http://localhost:80/']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    # statische Astro-Site — kein depends_on nötig

  web:
    image: ghcr.io/jeffnawroth/source-taster-web:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - '8084:80'
    restart: unless-stopped
    healthcheck:
      test: [CMD, curl, -f, 'http://localhost:80/']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  pgdata:
