# Local PostgreSQL for development and tests. Start with `docker compose up -d`,
# then run `pnpm db:setup` to create the role, databases and schemas.
name: st-verification-dev

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  pgdata:
