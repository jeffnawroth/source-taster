packages:
  - apps/*
  - packages/*

saveExact: true
engineStrict: true
allowBuilds:
  "@prisma/engines": true
  prisma: true
minimumReleaseAgeExclude:
  - "@tanstack/query-core@5.105.0"
  - "@tanstack/react-query@5.105.0"
# The static website has no raster images; Astro's optional sharp/libvips
# (LGPL-3.0 native) image service stays out of the graph (#115).
ignoredOptionalDependencies:
  - sharp
  - fsevents
  # ADR-0011: PDF.js text extraction runs without the optional native canvas.
  - "@napi-rs/canvas"
