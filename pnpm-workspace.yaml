packages:
  - apps/*
  - packages/*

saveExact: true
engineStrict: true
allowBuilds:
  "@prisma/engines": true
  prisma: true
  # core-js-pure only prints a funding message; no generated runtime assets.
  core-js-pure: false
minimumReleaseAgeExclude:
  - "@tanstack/query-core@5.105.0"
  - "@tanstack/react-query@5.105.0"
# The static website has no raster images; Astro's optional sharp/libvips
# (LGPL-3.0 native) image service stays out of the graph (#115).
ignoredOptionalDependencies:
  - sharp
  - fsevents
