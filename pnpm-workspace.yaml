packages:
  - apps/*
  - packages/*

saveExact: true
engineStrict: true
allowBuilds:
  "@prisma/engines": true
  prisma: true
  # core-js-pure only prints a funding message; no generated runtime assets.
  core-js-pure: false
# GHSA-g3hv-75wg-m249 (CVE-2026-118764): minimatch <11.0.1 amplifies globParts.
# eslint's @eslint/config-array and typescript-estree still range ^10, so the
# patched release is forced exact until they publish a fixed range; drop this
# override then. The audit blocks on every actual advisory and has no waiver.
overrides:
  minimatch: 11.0.3
minimumReleaseAgeExclude:
  - "@tanstack/query-core@5.105.0"
  - "@tanstack/react-query@5.105.0"
# The static website processes no raster images: its only PNG/ICO files are
# the committed brand favicons, copied byte for byte (#214). Astro's optional
# sharp/libvips (LGPL-3.0 native) image service stays out of the graph (#115).
ignoredOptionalDependencies:
  - sharp
  - fsevents
  # ADR-0011: PDF.js text extraction runs without the optional native canvas.
  - "@napi-rs/canvas"
